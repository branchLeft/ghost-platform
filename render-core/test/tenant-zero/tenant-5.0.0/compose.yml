# The blog Ghost stack, deployed as `blog` under
# /opt/branchleft/blog on an app host.
#
# Rendered by @branchleft/ghost-platform-tenant. Do not hand-edit on the
# host: every line below is a runtime-isolation control, and a stack that
# omits one still starts, still serves, and silently drops the boundary.
#
# `${IMAGE}` is written to /etc/branchleft/<stack>.image.env by
# /usr/local/sbin/branchleft-deploy and is always a digest, never a tag.
# The `${GHOST_*}` references come from /etc/branchleft/<stack>.env, which
# is root-owned 0600 and written by an operator alone.
name: 'blog'
services:
  ghost:
    image: '${IMAGE}'
    restart: 'unless-stopped'
    user: '30001:30001'
    init: true
    read_only: true
    tmpfs:
      - '/tmp:rw,noexec,nosuid,nodev,size=128m'
    cap_drop:
      - 'ALL'
    security_opt:
      - 'no-new-privileges:true'
    pids_limit: 256
    mem_limit: '640m'
    memswap_limit: '640m'
    cpus: '1.0'
    cpu_shares: 512
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    ports:
      - '10.20.1.100:8101:2368'
    environment:
      url: 'https://blog.branchleft.co.uk'
      database__client: 'mysql'
      database__connection__host: '10.20.1.20'
      database__connection__port: 3306
      database__connection__database: 'ghost_blog'
      database__connection__user: 'ghost_blog'
      database__connection__password: '${GHOST_DB_PASSWORD:?set GHOST_DB_PASSWORD in /etc/branchleft/blog.env}'
      database__connection__ssl__rejectUnauthorized: false
      storage__active: 'S3Storage'
      storage__S3Storage__bucket: 'branchleft-media-blog'
      storage__S3Storage__region: 'hel1'
      storage__S3Storage__endpoint: 'https://hel1.your-objectstorage.com'
      storage__S3Storage__forcePathStyle: true
      storage__S3Storage__staticFileURLPrefix: 'content/images'
      storage__S3Storage__cdnUrl: 'https://hel1.your-objectstorage.com/branchleft-media-blog'
      storage__S3Storage__multipartUploadThresholdBytes: 10485760
      storage__S3Storage__multipartChunkSizeBytes: 5242880
      storage__S3Storage__accessKeyId: '${GHOST_S3_ACCESS_KEY_ID:?set GHOST_S3_ACCESS_KEY_ID in /etc/branchleft/blog.env}'
      storage__S3Storage__secretAccessKey: '${GHOST_S3_SECRET_ACCESS_KEY:?set GHOST_S3_SECRET_ACCESS_KEY in /etc/branchleft/blog.env}'
      security__allowWebhookInternalIPs: false
      theme__uploadLimits__compressedBytes: 33554432
      theme__uploadLimits__entryUncompressedBytes: 33554432
      theme__uploadLimits__totalUncompressedBytes: 67108864
      privacy__useUpdateCheck: false
      logging__transports: '["stdout"]'
      mail__transport: 'SMTP'
      mail__options__host: 'mx1.branchleft.co.uk'
      mail__options__port: 587
      mail__options__secure: false
      mail__options__auth__user: 'blog@branchleft.co.uk'
      mail__options__auth__pass: '${GHOST_MAIL_PASSWORD:?set GHOST_MAIL_PASSWORD in /etc/branchleft/blog.env}'
      mail__from: 'branchLeft blog <blog@branchleft.co.uk>'
      bulkEmail__mailgun__baseUrl: 'https://mx1.branchleft.co.uk:8443'
      bulkEmail__mailgun__domain: 'blog.branchleft.co.uk'
      bulkEmail__mailgun__apiKey: '${GHOST_BULK_EMAIL_API_KEY:?set GHOST_BULK_EMAIL_API_KEY in /etc/branchleft/blog.env}'
    volumes:
      - 'ghost-blog-content:/var/lib/ghost/content'
      - 'ghost-blog-adapters:/var/lib/ghost/content/adapters:ro'
    healthcheck:
      test:
        - 'CMD'
        - 'wget'
        - '-q'
        - '-O'
        - '/dev/null'
        - '--header'
        - 'X-Forwarded-Proto: https'
        - 'http://127.0.0.1:2368/'
      interval: '30s'
      timeout: '5s'
      retries: 3
      start_period: '60s'
volumes:
  ghost-blog-content:
    external: true
  ghost-blog-adapters:
    external: true
