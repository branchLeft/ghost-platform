# body-parser reaches the sidecar through express. 2.3.0 carries a high
# finding whose fixed release is 2.4.0, so the override pins the transitive
# copy to the fixed line. pnpm reads overrides here, not from package.json.
overrides:
  body-parser: ^2.4.0

# The estate's own @branchleft packages are exempt from the release-age wait,
# as in every sibling workspace; the Format and lint gate requires this line.
minimumReleaseAgeExclude: ['@branchleft/*']
