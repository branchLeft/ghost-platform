version: 2

updates:
  # Root: lint/format tooling only.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      # Bundle routine minor/patch bumps into one weekly PR instead of
      # opening a separate PR per package. Majors are deliberately left
      # out of the group so each lands as its own PR for individual review.
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'

  # The platform stack. A bump here changes what CI applies to production
  # infrastructure, so majors stay ungrouped.
  - package-ecosystem: 'npm'
    directory: '/infra/platform'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'

  # The published tenant component. Bumps here reach every consumer of
  # @branchleft/ghost-platform-tenant, not just this repo.
  - package-ecosystem: 'npm'
    directory: '/infra/tenant'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'

  # Actions used by workflows in .github/workflows. Every action here is
  # pinned to a full commit SHA, so these bumps are how those pins move.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      # Same rationale as above: group minor/patch action bumps, let
      # majors (which can change action inputs/outputs) come through
      # individually.
      github-actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'
      - 'github-actions'
