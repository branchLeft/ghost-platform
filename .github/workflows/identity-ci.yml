name: Identity CI

# Type-checks and unit-tests the Zitadel configuration service
# (services/identity/). The proof against a real Zitadel and PostgreSQL runs
# on a developer machine through services/identity/local/prove.sh.

on:
  push:
    branches: [main]
    paths:
      - 'services/identity/**'
      - '.github/workflows/identity-ci.yml'
  # A pull request starts this only when its diff touches something the job
  # reads: the service. A push to main starts it on the same paths.
  pull_request:
    branches: [main]
    paths:
      - 'services/identity/**'
      - '.github/workflows/identity-ci.yml'
  # A weekly run of the whole tree is the backstop for a read the path lists
  # above miss.
  schedule:
    - cron: '18 4 * * 1'

# `packages: read` because this service takes a dev dependency on
# `@branchleft/tsconfig`, which is hosted on GitHub Packages and answers 401
# to an anonymous request even for a public package.
permissions:
  contents: read
  packages: read

# One run per pull request: a newer push cancels the superseded run. A push,
# merge_group, schedule or manual run is its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Identity type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/identity

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node
        uses: ./.github/actions/setup-pnpm-node
        with:
          node-version-file: services/identity/.nvmrc
          cache-dependency-path: services/identity/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run coverage
