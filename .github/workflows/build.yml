name: Build image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Build-only. Deliberately does not push anywhere or authenticate to GCP.
#
# Workload Identity Federation does now exist for this repo
# (infra/platform/workloadIdentity.ts), so the old reason given here — "there
# is no WIF set up yet" — is no longer why. The reason now is scope: that
# federation exists to let CI apply the platform Pulumi stack, the deployer
# service account holds no push-relevant grant this job would use, and
# registry push is still its own story. Requesting `id-token: write` here
# would hand a build job the platform deploy identity for no benefit.
#
# This workflow exists to catch a broken Dockerfile / broken image on every
# PR, nothing more.
jobs:
  build:
    name: docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --tag ghost-platform:ci .

      - name: Smoke test (SQLite, boots and serves HTTP 200)
        run: ./scripts/smoke-test.sh ghost-platform:ci

      - name: Storage guard regression test (blocked vs. permitted configs)
        run: ./scripts/test-storage-guard.sh ghost-platform:ci
