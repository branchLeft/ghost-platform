name: Build image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Build-only. Deliberately does not push anywhere or request any credential.
#
# Registry push exists as its own workflow
# (.github/workflows/registry-push.yml) rather than a job here: that
# workflow runs only on push to `main` and requests `packages: write` only
# for its one push job. This workflow runs on every PR, including from
# forks, and stays deliberately credential-free — widening this job to
# request any write permission would hand a build job that runs on
# unreviewed PR code a grant it does not need.
#
# This workflow exists to catch a broken Dockerfile / broken image on every
# PR (and on every push to `main`, redundantly with registry-push.yml's own
# build — see that file's header for why the rebuild there is accepted
# rather than shared), nothing more.
jobs:
  build:
    name: docker build
    runs-on: ubuntu-latest
    # Observed 1.18-1.63min over the last 20 successful runs (p95 1.57min)
    # before the break-glass image test, which adds about a minute locally.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --tag ghost-platform:ci .

      - name: Smoke test (SQLite, boots and serves HTTP 200)
        run: ./scripts/smoke-test.sh ghost-platform:ci

      - name: Storage guard regression test (blocked vs. permitted configs)
        run: ./scripts/test-storage-guard.sh ghost-platform:ci

      - name: Setup Node for the break-glass image test
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: adapters/sso/.nvmrc

      # Real Ghost, real adapter manager, real session middleware: the adapter
      # is proven wired in the built image, not only correct in isolation.
      # Needs no install -- the test uses Node built-ins only.
      - name: Break-glass SSO adapter against the built image
        working-directory: adapters/sso
        run: npm run test:image
        env:
          IMAGE: ghost-platform:ci
