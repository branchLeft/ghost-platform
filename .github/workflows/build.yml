name: Build image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Build-only. Deliberately does not push anywhere or request any credential.
#
# Registry push exists as its own workflow
# (.github/workflows/registry-push.yml) rather than a job here: that
# workflow runs only on push to `main` and requests `packages: write` only
# for its one push job. This workflow runs on every PR, including from
# forks, and stays deliberately credential-free — widening this job to
# request any write permission would hand a build job that runs on
# unreviewed PR code a grant it does not need.
#
# This workflow exists to catch a broken Dockerfile / broken image on every
# PR (and on every push to `main`, redundantly with registry-push.yml's own
# build — see that file's header for why the rebuild there is accepted
# rather than shared), nothing more.

# Read-only, stated rather than inherited: with no `permissions` key a
# same-repo pull request's token gets the repository default, which is write
# to contents, packages and actions, and the image-test steps below run
# PR-authored code. Checkout is the only step that uses the token.
# scripts/test_workflow_permissions.py fails a workflow without this key.
permissions:
  contents: read

# One run per pull request: a newer push cancels the superseded run. A push,
# merge_group, schedule or manual run is its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether an input of the image changed. It runs on every event, so the
  # gate at the end always has a result to read. The image job is skipped only
  # when every changed path is one the image never reads (an allow-list in
  # scripts/ci_skip_decision.py); any other path, an empty diff or a diff that
  # cannot be read runs it. The gate still reports either way.
  changes:
    name: Decide whether the image inputs changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      image: ${{ steps.changes.outputs.image }}
    steps:
      # Full history, so the base commit of the diff below exists on the runner.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The table checks every case the decision must get right. It runs here, on
      # the head, so a change to the decision that breaks a case fails this job.
      - name: Test the decision table
        run: python3 -m unittest discover -s scripts -p 'test_ci_skip_decision.py'

      # The decision is the script's, and it is read from the base commit, so a
      # pull request cannot judge its own change: the copy in its head decides
      # only when the base has none yet. A base or head the runner cannot resolve
      # runs the image. The script exits nonzero on a diff it cannot read, which
      # fails this step and so the gate.
      - name: Decide whether the image inputs changed
        id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          decision=run
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null && git cat-file -e "${HEAD}^{commit}" 2>/dev/null; then
            script="${RUNNER_TEMP}/ci_skip_decision.py"
            if git cat-file -e "${BASE}:scripts/ci_skip_decision.py" 2>/dev/null; then
              git show "${BASE}:scripts/ci_skip_decision.py" > "$script"
            else
              git show "${HEAD}:scripts/ci_skip_decision.py" > "$script"
            fi
            git diff --no-renames --name-status -z "${BASE}...${HEAD}" > "${RUNNER_TEMP}/changes.z"
            decision=$(python3 -I "$script" image < "${RUNNER_TEMP}/changes.z")
          fi
          case "$decision" in
            skip) image=false ;;
            run) image=true ;;
            *) echo "The decision printed: '${decision}'"; exit 1 ;;
          esac
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "The image inputs changed: ${image}"

  image:
    name: Build and test the image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    # Observed 1.18-1.63min over the last 20 successful runs (p95 1.57min)
    # before the break-glass image test, which adds about 31 s. The Ghost zip
    # import probe adds its own boots and a size ladder up to 256 MiB.
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No later step talks to GitHub, so the token is not left in
        # .git/config for the PR-authored steps to read.
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag ghost-platform:ci .

      - name: Smoke test (SQLite, boots and serves HTTP 200)
        run: ./scripts/smoke-test.sh ghost-platform:ci

      - name: Storage guard regression test (blocked vs. permitted configs)
        run: ./scripts/test-storage-guard.sh ghost-platform:ci

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node for the break-glass image test
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: adapters/sso/.nvmrc

      # Real Ghost, real adapter manager, real session middleware: the adapter
      # is proven wired in the built image, not only correct in isolation.
      # Needs no install -- the test uses Node built-ins only.
      - name: Break-glass SSO adapter against the built image
        working-directory: adapters/sso
        run: pnpm run test:image
        env:
          IMAGE: ghost-platform:ci

      # Real Ghost, real adapter manager, real storage adapters (local and,
      # via a local S3-compatible double, S3Storage): the refusal, the typed
      # error and the quarantine write are proven against the built image,
      # not only against a fake base class. Needs no install -- the test
      # uses Node built-ins only.
      - name: Scanning storage decorator against the built image
        working-directory: adapters/scanning-storage
        run: pnpm run test:image
        env:
          IMAGE: ghost-platform:ci

      # Ghost's own zip import of a demo-shaped site, through the scanning
      # decorator over S3 with a tenant prefix and a media address, against the
      # recording S3 double: which references the import rewrites, how it
      # treats staff users and settings, and the zip size at which it refuses.
      # The report is in the job summary. See
      # adapters/scanning-storage/probe/ghost_import_probe.md. Python standard
      # library only.
      - name: Ghost zip import probe against the built image
        run: |
          python3 -m unittest discover -s adapters/scanning-storage/probe -p 'test_*.py'
          python3 adapters/scanning-storage/probe/ghost_import_probe.py --image ghost-platform:ci

      # The upload-then-rewrite path: uploads each demo file through Ghost's admin
      # routes, imports a rewritten export JSON alone, and reads the tenant's data back.
      # Runs after the zip probe, one Docker-heavy probe at a time.
      - name: Upload-then-rewrite probe against the built image
        run: |
          python3 adapters/scanning-storage/probe/ghost_import_probe.py --mode rewrite --image ghost-platform:ci

      # An export is verified by using it: Ghost's own export is taken from a
      # seeded Ghost and re-imported into a fresh one, and named posts, tags,
      # members and settings must be there. The same check against a Ghost
      # that imported nothing must fail. Needs no install -- the test uses
      # Node built-ins only.
      - name: Export re-import against the built image
        working-directory: services/export-bundler
        run: node --test test/image/*.test.mjs
        env:
          IMAGE: ghost-platform:ci

      # Real Ghost sends a reader's magic link to a listener that never
      # greets, a frozen spool as Ghost sees it. The request must fail inside
      # the bound. A second Ghost without the timeouts must still be open at
      # the bound (negative control). Needs no install -- Node built-ins only.
      - name: Ghost send against a frozen mail spool
        run: node --test scripts/mail-spool-proof/ghost-send-timeout.image.test.mjs
        env:
          IMAGE: ghost-platform:ci

      # A demo slot cannot store a Stripe key by any route (Connect token,
      # direct key, content import), and a paired Ghost without the limit is
      # not refused for its reason. The demo's environment is read from
      # render-core's demo golden. Needs no install -- Node built-ins only.
      - name: Stripe connect refusal against the built image
        run: node --test adapters/stripe-connect-limit/test/image/*.test.mjs
        env:
          IMAGE: ghost-platform:ci

      # The social web limit, as the rendered tenant environment carries it,
      # boots in a real Ghost from the built image: admin config reports the
      # limit on and the Network item is absent, and a second Ghost without
      # the limit's line shows the item again. One Ghost at a time. Needs no
      # install -- Node runs the TypeScript directly (22.18 or later).
      - name: Social web limit against the built image
        run: node --test scripts/social-web-limit/social-web-limit.image.test.ts
        env:
          IMAGE: ghost-platform:ci

      # Every bundled theme, activated in a real Ghost from the built image:
      # it lists exactly the manifest's themes, each renders with no outside
      # origin, its stylesheets and scripts answer, and the platform fonts are
      # served from this origin with the pinned bytes. The pins and the
      # origin scan already ran inside the image build (themes/verify.mjs); this
      # is the same result observed at runtime. Needs no install -- Node
      # built-ins only.
      - name: Bundled themes and fonts against the built image
        run: node --test themes/image/themes.image.test.mjs
        env:
          IMAGE: ghost-platform:ci

  # The check the ruleset requires. It always runs, so a change that skips the
  # image job still reports. It fails unless the image job succeeded whenever the
  # decision above found an image input changed.
  build:
    name: docker build
    needs: [changes, image]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require the image job when an image input changed
        env:
          CHANGES: ${{ needs.changes.result }}
          IMAGE_INPUTS: ${{ needs.changes.outputs.image }}
          IMAGE: ${{ needs.image.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES" != "success" ]; then
            echo "The change decision reported: $CHANGES"
            exit 1
          fi
          if [ "$IMAGE_INPUTS" = "false" ]; then
            echo "No image input changed, so the image was not built. This is a pass."
            exit 0
          fi
          if [ "$IMAGE_INPUTS" != "true" ]; then
            echo "The change decision did not report whether the image inputs changed: '$IMAGE_INPUTS'"
            exit 1
          fi
          if [ "$IMAGE" != "success" ]; then
            echo "The image job reported: $IMAGE"
            exit 1
          fi
