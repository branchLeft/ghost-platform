name: Push tenant image

# Builds the tenant Ghost image once and pushes it to GHCR on every merge to
# `main`, tagged with the git SHA and `latest`, so a tenant has a real,
# digest-pinned image to reference wherever it runs.
#
# GHCR (`ghcr.io/branchleft/ghost-tenant`) is the one a Hetzner app host pulls
# from, and is what `provision-tenant.yml` accepts.
#
# Used to also push a second copy to Artifact Registry, for a tenant still
# served from GCP during the migration to Hetzner. The GCP estate was
# destroyed 2026-09-13 (branchLeft/workspace#1000) -- nothing reads that
# registry any more, and its own Workload Identity Federation pool went with
# it, so every run of this workflow since has failed at the auth step, before
# `docker build` or the GHCR push it gated ever run. Removing the dead half
# restores the live one.
#
# Deliberately its own workflow, not a job bolted onto build.yml. build.yml's
# `build` job runs on every PR, including from forks, and stays completely
# credential-free by design (its own header explains why). This job runs
# only on push to `main` and needs `packages: write` to push to GHCR --
# keeping it in a separate workflow means a PR build never sits in the same
# permissions block as that grant.
#
# Rebuilds the image rather than reusing build.yml's artifact. Passing a
# multi-hundred-MB image between workflows costs more in upload/download time
# than a second `docker build` costs in compute, and chaining onto build.yml
# via `workflow_run` would make this push depend on a separate workflow's run
# succeeding through an event that is a well-known source of confusion about
# which commit/ref is actually checked out. A second `docker build` on the
# same commit is the boring, verifiable choice.
#
# Credentials: this run's own `GITHUB_TOKEN`, which expires with the run. No
# stored credential exists for this workflow at all.

on:
  push:
    branches: [main]

permissions:
  contents: read

# Serialise pushes to the one tenant image repository. Two overlapping pushes
# racing `latest` is a confusing-history problem, not a correctness one, but
# there is no reason to allow it. `cancel-in-progress: false`: a cancelled
# push can leave `latest` pointing at whichever tag order the registry
# happened to receive first.
concurrency:
  group: ghost-platform-tenant-image-push
  cancel-in-progress: false

jobs:
  push:
    name: Build and push tenant image
    runs-on: ubuntu-latest
    # Observed 1.43-2.23min over the last 20 successful runs (p95 2.03min).
    timeout-minutes: 15

    # Job-level, not workflow-level: scoped here means it exists only for the
    # one job in the one workflow that ever needs it, on the one trigger
    # (push to `main`) that ever fires it.
    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/branchleft/ghost-tenant
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `GITHUB_TOKEN` with `packages: write`, same as mailgun-shim-image.yml.
      # No stored credential exists for this: the run's own token is the whole
      # of it, and it expires with the run.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build as build.yml's `build` job (plain `docker build`, no
      # buildx action) -- this story changes where the image goes, not how
      # it's built. Two tags in one build so there is exactly one image
      # underneath both: `latest` never points at a different layer set than
      # the SHA tag pushed alongside it.
      - name: Build image
        run: |
          docker build \
            --tag "$IMAGE:$IMAGE_TAG" \
            --tag "$IMAGE:latest" \
            .

      # Same gates build.yml runs on every PR, run again here against the
      # exact image about to be pushed -- so a broken image can fail before
      # `docker push`, not be discovered after `latest` already points at it.
      - name: Smoke test (SQLite, boots and serves HTTP 200)
        run: ./scripts/smoke-test.sh "$IMAGE:$IMAGE_TAG"

      - name: Storage guard regression test (blocked vs. permitted configs)
        run: ./scripts/test-storage-guard.sh "$IMAGE:$IMAGE_TAG"

      # `--all-tags` pushes every locally-tagged reference for this
      # repository (`docker push --help`: "Push all tags of an image to the
      # repository") -- both tags built above, in one push, rather than two
      # separate `docker push` invocations that could observably race.
      - name: Push to GHCR
        run: docker push "$IMAGE" --all-tags

      - name: Write outcome to job summary
        if: always()
        run: |
          {
            echo '## Tenant image push'
            echo
            echo "Commit: \`$IMAGE_TAG\`"
            echo "Image: \`$IMAGE:$IMAGE_TAG\`"
            echo 'Also tagged `latest`.'
            echo
            echo 'Provision a tenant with the GHCR reference, digest-pinned:'
            echo '`docker buildx imagetools inspect '"$IMAGE:$IMAGE_TAG"'`'
          } >> "$GITHUB_STEP_SUMMARY"
