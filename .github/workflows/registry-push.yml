name: Push tenant image

# Builds the tenant Ghost image once and pushes it to GHCR on every merge to
# `main`, tagged with the git SHA and `latest`, so a tenant has a real,
# digest-pinned image to reference wherever it runs.
#
# GHCR (`ghcr.io/branchleft/ghost-tenant`) is the one a Hetzner app host pulls
# from, and is what `provision-tenant.yml` accepts.
#
# Used to also push a second copy to Artifact Registry, for a tenant still
# served from GCP during the migration to Hetzner. The GCP estate was
# destroyed -- nothing reads that
# registry any more, and its own Workload Identity Federation pool went with
# it, so every run of this workflow since has failed at the auth step, before
# `docker build` or the GHCR push it gated ever run. Removing the dead half
# restores the live one.
#
# Deliberately its own workflow, not a job bolted onto build.yml. build.yml's
# `build` job runs on every PR, including from forks, and stays completely
# credential-free by design (its own header explains why). This job runs
# only on push to `main` and needs `packages: write` to push to GHCR --
# keeping it in a separate workflow means a PR build never sits in the same
# permissions block as that grant.
#
# Rebuilds the image rather than reusing build.yml's artifact. Passing a
# multi-hundred-MB image between workflows costs more in upload/download time
# than a second `docker build` costs in compute, and chaining onto build.yml
# via `workflow_run` would make this push depend on a separate workflow's run
# succeeding through an event that is a well-known source of confusion about
# which commit/ref is actually checked out. A second `docker build` on the
# same commit is the boring, verifiable choice.
#
# Credentials: this run's own `GITHUB_TOKEN`, which expires with the run. No
# stored credential exists for this workflow at all.

on:
  push:
    branches: [main]

permissions:
  contents: read

# Serialise pushes to the one tenant image repository. Two overlapping pushes
# racing `latest` is a confusing-history problem, not a correctness one, but
# there is no reason to allow it. `cancel-in-progress: false`: a cancelled
# push can leave `latest` pointing at whichever tag order the registry
# happened to receive first.
concurrency:
  group: ghost-platform-tenant-image-push
  cancel-in-progress: false

jobs:
  push:
    name: Build and push tenant image
    runs-on: ubuntu-latest
    # Observed 1.43-2.23min over the last 20 successful runs (p95 2.03min),
    # plus the mail gate: two Ghost boots beside a spool.
    timeout-minutes: 25

    # Job-level, not workflow-level: scoped here means it exists only for the
    # one job in the one workflow that ever needs it, on the one trigger
    # (push to `main`) that ever fires it. The signing grants are not here:
    # they sit on the `attest` job below, which runs only after the scan.
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.digest.outputs.image }}
      digest: ${{ steps.digest.outputs.digest }}

    env:
      IMAGE: ghcr.io/branchleft/ghost-tenant
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `GITHUB_TOKEN` with `packages: write`, same as mailgun-shim-image.yml.
      # No stored credential exists for this: the run's own token is the whole
      # of it, and it expires with the run.
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build as build.yml's `build` job (plain `docker build`, no
      # buildx action) -- this story changes where the image goes, not how
      # it's built. Two tags in one build so there is exactly one image
      # underneath both: `latest` never points at a different layer set than
      # the SHA tag pushed alongside it.
      - name: Build image
        run: |
          docker build \
            --tag "$IMAGE:$IMAGE_TAG" \
            --tag "$IMAGE:latest" \
            .

      # Same gates build.yml runs on every PR, run again here against the
      # exact image about to be pushed -- so a broken image can fail before
      # `docker push`, not be discovered after `latest` already points at it.
      - name: Smoke test (SQLite, boots and serves HTTP 200)
        run: ./scripts/smoke-test.sh "$IMAGE:$IMAGE_TAG"

      - name: Storage guard regression test (blocked vs. permitted configs)
        run: ./scripts/test-storage-guard.sh "$IMAGE:$IMAGE_TAG"

      # Same Node the mail gate's own CI job runs, not whatever the runner ships.
      - name: Setup Node for the mail gate
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: adapters/sso/.nvmrc

      # Mail gate, on the exact image the push below sends: the candidate must
      # complete a real magic-link send and a newsletter send through the
      # pinned spool (pulled with the login above), or the run stops here and
      # nothing reaches GHCR. No `if:` and no `continue-on-error`, so it cannot
      # be skipped or waved through; workflow-mail-gate.test.js pins both.
      - name: Mail gate (the image sends through its own spool)
        run: node scripts/mail-gate/mail-gate.mjs "$IMAGE:$IMAGE_TAG"

      # `--all-tags` pushes every locally-tagged reference for this
      # repository (`docker push --help`: "Push all tags of an image to the
      # repository") -- both tags built above, in one push, rather than two
      # separate `docker push` invocations that could observably race.
      - name: Push to GHCR
        run: docker push "$IMAGE" --all-tags

      # The digest is read from the image store after the push, never
      # assembled from a tag. Both tags share it, so one attestation covers
      # `latest` and the SHA tag. A missing or malformed digest fails the job.
      - name: Read and verify the pushed digest
        id: digest
        run: |
          reference="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:$IMAGE_TAG" | grep "^$IMAGE@" | head -n 1)"
          digest="${reference#*@}"
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::no well-formed sha256 digest for $IMAGE:$IMAGE_TAG (got: '$reference')"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"

      - name: Write outcome to job summary
        if: always()
        env:
          PINNED_IMAGE: ${{ steps.digest.outputs.image }}
        run: |
          {
            echo '## Tenant image push'
            echo
            echo "Commit: \`$IMAGE_TAG\`"
            echo "Image: \`$IMAGE:$IMAGE_TAG\`"
            echo "Pin this: \`${PINNED_IMAGE:-NO DIGEST: push did not complete}\`"
            echo 'Also tagged `latest`.'
            echo "The scan and attest jobs follow: use this digest only once both are green, and check it with \`scripts/verify-image-attestation.sh\`."
            echo
            echo 'Provision a tenant with the GHCR reference, digest-pinned:'
            echo '`docker buildx imagetools inspect '"$IMAGE:$IMAGE_TAG"'`'
          } >> "$GITHUB_STEP_SUMMARY"

  # The pushed digest, scanned by the shared image-scan workflow before anything
  # signs it. It fails the run on any critical or high finding no exemption
  # covers; the threshold is fixed in that workflow and cannot be lowered here.
  # The shared scan reads this repository's .image-scan-exemptions.json by
  # default. It carries no entry for this image, so nothing here is exempted:
  # a finding with no available fix goes through the exemption route, never a
  # changed threshold.
  scan:
    name: Scan the pushed tenant image
    needs: push
    permissions:
      contents: read
      packages: read
    uses: branchLeft/github-workflows/.github/workflows/image-scan.yml@77506b6d4603ef432bbdec734139fec91e5bea47 # v1.1.0
    with:
      image: ${{ needs.push.outputs.image }}

  # Signs the digest with a keyless GitHub artifact attestation, then verifies
  # it with the identity below and checks that a wrong identity is rejected. It
  # needs the scan, so an image that fails the scan is never signed. The
  # identity is a literal on purpose: read from this run's own
  # `github.workflow_ref` it would agree with itself and prove nothing. The
  # same value, with the source ref `refs/heads/main`, is what a host passes to
  # scripts/verify-image-attestation.sh. `id-token: write` mints the keyless
  # signing certificate and `attestations: write` stores the attestation; the
  # registry login needs `packages: write` for the stored bundle.
  attest:
    name: Attest and verify the scanned tenant image
    needs: [push, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/branchleft/ghost-tenant
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest and verify the pushed image
        uses: branchLeft/github-workflows/.github/actions/attest-and-verify-image@77506b6d4603ef432bbdec734139fec91e5bea47 # v1.1.0
        with:
          image: ${{ env.IMAGE }}
          digest: ${{ needs.push.outputs.digest }}
          signer-workflow: branchLeft/ghost-platform/.github/workflows/registry-push.yml
          repo: branchLeft/ghost-platform
