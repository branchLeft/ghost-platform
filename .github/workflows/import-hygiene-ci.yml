name: Import hygiene CI

# Type-checks, tests and builds the import hygiene package
# (services/import-hygiene/). No image, no deploy: the package is a library and
# a CLI that nothing runs yet.

on:
  push:
    branches: [main]
  # A pull request starts this only when its diff touches something the job
  # reads: the package. Push to main stays unfiltered as the backstop.
  pull_request:
    branches: [main]
    paths:
      - 'services/import-hygiene/**'
      - '.github/workflows/import-hygiene-ci.yml'

permissions:
  contents: read

# One run per pull request: a newer push cancels the superseded run. A push,
# merge_group, schedule or manual run is its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Import hygiene type check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/import-hygiene

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: services/import-hygiene/.nvmrc
          cache: pnpm
          cache-dependency-path: services/import-hygiene/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test:unit

      - name: Build
        run: pnpm run build
