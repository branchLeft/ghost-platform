name: Import hygiene CI

# Type-checks, tests and builds the import hygiene package
# (services/import-hygiene/). No image, no deploy: the package is a library and
# a CLI that nothing runs yet.

on:
  push:
    branches: [main]
    paths:
      - 'services/import-hygiene/**'
      - '.github/workflows/import-hygiene-ci.yml'
  # A pull request or a push to main starts this only when the diff touches
  # something the job reads: the package.
  pull_request:
    branches: [main]
    paths:
      - 'services/import-hygiene/**'
      - '.github/workflows/import-hygiene-ci.yml'

permissions:
  contents: read

# One run per pull request: a newer push cancels the superseded run. A push,
# merge_group, schedule or manual run is its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Import hygiene type check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/import-hygiene

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node
        uses: ./.github/actions/setup-pnpm-node
        with:
          node-version-file: services/import-hygiene/.nvmrc
          cache-dependency-path: services/import-hygiene/pnpm-lock.yaml
          registry-url: ''
          scope: ''

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test:unit

      - name: Build
        run: pnpm run build
