name: SSO adapter CI

# Unit tests and the coverage floor for the break-glass SSO adapter
# (adapters/sso/). The proof against a real Ghost runs in build.yml, next to
# the image it needs.

on:
  push:
    branches: [main]
  # A pull request starts this only when its diff touches something the job
  # reads: the adapter, and the drain sidecar's Dockerfile (a unit test reads
  # it). Push to main stays unfiltered as the backstop.
  pull_request:
    branches: [main]
    paths:
      - 'adapters/sso/**'
      - 'services/drain-sidecar/Dockerfile'
      - '.github/workflows/sso-adapter-ci.yml'

permissions:
  contents: read

jobs:
  test:
    name: sso adapter unit tests
    runs-on: ubuntu-latest
    # Install plus a two-second vitest run; the bound is generous.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: adapters/sso

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # The version Ghost runs the adapter on inside the pinned image.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: adapters/sso/.nvmrc
          cache: pnpm
          cache-dependency-path: adapters/sso/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test with coverage
        run: pnpm run coverage
