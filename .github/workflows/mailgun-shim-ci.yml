name: Mailgun shim CI

# Type-checks and tests the Mailgun-shaped shim (services/mailgun-shim/).
# No deploy job here: this story doesn't deploy anywhere (no Cloud Run
# service, no Pulumi resources) — that's a later story once the shim has a
# store and a delivery host worth pointing at in a real environment.

on:
  push:
    branches: [main]
  # A pull request starts this only when its diff touches something the job
  # reads: the service. Push to main stays unfiltered as the backstop.
  pull_request:
    branches: [main]
    paths:
      - 'services/mailgun-shim/**'
      - '.github/workflows/mailgun-shim-ci.yml'

# `packages: read` because this service takes a dev dependency on
# `@branchleft/tsconfig`, which is hosted on GitHub Packages and answers 401 to
# an anonymous request even for a public package.
permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Shim type check and test
    runs-on: ubuntu-latest
    # Observed 0.3-5.38min over the last 20 successful runs (p95 4.17min).
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/mailgun-shim

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: services/mailgun-shim/.nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'
          cache: pnpm
          cache-dependency-path: services/mailgun-shim/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test:unit
