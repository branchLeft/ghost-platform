name: Sweego webhook receiver CI

# Type-checks and tests the Sweego complaint webhook receiver
# (services/sweego-webhook-receiver/). Test-only: nothing here builds an
# image, publishes a package or touches a host.

on:
  push:
    branches: [main]
    paths:
      - 'services/sweego-webhook-receiver/**'
      - '.github/workflows/sweego-webhook-receiver-ci.yml'
  # A pull request starts this only when its diff touches something the job
  # reads: the service. A push to main starts it on the same paths.
  pull_request:
    branches: [main]
    paths:
      - 'services/sweego-webhook-receiver/**'
      - '.github/workflows/sweego-webhook-receiver-ci.yml'

# `packages: read` because this service takes a dev dependency on
# `@branchleft/tsconfig`, which is hosted on GitHub Packages and answers 401 to
# an anonymous request even for a public package.
permissions:
  contents: read
  packages: read

# One run per pull request: a newer push cancels the superseded run. A push,
# merge_group, schedule or manual run is its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Receiver type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/sweego-webhook-receiver

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node
        uses: ./.github/actions/setup-pnpm-node
        with:
          node-version-file: services/sweego-webhook-receiver/.nvmrc
          cache-dependency-path: services/sweego-webhook-receiver/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test:unit
