name: Standards

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per pull request: a newer push cancels the superseded run. A push,
# merge_group, schedule or manual run is its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  standards:
    uses: branchLeft/standards/.github/workflows/standards.yml@v0.8.6
