name: Mail collector image

# Builds the mail-collector container image on every PR/push touching
# services/mail-collector/ (build-only, no credentials), and on push to `main`
# also pushes it to ghcr.io/branchleft/mail-collector tagged with the git SHA.
# The push job reads the pushed manifest's digest back from the local image
# store and refuses to finish without a well-formed sha256 digest, then
# publishes `ghcr.io/branchleft/mail-collector@sha256:...` as the job's
# `image` output and in its summary. That digest-qualified reference is the
# only thing a deployment may pin: a tag can be re-pointed, a digest cannot.
# There is deliberately no `latest` tag, because a mutable tag is an invitation
# to pin by it.
#
# Mirrors mailgun-shim-image.yml. GHCR authenticates with the workflow's own
# GITHUB_TOKEN, so there is no new secret and no GCP identity involved.
#
# The push job requests `packages: write` only for itself, on the triggers
# that ever run it (push to `main`, manual dispatch): a PR build must never
# sit in the same permissions block as a publish credential. It also waits on
# the test job, so an image is never published from a commit whose type check
# or unit tests fail.

on:
  push:
    branches: [main]
    paths:
      - services/mail-collector/**
      - .github/workflows/mail-collector-image.yml
  pull_request:
    branches: [main]
    paths:
      - services/mail-collector/**
      - .github/workflows/mail-collector-image.yml
  workflow_dispatch:

# `packages: read` because the build installs `@branchleft/tsconfig` from
# GitHub Packages. It is read-only and deliberately separate from the
# `packages: write` the push job grants itself.
permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Collector type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/mail-collector

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: services/mail-collector/.nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'
          cache: npm
          cache-dependency-path: services/mail-collector/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:unit

  build:
    name: docker build (mail-collector)
    runs-on: ubuntu-latest
    needs: test
    # workflow_dispatch has no path filter to gate on; it means "push the
    # current main", so it goes straight to the push job below.
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/mail-collector

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The secret is consumed by a `RUN --mount` in the Dockerfile, so it
      # reaches `npm ci` without entering a layer or the build history.
      - name: Build image
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build \
            --secret id=node_auth_token,env=NODE_AUTH_TOKEN \
            --tag mail-collector:ci \
            .

  push:
    name: Build and push mail-collector image
    runs-on: ubuntu-latest
    needs: test
    # `main` for every trigger: a manual dispatch from another ref must not
    # publish an image.
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.digest.outputs.image }}

    defaults:
      run:
        working-directory: services/mail-collector

    env:
      IMAGE: ghcr.io/branchleft/mail-collector
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build \
            --secret id=node_auth_token,env=NODE_AUTH_TOKEN \
            --tag "$IMAGE:$IMAGE_TAG" \
            .

      - name: Push
        run: docker push "$IMAGE:$IMAGE_TAG"

      # The digest is read from the image store after the push, never
      # assembled from the tag or the commit. A missing or malformed digest
      # fails the job, so no run ends green without a reference to pin.
      - name: Read and verify the pushed digest
        id: digest
        run: |
          reference="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:$IMAGE_TAG" | grep "^$IMAGE@" | head -n 1)"
          digest="${reference#*@}"
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::no well-formed sha256 digest for $IMAGE:$IMAGE_TAG (got: '$reference')"
            exit 1
          fi
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"

      - name: Write outcome to job summary
        if: always()
        env:
          PINNED_IMAGE: ${{ steps.digest.outputs.image }}
        run: |
          {
            echo '## mail-collector image push'
            echo
            echo "Commit: \`$IMAGE_TAG\`"
            echo "Pin this: \`${PINNED_IMAGE:-NO DIGEST: push did not complete}\`"
          } >> "$GITHUB_STEP_SUMMARY"
