name: Admin API CI

# Tests admin-api/, the one home of Ghost Admin API access: the key check, the
# token recipe, the read-only client and its CLI. Loopback fakes only; no
# network, no install, no registry token, no secret.
#
# Deliberately not path-filtered. The broker bundles this package, and a green
# that skipped a pull request because of the files it touched is not a green
# main: the path filter is how a broken control reaches main unseen.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Admin API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin-api

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: admin-api/.nvmrc

      # The suite includes test/sabotage.test.js: it breaks each safety control
      # in a copy of the package and requires the copy's suite to go red, and
      # requires the untouched copy to go green.
      - name: Test
        run: node --test "test/*.test.js"
