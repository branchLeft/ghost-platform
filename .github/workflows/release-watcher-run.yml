name: Release watcher run

# The scheduled poll of Ghost's registry tags. It tracks the major line the
# repo's Dockerfile pins and keeps one PR per major line at the newest stable
# digest. A newer major is noticed on every run and never followed. Fixed
# code only: nothing here runs a model. services/release-watcher/README.md
# has the decision rules and the App this job needs.
#
# Identity: the PRs are opened by a GitHub App. Its installation token is
# minted here at run time (it lives an hour at most) from the repository
# variable DIGEST_APP_ID and the repository secret DIGEST_APP_PRIVATE_KEY,
# scoped to this repository with contents and pull-requests write only. No
# long-lived token is stored. Until the variable is set the mint step is
# skipped and the run opens no PR, as before.
#
# The poll-age gauge lives on the state branch, `state/release-watcher`,
# never on `main`. That branch carries no ruleset, so the gauge commit needs
# no PR and no signature.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ghost-platform-release-watcher-run
  cancel-in-progress: false

jobs:
  watch:
    name: Poll the Ghost registry and reconcile the digest PR
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      # A manual run from a feature branch would build its PR from that
      # branch's Dockerfile, so only main may run this job.
      - name: Refuse any ref other than main
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::the release watcher runs from main only (ref was $GITHUB_REF)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Configure git identity for the state branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch the state branch, or create it as an orphan
        id: state
        env:
          STATE_WORKTREE: ${{ runner.temp }}/release-watcher-state
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin state/release-watcher > /dev/null; then
            git fetch origin state/release-watcher
            git worktree add "$STATE_WORKTREE" origin/state/release-watcher --detach
          else
            # An orphan branch: the state branch must not carry the repo's tree.
            git worktree add --detach "$STATE_WORKTREE"
            (
              cd "$STATE_WORKTREE"
              git checkout --orphan state/release-watcher
              git rm -r -f --quiet --ignore-unmatch .
            )
          fi
          echo "metrics=$STATE_WORKTREE/release-watcher.prom" >> "$GITHUB_OUTPUT"

      - name: Mint the App installation token
        id: app-token
        if: ${{ vars.DIGEST_APP_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DIGEST_APP_ID }}
          private-key: ${{ secrets.DIGEST_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Run the watcher
        env:
          PYTHONPATH: services/release-watcher
          RELEASE_WATCHER_TOKEN: ${{ steps.app-token.outputs.token }}
          METRICS_PATH: ${{ steps.state.outputs.metrics }}
        run: python3 -m release_watcher.cli --dockerfile Dockerfile --metrics "$METRICS_PATH"

      # Merges the digest PR the watcher keeps open, and only that one: it
      # must be authored by the App (DIGEST_MACHINE_SLUG + [bot]), change one
      # modified Dockerfile by one FROM line on the pinned major, and have every
      # check the rulesets require passing, Digest-only line scope included.
      # One squash merge call pinned to the checked head sha, after polling the
      # checks for at most 30 minutes: no admin or bypass flag, and the repo's
      # auto-merge setting is neither read nor changed. Any failure leaves the
      # PR open and fails the job, so the gauge below is not written.
      - name: Merge the digest PR when it is the App's and only the FROM line
        if: ${{ steps.app-token.outputs.token != '' }}
        env:
          PYTHONPATH: services/release-watcher
          RELEASE_WATCHER_TOKEN: ${{ steps.app-token.outputs.token }}
          DIGEST_MACHINE_SLUG: ${{ vars.DIGEST_MACHINE_SLUG }}
          DIGEST_MACHINE_LOGIN: ${{ vars.DIGEST_MACHINE_LOGIN }}
          MINTED_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: python3 -m release_watcher.merge --dockerfile Dockerfile

      # The gauge is written only when the run above succeeds: a failed poll
      # or a failed PR step leaves the old timestamp in place, so its age grows.
      - name: Commit the poll-age gauge
        working-directory: ${{ runner.temp }}/release-watcher-state
        run: |
          set -euo pipefail
          git add release-watcher.prom
          if [ "$(git ls-files)" != "release-watcher.prom" ]; then
            echo "::error::the state branch must track only release-watcher.prom"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "no change to the gauge"
            exit 0
          fi
          git commit -m "release-watcher: record poll"
          git push origin HEAD:refs/heads/state/release-watcher
