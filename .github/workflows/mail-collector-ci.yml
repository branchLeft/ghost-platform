name: Mail collector CI

# Type-checks and tests the drain worker (services/mail-collector/). No
# image or deploy job here: the ops1 deployment is a later, hand-delivered
# step (blocked on the ops1 monitoring and network prerequisites) -- this workflow
# proves the code, not the rollout.

on:
  push:
    branches: [main]
  # A pull request starts this only when its diff touches something the job
  # reads: the service. Push to main stays unfiltered as the backstop.
  pull_request:
    branches: [main]
    paths:
      - 'services/mail-collector/**'
      - 'deadmans-switch/**'
      - '.github/workflows/mail-collector-ci.yml'

# `packages: read` because this service takes a dev dependency on
# `@branchleft/tsconfig`, which is hosted on GitHub Packages and answers 401 to
# an anonymous request even for a public package.
permissions:
  contents: read
  packages: read

# One run per pull request: a newer push cancels the superseded run. A push,
# merge_group, schedule or manual run is its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Collector type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/mail-collector

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: services/mail-collector/.nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'
          cache: pnpm
          cache-dependency-path: |
            services/mail-collector/pnpm-lock.yaml
            deadmans-switch/pnpm-lock.yaml

      # The collector links the shared dead-man's switch package, which
      # installs its own dependencies: pnpm does not install a link target's.
      - name: Install the shared dead-man's switch package
        run: pnpm --dir ../../deadmans-switch install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test:unit
