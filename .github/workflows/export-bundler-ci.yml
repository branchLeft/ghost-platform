name: Export bundler CI

# Type-checks and unit-tests the export bundler (services/export-bundler/).
# The real-Ghost proof of its lifecycle is scripts/test-export-bundler.sh,
# run locally (it needs a Docker daemon and the platform image, neither of
# which this job builds) -- its record lives in the story's PR body.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# `packages: read` because this service takes a dev dependency on
# `@branchleft/tsconfig`, which is hosted on GitHub Packages and answers 401
# to an anonymous request even for a public package.
permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Export bundler type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/export-bundler

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: services/export-bundler/.nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'
          cache: npm
          cache-dependency-path: services/export-bundler/package-lock.json

      # The archive tests encrypt and decrypt with the real age. Pinned by
      # version and checksum, the same release infra-provisioning-scripts-ci.yml
      # installs, rather than whatever apt ships that week.
      - name: Install age (pinned)
        working-directory: /tmp
        run: |
          set -e
          AGE_VERSION=v1.3.1
          AGE_TARBALL=age-${AGE_VERSION}-linux-amd64.tar.gz
          AGE_SHA256=bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377
          curl -sL -o "$AGE_TARBALL" \
            "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/${AGE_TARBALL}"
          echo "${AGE_SHA256}  ${AGE_TARBALL}" | sha256sum -c -
          tar -xzf "$AGE_TARBALL"
          sudo install -m 0755 age/age age/age-keygen /usr/local/bin/
          age --version

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run coverage
