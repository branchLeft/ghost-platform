name: Hetzner host check CI

# Type-checks and tests infra/hetzner-host-check/, which proves
# @branchleft/hetzner-host (published from shared-infra) installs and
# resolves here. Not a Pulumi program: no `pulumi up`, no `pulumi preview`,
# no cloud credentials of any kind, no `id-token: write`.
#
# This is also the observation the install proof depends on: the
# `GITHUB_TOKEN` below is minted for this repo and this run only, with no
# grant on shared-infra, the repo that actually published the package.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# `packages: read` because @branchleft/hetzner-host and
# @branchleft/tsconfig are both hosted on GitHub Packages, which answers 401
# to an anonymous request even for a public package.
permissions:
  contents: read
  packages: read

jobs:
  typecheck:
    name: Hetzner host check
    runs-on: ubuntu-latest
    # Observed 0.27-4.88min over the last 20 successful runs (p95 2.9min) --
    # wider spread than most typecheck jobs, headroom set above the max.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/hetzner-host-check

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: infra/hetzner-host-check/.nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'
          cache: npm
          cache-dependency-path: infra/hetzner-host-check/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:unit
