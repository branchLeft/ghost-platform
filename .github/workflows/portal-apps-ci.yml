name: Portal applications CI

# Type-checks and tests the tenant portal and the owner console
# (portal/apps/). Each application's sign-in is driven end to end against a
# stand-in token endpoint with real signed tokens, and its storage is a real
# PostgreSQL, because the tenant boundary is the database's row-level policies
# together with the scope bound at sign-in. The data layer's provisioning
# command builds that database and checks pg_hba too, so the server runs with
# the data layer's test pg_hba.conf mounted. The two packages it consumes, the
# data layer and the identity verifier, are built first, as the applications
# import their built output. A missing PORTAL_TEST_DATABASE_URL fails the
# suite rather than skipping it.

on:
  push:
    branches: [main]
    paths:
      - 'portal/**'
      - 'services/identity/**'
      - '.github/workflows/portal-apps-ci.yml'
  pull_request:
    branches: [main]

# `packages: read` because these packages take a dev dependency on
# `@branchleft/tsconfig`, which is hosted on GitHub Packages and answers 401
# to an anonymous request even for a public package.
permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Portal applications type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PORTAL_TEST_DATABASE_URL: postgres://postgres:ci-only-throwaway@127.0.0.1:5432/postgres
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Started here rather than as a service container, which cannot mount a
      # file from the checkout.
      - name: Start PostgreSQL with the data layer's test pg_hba.conf
        env:
          IMAGE: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        run: |
          install -m 0666 portal/data/test/pg_hba.ci.conf "$RUNNER_TEMP/pg_hba.conf"
          sleep 1
          docker run -d --rm --name portal-apps-pg -p 5432:5432 \
            -e POSTGRES_PASSWORD=ci-only-throwaway \
            -v "$RUNNER_TEMP/pg_hba.conf:/etc/postgresql/pg_hba.conf" \
            "$IMAGE" -c hba_file=/etc/postgresql/pg_hba.conf
          for attempt in $(seq 1 60); do
            if docker exec portal-apps-pg pg_isready -U postgres -h 127.0.0.1 >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs portal-apps-pg
          exit 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: portal/apps/.nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'
          cache: npm
          cache-dependency-path: |
            portal/apps/package-lock.json
            portal/data/package-lock.json
            services/identity/package-lock.json

      - name: Build the data layer
        working-directory: portal/data
        run: npm ci && npm run build

      - name: Build the identity verifier
        working-directory: services/identity
        run: npm ci && npm run build

      - name: Install dependencies
        working-directory: portal/apps
        run: npm ci

      - name: Type check
        working-directory: portal/apps
        run: npm run typecheck

      - name: Build
        working-directory: portal/apps
        run: npm run build

      - name: Test
        working-directory: portal/apps
        run: npm run coverage
