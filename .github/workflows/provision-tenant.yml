name: Provision tenant

# Onboards one tenant as far as an unattended run correctly can: its repository,
# its stack passphrase (minted and escrowed), its stack, its non-secret config,
# and the pull request that hands it over.
#
# WHAT THIS FLOW DELIBERATELY DOES NOT DO, AND WHY EACH IS NOT AN OMISSION.
#
#   1. It does not create the tenant's database, its volumes, its UID claim or
#      its deploy slot. All four are root-run scripts on `db1` and the app host,
#      which are on a private network a GitHub-hosted runner cannot reach. A
#      credential that could reach them would be a credential that installs
#      credentials on every app host, which is the thing the deploy design
#      exists not to have.
#   2. It does not mint the tenant's deploy keypair or write it to the generated
#      repository. Same reason, stated as a prohibition in the migration
#      programme's deploy-credential section: minting a host credential and
#      writing it to a repository in one unattended run is a
#      credential-creating credential.
#   3. It does not set the tenant's secret stack config -- the database password
#      and the Object Storage key pair. A `workflow_dispatch` input is plaintext
#      in the run's API response and in its form, so there is no route by which
#      this could carry one without publishing it. The operator sets them in the
#      handover pull request, which also means the escrowed passphrase is used
#      on day one rather than first tried during an incident.
#   4. It therefore does not run a tenant first apply. There is nothing to apply
#      until (3) is done, and a stack applied against half its config would
#      render a secrets file missing lines.
#
# THE GATE. This workflow is `workflow_dispatch` only -- no push, no schedule,
# no merge starts it -- and the job declares `environment: tenant-provisioning`,
# which carries a required reviewer. **That is now the whole gate.** The GCP
# half, a Workload Identity provider condition pinning `job_workflow_ref` to
# this file, is gone with WIF, and nothing replaces it like for like: it was
# enforced by Google regardless of any GitHub setting, and the environment rule
# is enforced by GitHub. So the first steps below verify the rule is actually
# present and that every provisioning-capable credential is scoped to that
# environment rather than to the repository -- because an environment carrying
# no protection rule does not pause a run and does not say so, and a
# repository-level secret is readable by any workflow run, including one added
# on a branch.
#
# `GH_PAT_TENANT_PROVISIONING` is the credential this workflow writes to
# generated repositories with. The default GITHUB_TOKEN is scoped to this
# repository and can neither create a repo in the org nor set another repo's
# variables, secrets or environments. What this PAT writes to the generated repo
# is that repo's own Pulumi secrets passphrase and the encryption salt that
# verifies it -- the two writes that hand the new repo something it needs to keep
# secret from this repo, going forward.

on:
  workflow_dispatch:
    inputs:
      # Deliberately the first field on the form, and deliberately not
      # answerable by leaving the form alone. Whether a tenant's infrastructure
      # repository is public is a disclosure about that tenant -- the
      # repository, and its name, say that they are a customer -- so the answer
      # is theirs to give and it has to be given before anything is created. A
      # `choice` input always preselects its first option, so the first option
      # here is a refusal rather than a value.
      tenant_visibility:
        description: 'Repository visibility. Public is the default for a new tenant; private only where the tenant asked for it.'
        required: true
        type: choice
        options:
          - 'ask the tenant -- this is not an answer'
          - public
          - private
      tenant_name:
        description: 'Tenant slug: Pulumi stack, Compose project, systemd instance, MySQL database and user. Lowercase, hyphenated, at most 26 characters.'
        required: true
      tenant_repo:
        description: 'Repository to generate, without the org prefix. Must be ghost-tenant-<name>.'
        required: true
      site_url:
        description: 'https://<hostname> this tenant serves'
        required: true
      # Allocated against the host, never chosen from a spreadsheet: run
      # `provision_tenant_volume.py --list-claims` on that app host first. The
      # script refuses a UID another tenant holds, but only once the operator is
      # already on the host -- by which point this repository exists.
      tenant_uid:
        description: 'This tenant reserved UID on its app host, from provision_tenant_volume.py --list-claims (30000-30999)'
        required: true
      host_port:
        description: 'Host-side port for this tenant Ghost, distinct per tenant on that app host'
        required: true
      app_host_private_ip:
        description: 'App host PRIVATE address, e.g. 10.20.1.100. Every published port binds this.'
        required: true
      app_host_ssh_address:
        description: 'App host PUBLIC address. CI deploys over this; runners cannot reach the private one.'
        required: true
      image_ref:
        description: 'Tenant image, digest-pinned: ghcr.io/...@sha256:<64 hex>'
        required: true

permissions:
  contents: read

jobs:
  provision:
    name: Provision
    runs-on: ubuntu-latest

    # The reviewer gate, and now the only one. Do not remove without reading the
    # header: the run does not pause if the environment carries no protection
    # rule, which is why the second step below asserts that it does.
    environment: tenant-provisioning

    permissions:
      contents: read

    # Two runs at once would race on the same tenant bucket and the same
    # repository name. Never cancel one in flight -- a half-provisioned tenant
    # is worse than a queued run, and there is no automatic rollback.
    concurrency:
      group: provision-tenant
      cancel-in-progress: false

    # Every input and variable a `run` block needs is bound here rather than
    # interpolated into the script. A `${{ }}` inside `run` is expanded before
    # the shell sees it, so a value containing shell syntax becomes shell source
    # -- in a job holding a token that can create repositories in this org.
    env:
      TENANT: ${{ inputs.tenant_name }}
      TENANT_REPO: branchLeft/${{ inputs.tenant_repo }}
      # The bare name as typed, so validation reports on the field the operator
      # filled in rather than on the org-qualified value built here.
      TENANT_REPO_NAME: ${{ inputs.tenant_repo }}
      TENANT_VISIBILITY: ${{ inputs.tenant_visibility }}
      SITE_URL: ${{ inputs.site_url }}
      TENANT_UID: ${{ inputs.tenant_uid }}
      HOST_PORT: ${{ inputs.host_port }}
      APP_HOST_PRIVATE_IP: ${{ inputs.app_host_private_ip }}
      APP_HOST_SSH_ADDRESS: ${{ inputs.app_host_ssh_address }}
      IMAGE_REF: ${{ inputs.image_ref }}
      # The tenant's Pulumi state backend: one Hetzner Object Storage bucket
      # holding every tenant stack, addressed by project name, so onboarding
      # creates no storage resource at all.
      #
      # **A tenant bucket, never the estate's own.** `branchleft-pulumi-state`
      # holds `branchleft-hetzner-estate/production`, whose checkpoint carries
      # the production hcloud API token, alongside the network and mail stacks.
      # The S3 credential a tenant repo's CI must hold to reach its own state is
      # not scoped to a stack, so pointing tenants at that bucket would give
      # every tenant deployer write access to the estate's control plane -- and
      # destroying a checkpoint needs no ability to decrypt it. Object Storage is
      # priced per account regardless of bucket count, so the separation is free.
      # The validation step refuses that bucket by name.
      #
      # Both the endpoint host and `region` in this URL must name the bucket's
      # own location; a mismatch is an opaque 403 that reads as a credential
      # problem.
      TENANT_BACKEND_URL: ${{ vars.HETZNER_PULUMI_BACKEND_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_ACCESS_KEY }}
      AWS_REGION: hel1
      # Platform-wide facts rather than per-tenant answers, so they are
      # repository variables and not ten more fields on a form nobody can fill
      # in correctly from memory. `workflow_dispatch` also caps inputs at ten.
      PLATFORM_DB_PRIVATE_IP: ${{ vars.PLATFORM_DB_PRIVATE_IP }}
      PLATFORM_MEDIA_ENDPOINT: ${{ vars.PLATFORM_MEDIA_ENDPOINT }}
      PLATFORM_MEDIA_REGION: ${{ vars.PLATFORM_MEDIA_REGION }}
      PLATFORM_MEDIA_BUCKET: ${{ vars.PLATFORM_MEDIA_BUCKET }}
      PLATFORM_MEDIA_PUBLIC_BASE_URL: ${{ vars.PLATFORM_MEDIA_PUBLIC_BASE_URL }}
      ESCROW_PUBLIC_KEY: infra/provisioning/escrow/tenant-passphrase-escrow.pub.pem

    steps:
      # Fail closed, before anything is created. Half a migrated flow does not
      # produce half a tenant: it produces a created repository and a stack that
      # cannot deploy, with no automatic rollback. The variable that lifts this
      # is set deliberately by an owner once the flow, the template and the
      # host-side runbook are all proven together.
      - name: Refuse to provision through a half-migrated flow
        env:
          FLOW_READY: ${{ vars.TENANT_PROVISIONING_FLOW_HETZNERISED }}
        run: |
          if [ "$FLOW_READY" != "true" ]; then
            echo "::error::Tenant provisioning is closed. Set the TENANT_PROVISIONING_FLOW_HETZNERISED repository variable on branchLeft/ghost-platform to 'true' once the rewritten flow, the Hetzner-ised template and RUNBOOK-tenant-onboarding.md have been proven end to end on a real host."
            exit 1
          fi

      # The replacement for the Workload Identity provider condition this
      # rewrite deletes, and it is checked rather than assumed for the same
      # reason that one was worth having: it is the only thing standing between
      # this workflow's credentials and any run of it.
      #
      # Two properties, both fail-closed:
      #
      #   - the `tenant-provisioning` environment carries at least one
      #     protection rule. An environment with none runs straight through
      #     without pausing and reports nothing;
      #   - every provisioning-capable secret is an ENVIRONMENT secret on it.
      #     `secrets.X` silently falls back to a repository secret of the same
      #     name, so a secret moved to the repository level would keep this
      #     workflow working while making it readable by every other run in this
      #     repo, including one from a branch. Nothing else would report that.
      #
      # A failure to read either is also a refusal. This is a rare, reviewed,
      # owner-run action; "the check could not run" is not a reason to proceed
      # past the control it replaces.
      - name: Verify the provisioning gate and its credential scoping
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TENANT_PROVISIONING }}
          ENVIRONMENT: tenant-provisioning
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_PAT_TENANT_PROVISIONING is empty or unset. It must be an environment secret on the $ENVIRONMENT environment."
            exit 1
          fi

          rules=$(gh api "repos/${GITHUB_REPOSITORY}/environments/${ENVIRONMENT}" \
            --jq '[.protection_rules[].type] | join(",")') || {
              echo "::error::could not read the $ENVIRONMENT environment on ${GITHUB_REPOSITORY}. Refusing: this environment's required-reviewer rule is the only gate in front of this workflow's credentials, and an unreadable gate is not a passed one. The token needs administration:read on this repository."
              exit 1
            }
          if [ -z "$rules" ]; then
            echo "::error::the $ENVIRONMENT environment carries no protection rules, so this run was never paused for review. Add a required reviewer before provisioning anything."
            exit 1
          fi
          case ",$rules," in
            *,required_reviewers,*) ;;
            *)
              echo "::error::the $ENVIRONMENT environment has protection rules ($rules) but no required reviewer. A wait timer is not a review."
              exit 1
              ;;
          esac
          echo "$ENVIRONMENT protection rules: $rules"

          names=$(gh api "repos/${GITHUB_REPOSITORY}/environments/${ENVIRONMENT}/secrets" \
            --paginate --jq '.secrets[].name') || {
              echo "::error::could not list the $ENVIRONMENT environment's secrets on ${GITHUB_REPOSITORY}. Refusing rather than assuming they are correctly scoped."
              exit 1
            }
          missing=
          for required in GH_PAT_TENANT_PROVISIONING HETZNER_S3_ACCESS_KEY_ID HETZNER_S3_SECRET_ACCESS_KEY; do
            printf '%s\n' "$names" | grep -qx "$required" || missing="$missing $required"
          done
          if [ -n "$missing" ]; then
            echo "::error::these secrets are not scoped to the $ENVIRONMENT environment:$missing. They are provisioning-capable credentials and must sit behind the required-reviewer gate. Move each one with: gh secret set <NAME> --repo ${GITHUB_REPOSITORY} --env $ENVIRONMENT, then delete the repository-level copy."
            exit 1
          fi
          echo "environment-scoped: $(printf '%s' "$names" | tr '\n' ' ')"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cheap, credential-free, and ahead of everything that mutates. It is also
      # the last point at which nothing exists yet -- no repository, no stack --
      # which is why the visibility answer is checked here and not at the step
      # that acts on it.
      - name: Validate inputs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TENANT_PROVISIONING }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          # An allow-list, not a rejection of the placeholder option: an empty
          # value, the preselected placeholder, and anything a later edit adds
          # to the options list all refuse here. This cannot be satisfied by
          # leaving the dispatch form untouched.
          case "$TENANT_VISIBILITY" in
            public | private) ;;
            *)
              fail "tenant_visibility was not answered. Public is the default for a new tenant repository; private only where the tenant has asked for it. A public repository, and its name, disclose that this tenant is a customer, so this is the tenant's answer to give and not one to pick on their behalf. Ask, then dispatch again choosing public or private."
              ;;
          esac

          # A fixed prefix is what lets one organisation-level ruleset cover
          # every tenant repository, including ones that do not exist yet.
          [[ "$TENANT_REPO_NAME" =~ ^ghost-tenant-[a-z0-9]+(-[a-z0-9]+)*$ ]] \
            || fail "tenant_repo must be ghost-tenant-<name>: lowercase alphanumerics and single hyphens, no leading or trailing hyphen"
          [[ "${#TENANT_REPO_NAME}" -le 64 ]] \
            || fail "tenant_repo must be 64 characters or fewer"

          # 26 rather than 30: MySQL caps an account name at 32 and a tenant's
          # database and dedicated user share one name of `ghost_<slug>`. The
          # component refuses a longer slug at preview, and the template's
          # generation script refuses it here -- this is the earliest of the
          # three, before a repository exists to clean up.
          [[ "$TENANT" =~ ^[a-z][a-z0-9-]{1,24}[a-z0-9]$ ]] \
            || fail "tenant_name must be lowercase alphanumeric-hyphen, 3-26 characters"

          [[ "$SITE_URL" =~ ^https:// ]] || fail "site_url must be https"

          # The component validates this range too, but only once a stack exists
          # to preview. The UID is host state: it must already have been
          # allocated against the app host with provision_tenant_volume.py
          # --list-claims, which is the only thing that knows what is taken.
          [[ "$TENANT_UID" =~ ^[0-9]+$ ]] && [ "$TENANT_UID" -ge 30000 ] && [ "$TENANT_UID" -le 30999 ] \
            || fail "tenant_uid must be an integer in the reserved range 30000-30999"
          [[ "$HOST_PORT" =~ ^[0-9]+$ ]] && [ "$HOST_PORT" -ge 1024 ] && [ "$HOST_PORT" -le 65535 ] \
            || fail "host_port must be an integer between 1024 and 65535"

          # Private on the inside, public on the outside, and conflating the two
          # is the mistake this pair invites: the stack binds its published port
          # to the private address, and CI deploys to the public one.
          [[ "$APP_HOST_PRIVATE_IP" =~ ^10\.[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || fail "app_host_private_ip must be a 10.x.x.x address -- it is what the tenant's published port binds, not the address CI connects to"
          [[ -n "$APP_HOST_SSH_ADDRESS" ]] || fail "app_host_ssh_address is empty"
          # Spelled as an `if` rather than `[[ ... ]] && fail`: the negative form
          # of that idiom leaves the whole list exiting non-zero on the ordinary
          # path, and whether errexit acts on that is exactly the kind of thing
          # nobody wants to be sure about inside a validation step.
          if [[ "$APP_HOST_SSH_ADDRESS" =~ ^10\. ]]; then
            fail "app_host_ssh_address is a private address. CI runs on GitHub-hosted runners and cannot reach the private network; this must be the app host's public address."
          fi

          # Digest-pinned, checked here as well as in the tenant program and on
          # the host. A tag is a mutable pointer, so a stack deployed by tag has
          # no answer to "what is running".
          [[ "$IMAGE_REF" =~ @sha256:[0-9a-f]{64}$ ]] \
            || fail "image_ref must be digest-pinned and end in @sha256:<64 lowercase hex>"

          # Repository configuration rather than an operator's input, so checked
          # for presence and shape. An unset variable expands to '' and would
          # send the tenant's first checkpoint to whatever backend the runner
          # last logged into.
          [[ -n "$TENANT_BACKEND_URL" ]] \
            || fail "the HETZNER_PULUMI_BACKEND_URL repository variable is empty or unset"
          [[ "$TENANT_BACKEND_URL" == s3://* ]] \
            || fail "HETZNER_PULUMI_BACKEND_URL must be an s3:// backend; a gs:// backend would give this tenant a GCP dependency"
          # Named, not pattern-matched: this is the estate's own control-plane
          # bucket, and a tenant deployer that can write to it can destroy the
          # checkpoint the production hcloud token lives in.
          [[ "$TENANT_BACKEND_URL" != *"s3://branchleft-pulumi-state?"* ]] \
            || fail "HETZNER_PULUMI_BACKEND_URL points at branchleft-pulumi-state, the estate's own state bucket. Tenant state goes in a separate bucket -- the S3 credential is not scoped per stack, so this would hand every tenant deployer write access to the estate, network and mail checkpoints."
          [[ -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" ]] \
            || fail "HETZNER_S3_ACCESS_KEY_ID / HETZNER_S3_SECRET_ACCESS_KEY are empty or unset; the tenant's state backend is unreachable without them"

          for pair in \
            "PLATFORM_DB_PRIVATE_IP=$PLATFORM_DB_PRIVATE_IP" \
            "PLATFORM_MEDIA_ENDPOINT=$PLATFORM_MEDIA_ENDPOINT" \
            "PLATFORM_MEDIA_REGION=$PLATFORM_MEDIA_REGION" \
            "PLATFORM_MEDIA_BUCKET=$PLATFORM_MEDIA_BUCKET" \
            "PLATFORM_MEDIA_PUBLIC_BASE_URL=$PLATFORM_MEDIA_PUBLIC_BASE_URL"; do
            [ -n "${pair#*=}" ] || fail "the ${pair%%=*} repository variable is empty or unset"
          done

          if gh repo view "$TENANT_REPO" >/dev/null 2>&1; then
            fail "$TENANT_REPO already exists -- onboarding is create-only. This is also what stops an existing tenant's hand-set passphrase being minted over, which would rotate a live stack's wrapping key without re-wrapping its checkpoint."
          fi

      # Before the repository exists, and before anything is minted. A missing
      # or unusable escrow key must stop the run while there is still nothing to
      # recover: a passphrase whose only copy is a GitHub Actions secret cannot
      # be read back, and a stack whose passphrase is lost cannot be destroyed
      # either, because destroy reads a checkpoint it can no longer decrypt.
      #
      # The self-test generates an ephemeral keypair and round-trips through the
      # exact openssl options used below and in the recovery runbook. `rsa_oaep_md`
      # and `rsa_mgf1_md` default differently across OpenSSL versions, so an
      # encrypt that works and a decrypt written from memory can disagree -- at
      # the one moment the value is needed.
      - name: Prove the passphrase escrow works on this runner
        run: |
          set -euo pipefail
          python3 infra/provisioning/scripts/escrow-tenant-passphrase.py --self-test
          if [ ! -f "$ESCROW_PUBLIC_KEY" ]; then
            echo "::error::$ESCROW_PUBLIC_KEY is missing. Provisioning refuses to mint a passphrase it cannot escrow. Generate the keypair per infra/provisioning/escrow/README.md, commit the public half, and put the private half in the password manager and the off-site archive before provisioning any tenant."
            exit 1
          fi

      # ---- the tenant repo ------------------------------------------------

      # Everything from here leaves artefacts a failure does not clean up. There
      # is no automatic rollback -- RUNBOOK-tenant-onboarding.md has the order to
      # undo in, and why deleting the repository is the step that revokes the
      # PAT's reach into it.
      - name: Generate the tenant repo from the template
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TENANT_PROVISIONING }}
        run: |
          set -euo pipefail
          # Re-derived here rather than carried from validation. This is the step
          # that makes the disclosure, and `gh repo create` with no visibility
          # flag falls back to gh's own default instead of failing, so the flag
          # is chosen from an exhaustive case with no silent branch.
          case "$TENANT_VISIBILITY" in
            public) visibility_flag=--public ;;
            private) visibility_flag=--private ;;
            *)
              echo "::error::tenant_visibility is not public or private at the point of creating the repository; refusing"
              exit 1
              ;;
          esac
          gh repo create "$TENANT_REPO" "$visibility_flag" \
            --template branchLeft/ghost-platform-tenant-template \
            --description "Tenant infrastructure stack"

          # GitHub copies template content asynchronously and `gh repo create`
          # returns before it lands. Cloning inside that window succeeds against
          # an empty repository -- git calls it a warning, not an error -- so the
          # first thing to fail would be the generation step, naming a missing
          # Pulumi.yaml rather than the race that caused it.
          for _ in $(seq 1 30); do
            if gh api "repos/${TENANT_REPO}/contents/Pulumi.yaml" --silent 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::${TENANT_REPO} was created but the template content did not appear within 60s. Nothing further has run; recover per the runbook, starting with deleting the repo."
          exit 1

      # The substitution list lives in the template, not here. Which files carry
      # a placeholder is a property of that repository, and a copy of the list in
      # this workflow would go stale the first time a placeholder was added to a
      # new file -- silently, producing generated repos that ship the literal
      # token. The script refuses if any placeholder survives anywhere in the
      # tree, and the template's own tests run the whole generation against its
      # tracked files on every push.
      - name: Clone and generate
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TENANT_PROVISIONING }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TENANT_REPO}.git" tenant
          cd tenant
          python3 scripts/generate-tenant-repo.py --slug "$TENANT"

      # Minted, escrowed and only then written. The order is the whole control:
      # if the escrow fails, no secret has been set and no stack exists, so
      # nothing has been created that needs a passphrase nobody holds.
      #
      # The value is never printed. This repository is PUBLIC, so anything a run
      # writes to its logs or its job summary is visible to anyone on the
      # internet. What is published is the ciphertext.
      - name: Mint, escrow and publish this tenant's secrets passphrase
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TENANT_PROVISIONING }}
        run: |
          set -euo pipefail
          PASSPHRASE=$(python3 infra/provisioning/scripts/mint-tenant-passphrase.py)
          echo "::add-mask::$PASSPHRASE"
          if [ -z "$PASSPHRASE" ]; then
            echo "::error::minted passphrase is empty; refusing to continue"
            exit 1
          fi

          ESCROW=$(printf '%s' "$PASSPHRASE" \
            | python3 infra/provisioning/scripts/escrow-tenant-passphrase.py \
                --public-key "$ESCROW_PUBLIC_KEY")
          if [ -z "$ESCROW" ]; then
            echo "::error::the escrow step produced nothing; refusing to write a passphrase that cannot be recovered"
            exit 1
          fi
          printf '%s\n' "$ESCROW" > escrow.b64

          # Belt to the create-only check in validation: that one refuses an
          # existing repository, this one refuses an existing secret. Minting
          # over a tenant that already holds a passphrase would rotate a live
          # stack's wrapping key without re-wrapping its checkpoint, which
          # strands it -- and `gh secret set` overwrites silently, with no
          # opportunity to notice.
          #
          # Both levels are checked. The one this flow writes is the environment
          # secret, but a passphrase set by hand on an earlier tenant is a
          # repository secret, and that is the case worth refusing --
          # `ghost-tenant-blog` holds exactly that shape today.
          for scope in "actions/secrets" "environments/production/secrets"; do
            if gh api "repos/${TENANT_REPO}/${scope}/PULUMI_CONFIG_PASSPHRASE" --silent 2>/dev/null; then
              echo "::error::${TENANT_REPO} already holds a PULUMI_CONFIG_PASSPHRASE under ${scope}. Refusing to overwrite it: minting over an existing tenant rotates a live stack's wrapping key without re-wrapping the checkpoint, and the value being replaced is not recoverable from here."
              exit 1
            fi
          done

          # The environment has to exist before a secret can be scoped to it,
          # and `gh secret set --env` does not create one.
          gh api --method PUT "repos/${TENANT_REPO}/environments/production" --silent

          printf '%s' "$PASSPHRASE" \
            | gh secret set PULUMI_CONFIG_PASSPHRASE --repo "$TENANT_REPO" --env production
          echo "TENANT_PULUMI_PASSPHRASE=$PASSPHRASE" >> "$GITHUB_ENV"

          {
            echo "## ${TENANT}'s Pulumi secrets passphrase — escrowed ciphertext"
            echo
            echo "Base64 of the passphrase under RSA-OAEP/SHA-256 to the escrow key"
            echo "in \`infra/provisioning/escrow/\`. Decrypt it now, into the password"
            echo "manager — this run is the only copy outside the tenant repository's"
            echo "own write-only Actions secret, and run retention is finite."
            echo
            echo '```'
            echo "$ESCROW"
            echo '```'
            echo
            echo 'Recovery (see infra/provisioning/escrow/README.md):'
            echo
            echo '```bash'
            echo 'base64 -d < escrow.b64 > escrow.bin'
            echo 'openssl pkeyutl -decrypt -inkey ~/tenant-passphrase-escrow.key \'
            echo '  -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \'
            echo '  -pkeyopt rsa_mgf1_md:sha256 -in escrow.bin'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A second copy of the transport, in a form that can be downloaded rather
      # than reselected out of rendered markdown. Both expire; the password
      # manager is the escrow of record.
      - name: Upload the escrowed ciphertext
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tenant-passphrase-escrow
          path: escrow.b64
          retention-days: 90
          if-no-files-found: error

      # ---- the tenant's stack ---------------------------------------------

      - name: Install Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      # `stack init` fails outright on a stack that already exists, and that is
      # the wanted behaviour rather than something to work around. A retry after
      # a failed run reaches here against a stack minted under a passphrase this
      # run cannot reproduce -- resuming under a freshly minted, different one
      # would silently re-wrap the stack under a value the tenant repository's
      # secret does not hold. Recover per RUNBOOK-tenant-onboarding.md, not by
      # re-dispatching.
      #
      # No secret config is set here. See the header: a `workflow_dispatch` input
      # is plaintext in the run's API response, so the database password and the
      # Object Storage key pair are the operator's to add in the handover pull
      # request.
      - name: Initialise the tenant stack and write its non-secret config
        working-directory: tenant
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ env.TENANT_PULUMI_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Re-checked against this step's own effective value: a typo in the
          # `env:` key above is a different failure from the mint step's empty
          # check, and it would otherwise initialise the stack under an empty
          # passphrase and report success.
          if [ -z "$PULUMI_CONFIG_PASSPHRASE" ]; then
            echo "::error::PULUMI_CONFIG_PASSPHRASE is empty for this step; refusing to continue"
            exit 1
          fi
          pulumi login "$TENANT_BACKEND_URL"
          pulumi stack init "$TENANT" --secrets-provider=passphrase
          pulumi config set slug "$TENANT" --stack "$TENANT"
          pulumi config set siteUrl "$SITE_URL" --stack "$TENANT"
          pulumi config set uid "$TENANT_UID" --stack "$TENANT"
          pulumi config set hostPort "$HOST_PORT" --stack "$TENANT"
          pulumi config set appHostPrivateIp "$APP_HOST_PRIVATE_IP" --stack "$TENANT"
          pulumi config set imageRef "$IMAGE_REF" --stack "$TENANT"
          pulumi config set databaseHost "$PLATFORM_DB_PRIVATE_IP" --stack "$TENANT"
          pulumi config set mediaEndpoint "$PLATFORM_MEDIA_ENDPOINT" --stack "$TENANT"
          pulumi config set mediaRegion "$PLATFORM_MEDIA_REGION" --stack "$TENANT"
          pulumi config set mediaBucket "$PLATFORM_MEDIA_BUCKET" --stack "$TENANT"
          # The slug, with no trailing slash: `S3Storage.buildKey` inserts the
          # separator itself. Derived rather than asked for, because a prefix
          # that is not the slug is a tenant whose media lives somewhere its own
          # name does not point at.
          pulumi config set mediaTenantPrefix "$TENANT" --stack "$TENANT"
          pulumi config set mediaPublicBaseUrl "$PLATFORM_MEDIA_PUBLIC_BASE_URL" --stack "$TENANT"

      # `pulumi stack init` wrote this stack's encryption salt into the config
      # file, and the handover commit must not carry it: a salt in a tree anyone
      # can clone is an offline verifier for that tenant's passphrase, testable
      # at the holder's own rate with no state backend and no cloud IAM in the
      # loop. branchLeft/standards PUL-12 bans it outright.
      #
      # The name is unscoped, unlike the estate's `PULUMI_SALT_<REPO>`: the
      # tenant-name grammar permits hyphens and a GitHub secret name permits only
      # alphanumerics and underscores, so a scoped name would be invalid for a
      # tenant such as `acme-blog`. The template reads this exact name.
      #
      # Published here rather than beside the deletion further down, so the
      # window in which this value exists only on this runner is as short as it
      # can be.
      - name: Publish this tenant's encryption salt to its own environment secret
        working-directory: tenant
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TENANT_PROVISIONING }}
        run: |
          set -euo pipefail
          config="Pulumi.${TENANT}.yaml"
          if [ ! -f "$config" ]; then
            echo "::error::$config is missing after stack initialisation; refusing to continue"
            exit 1
          fi
          # Anchored and counted rather than "find the first one". Pulumi writes
          # this key unquoted at column 0; any other shape means the file is not
          # what the deletion step will recognise, and a silent mismatch there
          # commits the salt.
          if [ "$(grep -c '^encryptionsalt:' "$config" || true)" != "1" ]; then
            echo "::error::expected exactly one line in $config starting with 'encryptionsalt:'; refusing to continue"
            exit 1
          fi
          SALT=$(sed -n 's/^encryptionsalt:[[:space:]]*//p' "$config")
          if [ -z "$SALT" ]; then
            echo "::error::the encryptionsalt line in $config carries no value; refusing to continue"
            exit 1
          fi
          # Masked before anything else in this job can print it: the deletion
          # step echoes any offending line it finds, and a mask registered here
          # applies to every later step.
          echo "::add-mask::$SALT"
          case "$SALT" in
            v1:*) ;;
            *)
              echo "::error::the encryptionsalt in $config does not carry Pulumi's 'v1:' prefix; refusing to publish a value this tenant's CI would reject"
              exit 1
              ;;
          esac
          # No trailing newline: the tenant's deploy job appends this value to
          # its stack config with printf, and one would break that YAML line.
          printf '%s' "$SALT" | gh secret set PULUMI_ENCRYPTION_SALT --repo "$TENANT_REPO" --env production
          echo "TENANT_PULUMI_SALT=$SALT" >> "$GITHUB_ENV"

      # The state credentials the tenant's own CI needs to reach its checkpoint.
      # Distributing them is this flow's job -- the tenant repository has no
      # other way to obtain them, and without them its deploy job cannot even
      # log in to the backend.
      #
      # Environment-scoped like the rest: at the repository level they would be
      # readable by any workflow run in that repo, and they reach every tenant
      # stack in the shared bucket rather than only this one.
      - name: Write the tenant repo's state credentials and variables
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TENANT_PROVISIONING }}
        run: |
          set -euo pipefail
          printf '%s' "$AWS_ACCESS_KEY_ID" \
            | gh secret set HETZNER_S3_ACCESS_KEY_ID --repo "$TENANT_REPO" --env production
          printf '%s' "$AWS_SECRET_ACCESS_KEY" \
            | gh secret set HETZNER_S3_SECRET_ACCESS_KEY --repo "$TENANT_REPO" --env production
          # The full backend URL rather than a bucket name: an s3:// backend
          # needs the endpoint, path-style and region query parameters too, and
          # a repo that only held the bucket would have to rebuild them.
          gh variable set PULUMI_BACKEND_URL --repo "$TENANT_REPO" --body "$TENANT_BACKEND_URL"
          # The public address. The private one is stack config, because it is
          # what the container's published port binds; this is what CI connects
          # to, and conflating them is the mistake the two names exist to stop.
          gh variable set APP_HOST_SSH_ADDRESS --repo "$TENANT_REPO" --body "$APP_HOST_SSH_ADDRESS"

      # ---- handover --------------------------------------------------------

      # Runs against the working copy the commit below stages, after the last
      # `pulumi` command that reads this stack -- Pulumi resolves the secrets
      # manager from this file, so deleting the line any earlier would break the
      # config writes above.
      #
      # The secret is confirmed at the server before the line goes, not merely
      # assumed from the earlier step's exit status: a `gh secret set` that
      # looked fine and did not land would leave this working copy holding the
      # only readable copy of the salt, and it is deleted three lines later.
      - name: Remove the encryption salt before the stack config is committed
        working-directory: tenant
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TENANT_PROVISIONING }}
        run: |
          set -euo pipefail
          config="Pulumi.${TENANT}.yaml"
          # gh's own stderr is kept rather than discarded: this is the gate that
          # decides whether the salt may be deleted, and a 401 or a rate limit
          # reported as "no such secret" would be a false cause in the one place
          # it costs most.
          if ! gh api "repos/${TENANT_REPO}/environments/production/secrets/PULUMI_ENCRYPTION_SALT" --silent; then
            echo "::error::could not confirm a PULUMI_ENCRYPTION_SALT secret on ${TENANT_REPO}'s production environment (the API response is above). Refusing to delete the salt from $config: nothing else would then restore it for that repo's own deploy job."
            exit 1
          fi
          if [ "$(sed -n 's/^encryptionsalt:[[:space:]]*//p' "$config")" != "$TENANT_PULUMI_SALT" ]; then
            echo "::error::$config no longer carries the salt published to ${TENANT_REPO}'s PULUMI_ENCRYPTION_SALT secret. Refusing to delete a value that secret cannot restore."
            exit 1
          fi
          sed -i '/^encryptionsalt:/d' "$config"
          # The tenant's own copy of the guard, not this repo's: it is the
          # checker that judges the handover pull request, so a pass here is that
          # verdict rather than a second opinion on it. Its matcher is wider than
          # the deletion above, which is the point -- the deletion removes what
          # Pulumi writes, and this decides whether anything is left.
          if ! python3 scripts/assert-no-committed-pulumi-secrets.py --scan-tree . "$config"; then
            echo "::error::refusing to commit $config: the tenant's committed-secret guard did not clear this tree"
            exit 1
          fi

      # Deliberately never pushes to the generated repo's default branch. The
      # pull request is where an operator adds the three things this flow cannot
      # -- the database password, the Object Storage key pair and the app host's
      # SSH host key -- and merging it is what runs the first deploy.
      - name: Open the handover pull request
        working-directory: tenant
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TENANT_PROVISIONING }}
        run: |
          set -euo pipefail
          git config user.name "branchLeft provisioning"
          git config user.email "noreply@branchleft.co.uk"
          git checkout -b provisioning/handover
          git add -A
          git commit -m "Generate this tenant's repo and commit its stack config"
          git push -u origin provisioning/handover
          gh pr create --repo "$TENANT_REPO" --base main --head provisioning/handover \
            --title "Provisioning handover" \
            --body "$(cat <<'BODY'
          Generated by the platform's provisioning workflow: substituted template
          placeholders and this stack's non-secret config.

          **This is not mergeable as it stands, and that is deliberate.** Three
          values cannot come from an unattended run, and one host-side sequence
          has to have happened first. `RUNBOOK-bootstrap.md` in this repository
          has both, in order.

          Add to this branch:

          - `databasePassword` — printed once by `provision_tenant_db.py` on the
            database host, and by nothing afterwards.
          - `mediaAccessKeyId` and `mediaSecretAccessKey` — this tenant's Object
            Storage key pair.
          - `known_hosts` — the app host's SSH host key, taken from the host over
            an operator root session, never with `ssh-keyscan`.

          All three need this stack's passphrase and its salt locally first;
          `RUNBOOK-bootstrap.md` gives the order, and appending the salt before
          `pulumi config set --secret` is the step that matters.

          Merging runs the deploy, which will fail loudly if the host-side steps
          have not been done or if this repository's `APP_HOST_DEPLOY_KEY`
          environment secret is not set.
          BODY
          )"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Provisioning: ${TENANT}"
            echo
            echo "- repo: \`${TENANT_REPO}\` (\`${TENANT_VISIBILITY}\`)"
            echo "- state backend: \`${TENANT_BACKEND_URL}\`"
            echo "- app host: \`${APP_HOST_PRIVATE_IP}\` private, \`${APP_HOST_SSH_ADDRESS}\` for CI"
            echo "- uid: \`${TENANT_UID}\`, host port: \`${HOST_PORT}\`"
            echo
            echo "### Still to do, in this order"
            echo
            echo "1. Decrypt and file the escrowed passphrase above."
            echo "2. \`provision_tenant_db.py ${TENANT}\` on the database host, as root."
            echo "3. \`provision_tenant_volume.py --uid ${TENANT_UID} ${TENANT}\` on the app host, as root."
            echo "4. Write \`/etc/branchleft/${TENANT}.env\` and \`/opt/branchleft/${TENANT}/compose.yml\` from the stack's outputs, then \`systemctl enable branchleft-compose@${TENANT}\`."
            echo "5. \`provision_deploy_slot.py --public-key-file /dev/stdin ${TENANT}\` on the app host, and set \`APP_HOST_DEPLOY_KEY\` on this tenant repo's \`production\` environment."
            echo "6. Add this tenant's site block, with its \`edgeRequestBodyMaxSize\`, to the edge site registry."
            echo "7. Complete and merge the handover pull request."
            echo
            echo "Full sequence, with the exact commands: \`RUNBOOK-tenant-onboarding.md\`."
            if [ "$TENANT_VISIBILITY" = "private" ]; then
              echo
              echo "This repo is private at the tenant's request. On this plan a"
              echo "private repo can carry no branch ruleset and no environment"
              echo "protection rule, so its \`production\` environment scopes its"
              echo "secrets to the deploy job but gates nothing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
