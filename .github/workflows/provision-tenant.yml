name: Provision tenant

# Onboards one tenant end to end: its identity, its Pulumi state bucket, its
# repo, its first apply, and the pull request that hands it over.
#
# THE GATE IS TWO INDEPENDENT HALVES, AND BOTH ARE LOAD-BEARING.
#
#   1. GitHub. This workflow is `workflow_dispatch` only -- no push, no
#      schedule, no merge can start it -- and the job below declares
#      `environment: tenant-provisioning`, which carries a required reviewer.
#      A required reviewer only exists on a public repository for this plan
#      tier; the environment must already carry the rule before this workflow
#      can gate anything, because an environment with no protection rules runs
#      straight through without pausing. Ordering is in
#      infra/platform/RUNBOOK-bootstrap.md and it is load-bearing.
#
#   2. GCP. The provisioning identity's Workload Identity provider pins
#      `job_workflow_ref` to this file at `main` and `event_name` to
#      `workflow_dispatch`. That is enforced by Google regardless of any
#      GitHub plan or repo setting, so it still holds during any window where
#      the environment rule is missing, removed, or bypassed by an admin.
#      Renaming this file breaks provisioning until the provider condition is
#      updated -- that is the accepted cost of pinning it.
#
# Neither half is redundant. The first is what makes onboarding a reviewed
# act; the second is what stops a routine deploy job minting identities
# however the workflow files are edited.
#
# `GH_PAT_TENANT_PROVISIONING` is the credential this workflow writes to
# generated repositories with. The default GITHUB_TOKEN is scoped to this
# repository and can neither create a repo in the org nor set another repo's
# variables or secrets. No package-read credential is copied into a generated
# repo: @branchleft/ghost-platform-tenant is public, and a run's own
# GITHUB_TOKEN can read a public package. What this PAT does write to the
# generated repo is its own Pulumi secrets passphrase -- minted for that
# tenant alone, never ghost-platform's own -- and the encryption salt that
# verifies it. Those are the two writes in this workflow that hand the new
# repo something it needs to keep secret from ghost-platform itself, going
# forward.

on:
  workflow_dispatch:
    inputs:
      tenant_name:
        description: 'Pulumi stack name and resource prefix (lowercase, hyphenated)'
        required: true
      tenant_repo:
        description: 'Repository to generate, without the org prefix'
        required: true
      state_bucket:
        description: 'Globally unique GCS bucket for this tenant Pulumi state'
        required: true
      deployer_sa_id:
        description: 'Deployer service account id (6-30 chars, unique in the project)'
        required: true
      wif_pool_id:
        description: 'Workload Identity Pool id (unique in the project)'
        required: true
      site_url:
        description: 'https://<hostname> this tenant serves'
        required: true
      image_digest_or_tag:
        description: 'Tenant image, digest preferred (include the sha256: prefix)'
        required: true

permissions:
  contents: read

jobs:
  provision:
    name: Provision
    runs-on: ubuntu-latest

    # The reviewer gate. Do not remove without reading the header: this is
    # half the control, and the run does not pause if the environment carries
    # no protection rule.
    environment: tenant-provisioning

    permissions:
      contents: read
      id-token: write
      packages: read

    # Two provisioning runs at once would race on the shared provisioning
    # state. Never cancel one in flight -- a half-applied identity is worse
    # than a queued run.
    concurrency:
      group: provision-tenant
      cancel-in-progress: false

    # Every input and variable a `run` block needs is bound here rather than
    # interpolated into the script. A `${{ }}` inside `run` is expanded before
    # the shell sees it, so a value containing shell syntax becomes shell
    # source -- in a job holding project-admin-equivalent GCP credentials.
    env:
      TENANT: ${{ inputs.tenant_name }}
      TENANT_REPO: branchLeft/${{ inputs.tenant_repo }}
      STATE_BUCKET: ${{ inputs.state_bucket }}
      DEPLOYER_SA_ID: ${{ inputs.deployer_sa_id }}
      WIF_POOL_ID: ${{ inputs.wif_pool_id }}
      SITE_URL: ${{ inputs.site_url }}
      IMAGE_REF: ${{ inputs.image_digest_or_tag }}
      GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      PLATFORM_DB_CONN: ${{ vars.PLATFORM_DB_INSTANCE_CONNECTION_NAME }}
      PLATFORM_IMAGE_PATH: ${{ vars.PLATFORM_TENANT_IMAGE_REPOSITORY_PATH }}
      PLATFORM_MEDIA_URL: ${{ vars.PLATFORM_MEDIA_BUCKET_URL }}
      # Read by every `pulumi` command against the provisioning stack -- the
      # one stack this job keeps touching for the rest of this repo's life.
      # This is ghost-platform's own repo-level passphrase, one value covering
      # every stack this repo's own workflows reach (also `platform`, via
      # infra-platform-ci.yml's `deploy` job). It is deliberately NOT used for
      # the tenant's own stack further down --
      # that stack gets its own freshly minted passphrase, scoped to that
      # tenant alone, so ghost-platform stops holding a decrypt key for
      # infrastructure it no longer manages after this run. An unset
      # repository secret expands to an empty string here rather than an
      # absent variable, which the guard step below exists to catch.
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

    steps:
      # First, before checkout and before anything that could create or
      # validate: the federation condition in the runbook's P2 pins
      # `job_workflow_ref`, which GitHub documents principally for
      # reusable-workflow jobs. This job is standalone. Absence would fail
      # closed -- a string-equality condition on a missing claim can only deny
      # -- so this is a correctness guard rather than a security one, and it
      # earns its place by turning an opaque token-exchange failure into a
      # named one at step 1. It also prints the values P2's condition must be
      # written from, rather than predicted from.
      #
      # The token itself is never echoed and never reaches argv; only these
      # six non-secret claims are printed.
      - name: Report the federation claims this run presents
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://iam.googleapis.com/" \
            | python3 -c '
          import base64, json, sys
          token = json.load(sys.stdin)["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ("sub", "event_name", "workflow_ref", "job_workflow_ref",
                      "repository", "ref"):
              value = claims.get(key, "<<ABSENT>>")
              print(f"{key:17}= {value}")
          if "job_workflow_ref" not in claims:
              sys.exit("::error::job_workflow_ref is absent from this token. "
                       "The provisioning provider condition pins it, so no "
                       "token exchange can succeed. Re-point the condition at "
                       "workflow_ref and record the substitution in "
                       "infra/platform/RUNBOOK-bootstrap.md P2.")
          '

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cheap, credential-free, and ahead of everything that costs money or
      # mutates: a tenant name that is not a valid Pulumi stack and GCP prefix
      # fails much later and much more expensively.
      - name: Validate inputs
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$TENANT" =~ ^[a-z][a-z0-9-]{1,28}[a-z0-9]$ ]] \
            || fail "tenant_name must be lowercase alphanumeric-hyphen, 3-30 chars"
          [[ "$DEPLOYER_SA_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] \
            || fail "deployer_sa_id must satisfy GCP service account id grammar"
          [[ "$STATE_BUCKET" =~ ^[a-z0-9][a-z0-9._-]{1,61}[a-z0-9]$ ]] \
            || fail "state_bucket must satisfy GCS bucket naming"
          [[ "$SITE_URL" =~ ^https:// ]] || fail "site_url must be https"
          if gh repo view "$TENANT_REPO" >/dev/null 2>&1; then
            fail "$TENANT_REPO already exists -- onboarding is create-only"
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TENANT_PROVISIONING }}

      # Pulumi's passphrase provider reads this from the environment via a
      # plain lookup, which does not distinguish "unset" from "set to an
      # empty string" -- and GitHub expands a repository secret that does not
      # exist to `''`, not to an error. So a missing secret would not fail
      # here or later in this job; it would mint or restore a stack encrypted
      # with an empty passphrase and report success, which is exactly the
      # silent-success shape infra-platform-ci.yml's deploy job guards
      # against for the same value. Cheap and credential-free, so it runs
      # before anything that would act on a stack under that empty value.
      - name: Confirm the shared secrets passphrase is set
        run: |
          if [ -z "$PULUMI_CONFIG_PASSPHRASE" ]; then
            echo "::error::PULUMI_CONFIG_PASSPHRASE is empty or unset. Refusing to continue: Pulumi would treat an empty value as a valid passphrase rather than failing closed."
            exit 1
          fi

      # `registry-url` covers two installs: the generated repo's `npm ci`
      # further down, which pulls `@branchleft/ghost-platform-tenant`, and
      # `infra/provisioning`'s own, which now takes a dev dependency on
      # `@branchleft/tsconfig`. GitHub Packages answers 401 unauthenticated
      # even for a public package, so both steps carry the token. Against
      # `npm.pkg.github.com` with no `scope` input, the action scopes the
      # registry line to the repository owner rather than setting a default
      # registry, so `infra/provisioning`'s public dependencies still resolve
      # from npmjs. The file it writes lives in `RUNNER_TEMP`, which is what
      # keeps the token out of the tree that gets committed below.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: infra/provisioning/.nvmrc
          registry-url: https://npm.pkg.github.com

      - name: Authenticate to GCP as the provisioning identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_PROVISIONING_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PROVISIONING_SA_EMAIL }}

      - name: Install Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      # ---- identity and state bucket -------------------------------------

      - name: Configure the provisioning stack
        working-directory: infra/provisioning
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npm ci
          pulumi login gs://branchleft-pulumi-state
          # `--secrets-provider` applies only when this call creates the stack,
          # and `Pulumi.<stack>.yaml` never leaves the runner. So a retry
          # against a stack that already exists gets no secrets provider in its
          # configuration at all, falls back to the passphrase provider, and
          # fails on a stack whose state says otherwise.
          #
          # The deployment records the provider and everything about it that
          # isn't the secret itself. Restore the configuration from there
          # rather than naming the key again: for `cloud` that's a wrapped
          # data key, for `passphrase` a salt, and the job's own
          # PULUMI_CONFIG_PASSPHRASE above supplies what the deployment can't.
          #
          # --allow-passphrase: this config file never leaves the runner --
          # nothing in this step commits it anywhere -- which is what makes
          # restoring a passphrase-provider salt here acceptable. Do not add
          # this flag to the tenant-stack restore below without first reading
          # why it is absent there.
          if pulumi stack select "$TENANT" 2>/dev/null; then
            pulumi stack export --stack "$TENANT" > deployment.json
            python3 scripts/restore-stack-secrets-config.py "$TENANT" deployment.json --allow-passphrase
            rm deployment.json
          else
            # A new stack on a filestate backend needs a secrets manager named
            # at creation. `passphrase` reads PULUMI_CONFIG_PASSPHRASE above --
            # ghost-platform's own repo-level passphrase. No GCP KMS
            # dependency: this stack lives in ghost-platform for good, so
            # nothing about it needs to survive the GCP wind-down under a
            # separate key.
            pulumi stack select "$TENANT" --create --secrets-provider=passphrase
          fi
          pulumi config set gcp:project "$GCP_PROJECT"
          pulumi config set tenantName "$TENANT"
          pulumi config set tenantGithubRepo "$TENANT_REPO"
          pulumi config set stateBucketName "$STATE_BUCKET"
          pulumi config set deployerServiceAccountId "$DEPLOYER_SA_ID"
          pulumi config set workloadIdentityPoolId "$WIF_POOL_ID"
          pulumi config set platformDbInstanceConnectionName "$PLATFORM_DB_CONN"
          pulumi config set platformTenantImageRepositoryDockerPath "$PLATFORM_IMAGE_PATH"
          pulumi config set platformMediaBucketUrl "$PLATFORM_MEDIA_URL"

      - name: Refuse a provisioning plan that destroys anything
        working-directory: infra/provisioning
        run: |
          set -euo pipefail
          pulumi preview --stack "$TENANT" --json > preview.json
          python3 scripts/assert-no-provisioning-deletes.py --self-test
          python3 scripts/assert-no-provisioning-deletes.py --verify-coverage ../platform .
          if ! python3 scripts/assert-no-provisioning-deletes.py --tenant "$TENANT" preview.json; then
            echo "--- full plan follows ---"
            python3 -m json.tool preview.json
            exit 1
          fi

      - name: Apply the tenant identity and state bucket
        working-directory: infra/provisioning
        run: pulumi up --stack "$TENANT" --yes

      # Captured into variables and checked before use. A failing command
      # substitution inside `echo`'s arguments does not trip errexit, so the
      # obvious spelling of this step writes empty outputs on failure -- which
      # then flow into the generated repo's variables and surface much later,
      # after that repo exists holding a live copy of the platform PAT.
      - name: Read the identity outputs
        id: identity
        working-directory: infra/provisioning
        run: |
          set -euo pipefail
          provider=$(pulumi stack output githubActionsWorkloadIdentityProvider --stack "$TENANT")
          sa_email=$(pulumi stack output githubActionsDeployerServiceAccountEmail --stack "$TENANT")
          bucket=$(pulumi stack output pulumiStateBucket --stack "$TENANT")
          for pair in "provider=$provider" "sa_email=$sa_email" "bucket=$bucket"; do
            if [ -z "${pair#*=}" ]; then
              echo "::error::stack output ${pair%%=*} is empty; refusing to continue before the tenant repo is created"
              exit 1
            fi
          done
          {
            echo "provider=$provider"
            echo "sa_email=$sa_email"
            echo "bucket=$bucket"
          } >> "$GITHUB_OUTPUT"

      # ---- the tenant repo ------------------------------------------------

      # Everything from here leaves artefacts a failure does not clean up.
      # There is no automatic rollback -- see "Recovering a failed provisioning
      # run" in infra/platform/RUNBOOK-bootstrap.md for the order to undo in,
      # and why deleting the repo is the step that revokes the PAT copy.
      - name: Generate the tenant repo from the template
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TENANT_PROVISIONING }}
        run: |
          set -euo pipefail
          gh repo create "$TENANT_REPO" --private \
            --template branchLeft/ghost-platform-tenant-template \
            --description "Tenant infrastructure stack"

          # GitHub copies template content asynchronously and `gh repo create`
          # returns before it lands. Cloning inside that window succeeds
          # against an empty repository -- git calls it a warning, not an
          # error -- so the first thing to fail is `sed` two steps later,
          # naming a missing Pulumi.yaml rather than the race that caused it.
          # Poll for the file the substitution step actually needs.
          for _ in $(seq 1 30); do
            if gh api "repos/${TENANT_REPO}/contents/Pulumi.yaml" --silent 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::${TENANT_REPO} was created but the template content did not appear within 60s. Nothing further has run; recover per the runbook, starting with deleting the repo."
          exit 1

      # No secret is written here. A tenant reads @branchleft/ghost-platform-tenant
      # with its own run's GITHUB_TOKEN, so it holds no long-lived credential
      # and a half-provisioned repo is not itself a live credential to revoke.
      - name: Write the repo variables
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TENANT_PROVISIONING }}
          DEPLOYER_SA_EMAIL: ${{ steps.identity.outputs.sa_email }}
          WIF_PROVIDER: ${{ steps.identity.outputs.provider }}
        run: |
          set -euo pipefail
          gh variable set GCP_PROJECT_ID --repo "$TENANT_REPO" --body "$GCP_PROJECT"
          gh variable set GCP_DEPLOYER_SA_EMAIL --repo "$TENANT_REPO" --body "$DEPLOYER_SA_EMAIL"
          gh variable set GCP_WORKLOAD_IDENTITY_PROVIDER --repo "$TENANT_REPO" --body "$WIF_PROVIDER"
          gh variable set PULUMI_STATE_BUCKET --repo "$TENANT_REPO" --body "$STATE_BUCKET"

      # This tenant's own secrets passphrase: minted fresh, never typed by a
      # human, never reused across tenants or across this repo's own stacks.
      # Set on the tenant repo before anything Pulumi-side needs it, so a
      # human reading the generated repo's settings never sees a longer gap
      # than this job's own duration between the repo existing and it holding
      # the secret its own CI will need on its very next push.
      #
      # This is the resolution the two-repo hazard needs: ghost-platform's own
      # passphrase must never double as a tenant's, because two different
      # pipelines (this one, and the tenant repo's own CI) would then hold two
      # different secrets for one checkpoint the moment either repo's
      # passphrase ever changed. Minting one value and writing it to the one
      # place both pipelines read from removes the second pipeline entirely --
      # after this run, provisioning never touches this tenant's stack again.
      #
      # This value has NO durable copy outside GitHub's own encrypted-secret
      # storage. It is never printed: this repo is PUBLIC, so anything an
      # Actions run writes to its own logs OR its job summary is visible to
      # anyone on the internet, not just this org -- there is no safe channel
      # in this job to hand a human the plaintext. That is a real, accepted
      # gap against the general rule that a minted secret should be escrowed
      # (a human-chosen passphrase is escrowed by typing it into the password
      # manager directly, off any log); closing it needs a retrieval channel
      # that does not touch this repo's own Actions output, which is
      # follow-up work, not a property this step can give itself. What this
      # step *can* do, and does below: say so, loudly, every run, so the gap
      # is a known operational fact rather than a silent one discovered later.
      - name: Mint this tenant's own secrets passphrase
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TENANT_PROVISIONING }}
        run: |
          set -euo pipefail
          PASSPHRASE=$(python3 infra/provisioning/scripts/mint-tenant-passphrase.py)
          echo "::add-mask::$PASSPHRASE"
          if [ -z "$PASSPHRASE" ]; then
            echo "::error::minted passphrase is empty; refusing to continue"
            exit 1
          fi
          printf '%s' "$PASSPHRASE" | gh secret set PULUMI_CONFIG_PASSPHRASE --repo "$TENANT_REPO"
          echo "TENANT_PULUMI_PASSPHRASE=$PASSPHRASE" >> "$GITHUB_ENV"
          {
            echo "## ${TENANT}'s Pulumi secrets passphrase is NOT escrowed"
            echo
            echo "A fresh passphrase was minted and stored only as this"
            echo "tenant's own \`PULUMI_CONFIG_PASSPHRASE\` Actions secret."
            echo "GitHub secrets are write-only -- there is no way to read it"
            echo "back, from this run or any other, and it is never printed"
            echo "here because this repo is public. If durable recoverability"
            echo "matters for this tenant before its passphrase-only copy is"
            echo "acceptable long-term, overwrite it now with a human-chosen,"
            echo "password-manager-escrowed value:"
            echo '```'
            echo "gh secret set PULUMI_CONFIG_PASSPHRASE --repo \"$TENANT_REPO\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- the tenant's first apply ---------------------------------------

      - name: Substitute placeholders and initialise the tenant stack
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TENANT_PROVISIONING }}
          DEPLOYER_SA_EMAIL: ${{ steps.identity.outputs.sa_email }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Overrides the job-level PULUMI_CONFIG_PASSPHRASE above for this
          # step and for the two that run `pulumi` against this tenant's stack
          # after it -- "Refuse a first apply that touches platform
          # infrastructure" and "Tenant first apply": this tenant's own freshly
          # minted value, never the shared repo-level one. Step-level env always wins over
          # job-level env of the same name, so this is unambiguous rather
          # than relying on GITHUB_ENV write-order against the job env.
          PULUMI_CONFIG_PASSPHRASE: ${{ env.TENANT_PULUMI_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Re-checked here, not just at mint time: this reads the step's own
          # effective value, so a typo in the `env:` key above (a different
          # failure than the mint step's own empty-value guard) would also
          # surface here instead of silently initialising the stack under an
          # empty passphrase.
          if [ -z "$PULUMI_CONFIG_PASSPHRASE" ]; then
            echo "::error::PULUMI_CONFIG_PASSPHRASE is empty for this step; refusing to continue"
            exit 1
          fi
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TENANT_REPO}.git" tenant
          cd tenant
          # The tenant-facing README replaces the template-facing one before
          # substitution. A template snapshot without README.tenant.md fails
          # here, before anything is pushed back to the new repo.
          mv README.tenant.md README.md
          # Only the files the template's placeholder table names.
          for f in Pulumi.yaml .github/workflows/infra-ci.yml scripts/assert-no-tenant-deletes.py README.md; do
            sed -i "s/__TENANT_PULUMI_PROJECT__/${TENANT}-infra/g; s/__TENANT_NAME__/${TENANT}/g" "$f"
          done
          python3 scripts/assert-placeholders-substituted.py

          npm ci
          # This tenant's own backend, not the shared bucket -- a stack
          # reference cannot cross backends, which is why the platform values
          # below are plain config rather than a StackReference.
          pulumi login "gs://${STATE_BUCKET}"
          # `stack init` fails outright on a stack that already exists, and a
          # retry after a failed first apply reaches here with one -- holding
          # the resources that apply did create. Resume onto it rather than
          # demanding it be torn down first, restoring the secrets
          # configuration the same script the provisioning stack uses above --
          # in principle. In practice the restore below deliberately omits
          # --allow-passphrase, unlike the provisioning stack's restore
          # earlier in this file, so it refuses rather than resumes.
          #
          # That omission is not what keeps an `encryptionsalt` out of this
          # tenant's own repo. The two steps named below this one do that:
          # `pulumi stack init` writes a salt into the config file here, "Publish
          # this tenant's encryption salt to its own repository secret" moves it
          # to the tenant's own secret, and "Remove the encryption salt before
          # the stack config is committed" deletes the line before `git add -A`
          # ever sees it.
          #
          # What the omission IS about is which VALUE would decrypt the
          # stack. This tenant's stack is minted passphrase-wrapped below,
          # using a value minted fresh in the step above and never escrowed
          # anywhere this job (or any later one) can read back -- GitHub
          # Actions secrets are write-only. A retry that reaches this branch
          # is hitting a stack that already exists under a passphrase this
          # run has no way to reproduce, so refusing here is correct:
          # resuming under a freshly-minted, DIFFERENT passphrase would
          # silently re-wrap the stack under a value the tenant repo's
          # secret does not hold. Recover per "Recovering a failed
          # provisioning run" in infra/platform/RUNBOOK-bootstrap.md, not by
          # retrying this workflow.
          if pulumi stack select "$TENANT" 2>/dev/null; then
            pulumi stack export --stack "$TENANT" > deployment.json
            python3 "$GITHUB_WORKSPACE/infra/provisioning/scripts/restore-stack-secrets-config.py" \
              "$TENANT" deployment.json
            rm deployment.json
          else
            pulumi stack init "$TENANT" --secrets-provider=passphrase
          fi
          pulumi config set gcp:project "$GCP_PROJECT" --stack "$TENANT"
          pulumi config set tenantName "$TENANT" --stack "$TENANT"
          pulumi config set siteUrl "$SITE_URL" --stack "$TENANT"
          pulumi config set imageDigestOrTag "$IMAGE_REF" --stack "$TENANT"
          pulumi config set deployerServiceAccountEmail "$DEPLOYER_SA_EMAIL" --stack "$TENANT"
          pulumi config set platformDbInstanceConnectionName "$PLATFORM_DB_CONN" --stack "$TENANT"
          pulumi config set platformTenantImageRepositoryDockerPath "$PLATFORM_IMAGE_PATH" --stack "$TENANT"
          pulumi config set platformMediaBucketUrl "$PLATFORM_MEDIA_URL" --stack "$TENANT"

      # `pulumi stack init` above wrote this stack's encryption salt into the
      # config file, and the handover commit below must not carry it: a salt in
      # a tree anyone can clone is an offline verifier for that tenant's stack
      # passphrase, testable at the holder's own rate with no state backend and
      # no cloud IAM in the loop. branchLeft/standards PUL-12 bans it outright.
      # The generated repo's own CI appends it back from this secret for the
      # duration of a deploy job.
      #
      # The name is unscoped, unlike the estate's `PULUMI_SALT_<REPO>`: the
      # tenant-name grammar validated at the top of this job permits hyphens
      # and a GitHub secret name permits only alphanumerics and underscores, so
      # a scoped name would be invalid for a tenant such as `acme-blog`. The
      # template reads this exact name -- a mismatch here is a tenant that
      # cannot decrypt its own stack.
      #
      # Published here rather than beside the deletion further down, so the
      # window in which this value exists only on this runner is as short as it
      # can be. Nothing between here and there rewrites the salt, and the
      # deletion step asserts that rather than assuming it.
      - name: Publish this tenant's encryption salt to its own repository secret
        working-directory: tenant
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TENANT_PROVISIONING }}
        run: |
          set -euo pipefail
          config="Pulumi.${TENANT}.yaml"
          if [ ! -f "$config" ]; then
            echo "::error::$config is missing after stack initialisation; refusing to continue"
            exit 1
          fi
          # Anchored and counted rather than "find the first one". Pulumi writes
          # this key unquoted at column 0; any other shape means the file is not
          # what the deletion step will recognise, and a silent mismatch there
          # commits the salt.
          if [ "$(grep -c '^encryptionsalt:' "$config" || true)" != "1" ]; then
            echo "::error::expected exactly one line in $config starting with 'encryptionsalt:'; refusing to continue"
            exit 1
          fi
          SALT=$(sed -n 's/^encryptionsalt:[[:space:]]*//p' "$config")
          if [ -z "$SALT" ]; then
            echo "::error::the encryptionsalt line in $config carries no value; refusing to continue"
            exit 1
          fi
          # Masked before anything else in this job can print it: the guard in
          # the deletion step echoes any offending line it finds, and a mask
          # registered here applies to every later step.
          echo "::add-mask::$SALT"
          case "$SALT" in
            v1:*) ;;
            *)
              echo "::error::the encryptionsalt in $config does not carry Pulumi's 'v1:' prefix; refusing to publish a value this tenant's CI would reject"
              exit 1
              ;;
          esac
          # No trailing newline: the tenant's deploy job appends this value to
          # its stack config with printf, and one would break that YAML line.
          printf '%s' "$SALT" | gh secret set PULUMI_ENCRYPTION_SALT --repo "$TENANT_REPO"
          echo "TENANT_PULUMI_SALT=$SALT" >> "$GITHUB_ENV"

      # The platform guard, not the tenant one. This apply runs as the
      # provisioning identity against a program that could in principle be
      # edited to name a shared resource; the tenant-side guard's protected
      # set is tenant-derived and would not catch that.
      - name: Refuse a first apply that touches platform infrastructure
        working-directory: tenant
        env:
          # This tenant's own passphrase, same as the init step above -- not
          # the job-level shared one.
          PULUMI_CONFIG_PASSPHRASE: ${{ env.TENANT_PULUMI_PASSPHRASE }}
        run: |
          # `set -e` is load-bearing here, not boilerplate: the delete-check
          # two lines down is not the last command in this script, and
          # without errexit its non-zero exit would be silently swallowed --
          # the shell would carry on to self-test/verify-coverage, and the
          # step's own exit code would end up being THEIRS, not the delete
          # check's. That shape is exactly how this guard could report green
          # over a plan that would have destroyed platform infrastructure.
          set -euo pipefail
          if [ -z "$PULUMI_CONFIG_PASSPHRASE" ]; then
            echo "::error::PULUMI_CONFIG_PASSPHRASE is empty for this step; refusing to continue"
            exit 1
          fi
          pulumi preview --stack "$TENANT" --json > preview.json
          python3 "$GITHUB_WORKSPACE/infra/provisioning/scripts/assert-no-provisioning-deletes.py" \
            --tenant "$TENANT" preview.json
          python3 scripts/assert-no-tenant-deletes.py --self-test
          python3 scripts/assert-no-tenant-deletes.py --verify-coverage node_modules/@branchleft/ghost-platform-tenant/dist

      - name: Tenant first apply
        working-directory: tenant
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ env.TENANT_PULUMI_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$PULUMI_CONFIG_PASSPHRASE" ]; then
            echo "::error::PULUMI_CONFIG_PASSPHRASE is empty for this step; refusing to continue"
            exit 1
          fi
          pulumi up --stack "$TENANT" --yes

      # ---- handover --------------------------------------------------------

      # Runs against the working copy the commit below stages, after the last
      # `pulumi` command that reads this stack -- Pulumi resolves the secrets
      # manager from this file, so deleting the line any earlier would break
      # the preview and the first apply.
      #
      # The secret is confirmed at the server before the line goes, not merely
      # assumed from the earlier step's exit status: a `gh secret set` that
      # looked fine and did not land would leave this working copy holding the
      # only readable copy of the salt, and it is deleted three lines later.
      - name: Remove the encryption salt before the stack config is committed
        working-directory: tenant
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TENANT_PROVISIONING }}
        run: |
          set -euo pipefail
          config="Pulumi.${TENANT}.yaml"
          # gh's own stderr is kept rather than discarded: this is the gate
          # that decides whether the salt may be deleted, and a 401 or a rate
          # limit reported as "no such secret" would be a false cause in the
          # one place it costs most.
          if ! gh api "repos/${TENANT_REPO}/actions/secrets/PULUMI_ENCRYPTION_SALT" --silent; then
            echo "::error::could not confirm a PULUMI_ENCRYPTION_SALT secret on ${TENANT_REPO} (the API response is above). Refusing to delete the salt from $config: nothing else would then restore it for that repo's own deploy job."
            exit 1
          fi
          if [ "$(sed -n 's/^encryptionsalt:[[:space:]]*//p' "$config")" != "$TENANT_PULUMI_SALT" ]; then
            echo "::error::$config no longer carries the salt published to ${TENANT_REPO}'s PULUMI_ENCRYPTION_SALT secret. Refusing to delete a value that secret cannot restore."
            exit 1
          fi
          sed -i '/^encryptionsalt:/d' "$config"
          # The tenant's own copy of the guard, not this repo's: it is the
          # checker that judges the handover pull request, so a pass here is
          # that verdict rather than a second opinion on it. Its matcher is
          # wider than the deletion above, which is the point -- the deletion
          # removes what Pulumi writes, and this decides whether anything is
          # left. Any non-zero status refuses: this step needs "provably
          # clean", and a run that could not read the file has not shown that.
          if ! python3 scripts/assert-no-committed-pulumi-secrets.py --scan-tree . "$config"; then
            echo "::error::refusing to commit $config: the tenant's committed-secret guard did not clear this tree"
            exit 1
          fi

      - name: Open the handover pull request
        working-directory: tenant
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TENANT_PROVISIONING }}
        run: |
          git config user.name "branchLeft provisioning"
          git config user.email "noreply@branchleft.co.uk"
          git checkout -b provisioning/handover
          git add -A
          git commit -m "Substitute template placeholders and commit the stack config"
          git push -u origin provisioning/handover
          gh pr create --repo "$TENANT_REPO" --base main --head provisioning/handover \
            --title "Provisioning handover" \
            --body "$(cat <<'BODY'
          Generated by the platform's provisioning workflow. Contains the
          substituted template placeholders and the stack config file the
          first apply produced.

          Merging is the confirmation test: the push to `main` runs the deploy
          job, and a healthy first run reports `unchanged` because the
          infrastructure already exists.

          Nothing here is a value that can be entered wrongly. `imageDigestOrTag`
          is the only field worth a second look before merging.
          BODY
          )"

      # Deliberately never pushes to the generated repo's default branch. The
      # file being committed names the image this tenant will actually run; a
      # generated repo must not be the one place in the programme where code
      # reaches main unreviewed.
      - name: Summary
        if: always()
        env:
          DEPLOYER_SA_EMAIL: ${{ steps.identity.outputs.sa_email }}
        run: |
          {
            echo "## Provisioning: ${TENANT}"
            echo
            echo "- repo: \`${TENANT_REPO}\`"
            echo "- state bucket: \`${STATE_BUCKET}\`"
            echo "- deployer: \`${DEPLOYER_SA_EMAIL:-unknown}\`"
            echo
            echo "Onboarding completes when the handover pull request is merged."
          } >> "$GITHUB_STEP_SUMMARY"
