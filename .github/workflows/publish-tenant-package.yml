name: Publish tenant package

# Builds and publishes infra/tenant/ as @branchleft/ghost-platform-tenant to
# GitHub Packages whenever a stable semver tag is pushed. Mirrors
# branchLeft/components' publish.yml, adapted for this repo's package
# manager (npm, not pnpm) and for a plain `tsc` build (no bundler -- this is
# a server-side Pulumi component, not a browser library).
#
# Deliberately excludes infra-tenant-ci.yml's job from this file and vice
# versa: that workflow type-checks every push/PR touching this repo and
# never emits or publishes anything; this one only runs on a version tag and
# never runs `tsc --noEmit` on its own, so the two can't race or duplicate
# each other's failure modes.

# `workflow_dispatch` is the escape hatch for a tag push that produced no run
# at all. GitHub honours `[skip ci]` in the head commit's message for tag
# pushes as well as branch pushes, and `main`'s head is usually the graphify
# bot's `[skip ci]` commit -- so a tag cut from `origin/main` normally lands on
# it and is silently skipped. There is no failed run to notice: the only
# symptom is the version never appearing in the registry.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  publish:
    name: Build & Publish to GitHub Packages
    runs-on: ubuntu-latest
    # Observed 0.27-0.42min over the last 8 successful runs (p95 0.42min).
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: infra/tenant

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: infra/tenant/.nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'
          cache: npm
          cache-dependency-path: infra/tenant/package-lock.json

      # `npm publish` takes the version from package.json and ignores the tag,
      # so the two can disagree. A tag behind package.json fails closed on the
      # duplicate-version check, but a tag *ahead* of it would quietly publish
      # something other than what the tag names.
      - name: Refuse a tag that disagrees with package.json
        if: github.event_name == 'push'
        run: |
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${PACKAGE_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} names a different version than package.json (${PACKAGE_VERSION}). Nothing published."
            exit 1
          fi

      # The install needs the token as much as the publish does: this package
      # now takes a dev dependency on `@branchleft/tsconfig`, from the same
      # registry, and GitHub Packages answers 401 to an anonymous read.
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
