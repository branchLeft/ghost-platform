name: Broker CI

# Type-checks and tests the broker's HTTP endpoints (services/broker/):
# reconcile, reset, status, drain (see
# ghost-platform-docs/19-try-it-now-design/02-broker-and-slot.html §03).
# The local-sandbox proof (a real HTTP server, real signing, a real
# execFile'd stand-in for the sudoers-enumerated wrapper) runs inside the
# same vitest suite as the unit tests -- there is no separate live-proof
# workflow, unlike demo-gate-image.yml, because there is no reverse proxy or
# container boundary this service's own tests need a real image to cross.
# server.test.ts's strongest proof spawns the built `dist/server.js` as its
# own process (not `src/server.ts` imported in-process), so the build step
# below runs before the tests rather than letting the test suite build
# on demand -- the same artefact either way, just not hidden inside a test.

on:
  push:
    branches: [main]
  # A pull request starts this only when its diff touches something the job
  # reads: the service, render-core (linked by `link:` and built first) and the
  # demo-host golden files and wrapper the unit tests compare against. Push to
  # main stays unfiltered as the backstop.
  pull_request:
    branches: [main]
    paths:
      - 'services/broker/**'
      - 'render-core/**'
      - 'demo-host/provision/**'
      - '.github/workflows/broker-ci.yml'

# `packages: read` because this service takes a dev dependency on
# `@branchleft/tsconfig`, which is hosted on GitHub Packages and answers 401
# to an anonymous request even for a public package.
permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Broker type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/broker

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: services/broker/.nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'
          cache: pnpm
          cache-dependency-path: services/broker/pnpm-lock.yaml

      # The service links render-core by a relative link: dependency and
      # needs its compiled types.
      - name: Build render-core
        working-directory: render-core
        run: pnpm install --frozen-lockfile && pnpm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run coverage
