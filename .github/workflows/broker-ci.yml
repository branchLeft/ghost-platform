name: Broker CI

# Type-checks and tests the broker's HTTP endpoints (services/broker/):
# reconcile, reset, status, drain (see
# ghost-platform-docs/19-try-it-now-design/02-broker-and-slot.html §03).
# The local-sandbox proof (a real HTTP server, real signing, a real
# execFile'd stand-in for the sudoers-enumerated wrapper) runs inside the
# same vitest suite as the unit tests -- there is no separate live-proof
# workflow, unlike demo-gate-image.yml, because there is no reverse proxy or
# container boundary this service's own tests need a real image to cross.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# `packages: read` because this service takes a dev dependency on
# `@branchleft/tsconfig`, which is hosted on GitHub Packages and answers 401
# to an anonymous request even for a public package.
permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Broker type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/broker

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: services/broker/.nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'
          cache: npm
          cache-dependency-path: services/broker/package-lock.json

      # The service links render-core by a relative file: dependency and
      # needs its compiled types.
      - name: Build render-core
        working-directory: render-core
        run: npm ci && npm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run coverage
