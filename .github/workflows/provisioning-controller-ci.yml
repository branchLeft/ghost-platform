name: Provisioning controller CI

# Type-checks and tests the tenant provisioning controller's core
# (services/provisioning-controller/): the ordered plan, the approval gate
# and the idempotent executor, and the provisioning API contract's in-memory
# mock (mock/) with the spec-agreement test (contract/), with the coverage floor
# enforced in vitest.config.ts. Formatting and ESLint are not run here: the repo-tooling
# workflow runs the root `format:check` and `lint:check` over the whole tree
# on every pull request.

on:
  push:
    branches: [main]
    paths:
      - 'services/provisioning-controller/**'
      - '.github/workflows/provisioning-controller-ci.yml'
  # A pull request starts this only when its diff touches something the job
  # reads: the package or this workflow. A push to main starts it on the same
  # paths.
  pull_request:
    branches: [main]
    paths:
      - 'services/provisioning-controller/**'
      - '.github/workflows/provisioning-controller-ci.yml'

# One run per pull request: a newer push cancels the superseded run. A push
# to main is its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `packages: read` because this package takes a dev dependency on
# `@branchleft/tsconfig`, which is hosted on GitHub Packages and answers 401
# to an anonymous request even for a public package.
permissions:
  contents: read
  packages: read

jobs:
  test:
    name: provisioning-controller type check and test
    runs-on: ubuntu-latest
    # Install, typecheck and a one-second vitest run with coverage on one
    # dependency-light package; the bound is generous.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/provisioning-controller

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: services/provisioning-controller/.nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'
          cache: pnpm
          cache-dependency-path: services/provisioning-controller/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: pnpm run typecheck

      - name: Test with coverage
        run: pnpm run coverage

      - name: Build
        run: pnpm run build

      # The mock is started the way the package README says, on the built
      # output, and answers each of the contract's five operations over HTTP.
      - name: The built mock answers every operation
        run: python3 mock/smoke.py
