name: Promote CI

# Tests the promotion attestation scripts (promote/). They import the release
# classifier, so this installs its one dependency, acorn, from the public npm
# registry with its lockfile and runs no install scripts. No Docker, no network.

on:
  push:
    branches: [main]
    paths:
      - promote/**
      - gate-set/gate-set.mjs
      - services/release-classifier/**
      - .github/workflows/promote-ci.yml
  pull_request:
    branches: [main]
    paths:
      - promote/**
      - gate-set/gate-set.mjs
      - services/release-classifier/**
      - .github/workflows/promote-ci.yml

permissions:
  contents: read

# One run per pull request: a newer push cancels the superseded run. A push,
# merge_group, schedule or manual run is its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Promote scripts test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: services/release-classifier/.nvmrc

      - name: Install the classifier's dependency
        working-directory: services/release-classifier
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test
        run: node --test promote/*.test.mjs
