name: Broker release

# Builds the broker bundle (services/broker, `pnpm run bundle`), packs it into
# a deterministic tarball, and on a `broker-vX.Y.Z` tag signs it with a GitHub
# artifact attestation and publishes it as a GitHub Release. The release is
# what the shared-infra `broker_deploy` role fetches and verifies; see
# "Release artifact and how to verify it" in services/broker/RUNBOOK-broker-deploy.md.
#
# Signing is keyless: the attestation is a SLSA provenance statement signed
# for this workflow's own identity, so no key or secret is stored anywhere.
# It shows the commit the tag named when the run started, and which workflow
# run produced the bytes. It does not show the bytes are a clean build, or who
# pushed the tag. The consumer's control is pinning the tarball's sha256 in
# reviewed code.
#
# Two jobs, privileges split:
#   build    reads only. Installs, type-checks, tests, bundles, packs. Every
#            dependency script runs here, with no write token and no
#            identity token. On a pull request this is the whole workflow.
#   release  tag pushes only. Holds the write and signing permissions and runs
#            no install or build step: it downloads what `build` packed,
#            refuses a tag that is not a proper release tag, attests the
#            tarball, and creates the release.
#
# The tag prefix keeps this apart from the tenant package's `vX.Y.Z` tags and
# render-core's `render-core-vX.Y.Z`; neither pattern matches another's ref.
# There is deliberately no `workflow_dispatch`: a dispatch could sign an
# arbitrary ref.

on:
  push:
    tags:
      - 'broker-v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [main]
    paths:
      - 'services/broker/**'
      - 'render-core/**'
      - '.github/workflows/broker-release.yml'

# `packages: read` because the broker takes a dev dependency on
# `@branchleft/tsconfig`, hosted on GitHub Packages, which answers 401 to an
# anonymous request even for a public package. The install uses the run's own
# `GITHUB_TOKEN` and nothing else, exactly as broker-ci.yml does.
permissions:
  contents: read
  packages: read

# One run per pull request: a newer push cancels the superseded run. A push,
# merge_group, schedule or manual run is its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and pack the broker bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: services/broker

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: services/broker/.nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'
          # No pnpm cache on a tag run, which signs. An empty `cache` is the
          # no-cache path, and '' is falsy in an expression, so the cache
          # name is the right-hand side of the `&&`, not the left.
          cache: ${{ github.ref_type != 'tag' && 'pnpm' || '' }}
          cache-dependency-path: services/broker/pnpm-lock.yaml

      # The service links render-core by a relative link: dependency and
      # needs its compiled types.
      - name: Build render-core
        working-directory: render-core
        run: pnpm install --frozen-lockfile && pnpm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      # The same tests broker-ci.yml runs, repeated because a tag can be cut
      # from a commit whose own CI run was skipped or has not finished.
      - name: Test
        run: pnpm run test:unit

      - name: Bundle
        run: pnpm run bundle

      - name: Read the package version
        id: version
        run: |
          VERSION="$(jq -r .version package.json)"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json version '${VERSION}' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Packing twice and comparing is what a pull request proves: the same
      # bundle always packs to the same bytes, so a digest pinned elsewhere
      # means something.
      - name: Pack the release tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash release/pack-release.sh dist/bundle "$VERSION" "${GITHUB_WORKSPACE}/release-out"
          bash release/pack-release.sh dist/bundle "$VERSION" "${RUNNER_TEMP}/release-again"
          cmp "${GITHUB_WORKSPACE}/release-out/broker-bundle-${VERSION}.tar.gz" "${RUNNER_TEMP}/release-again/broker-bundle-${VERSION}.tar.gz"

      - name: Upload the packed release
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: broker-release
          path: release-out
          retention-days: 1
          if-no-files-found: error

  release:
    name: Attest and publish the release
    runs-on: ubuntu-latest
    needs: build
    # A tag push only. The trigger admits no other tag, and this guard keeps a
    # pull request from ever reaching the write permissions below.
    if: github.ref_type == 'tag'
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      # Full history, so the tagged commit can be checked against main.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the packed release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: broker-release
          path: broker-release

      # A guard against a mistaken tag, run before anything is signed. It runs
      # from the tagged commit, so it is not a control: see the runbook section.
      - name: Refuse a tag that is not a proper release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/ref.json"
          if [ "$(jq -r .object.type "${RUNNER_TEMP}/ref.json")" = "tag" ]; then
            TAG_OBJECT="$(jq -r .object.sha "${RUNNER_TEMP}/ref.json")"
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT}" > "${RUNNER_TEMP}/tag.json"
          else
            echo '{}' > "${RUNNER_TEMP}/tag.json"
          fi
          # Unexercised: that GITHUB_SHA on an annotated-tag push is the commit
          # and not the tag object. If it is the tag object this check fails
          # closed (it refuses the release and signs nothing). The first live
          # tag shows which it is; the runbook is updated to match then.
          python3 -I services/broker/release/check_release_tag.py \
            --tag "${GITHUB_REF_NAME}" \
            --ref-json "${RUNNER_TEMP}/ref.json" \
            --tag-json "${RUNNER_TEMP}/tag.json" \
            --package-json services/broker/package.json \
            --expect-sha "${GITHUB_SHA}" \
            --repo-dir "${GITHUB_WORKSPACE}"
          if [ "${GITHUB_REF_NAME}" != "broker-v${BUILD_VERSION}" ]; then
            echo "::error::The build packed version ${BUILD_VERSION}, not the tag ${GITHUB_REF_NAME}. Nothing signed."
            exit 1
          fi

      - name: Check the tarball against its digest file
        env:
          BUILD_VERSION: ${{ needs.build.outputs.version }}
        working-directory: broker-release
        run: |
          ls -l
          sha256sum --check --strict "broker-bundle-${BUILD_VERSION}.tar.gz.sha256"

      - name: Attest the tarball
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: broker-release/broker-bundle-${{ needs.build.outputs.version }}.tar.gz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_VERSION: ${{ needs.build.outputs.version }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$ATTESTATION_BUNDLE" "broker-release/broker-bundle-${BUILD_VERSION}.tar.gz.sigstore.json"
          # `gh release create` fails if the release already exists, so a
          # published release is never replaced. `--verify-tag` fails if the
          # tag is not on the remote. `--latest=false` keeps this off the
          # repository's "latest release", which is not the broker's.
          gh release create "${GITHUB_REF_NAME}" \
            "broker-release/broker-bundle-${BUILD_VERSION}.tar.gz" \
            "broker-release/broker-bundle-${BUILD_VERSION}.tar.gz.sha256" \
            "broker-release/broker-bundle-${BUILD_VERSION}.tar.gz.sigstore.json" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --latest=false \
            --title "Broker ${BUILD_VERSION}" \
            --notes "Broker bundle ${BUILD_VERSION}. Verify the attestation before use: see services/broker/RUNBOOK-broker-deploy.md, section 'Release artifact and how to verify it'."
