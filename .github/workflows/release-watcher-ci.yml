name: Release watcher CI

# Unit-tests the Ghost release watcher (services/release-watcher/). Stdlib
# only, so there is no install step and no package-registry token. The
# scheduled run that opens PRs lives in release-watcher-run.yml.

on:
  push:
    branches: [main]
    paths:
      - services/release-watcher/**
      - .github/workflows/release-watcher-ci.yml
  pull_request:
    branches: [main]
    paths:
      - services/release-watcher/**
      - .github/workflows/release-watcher-ci.yml

permissions:
  contents: read

# One run per pull request: a newer push cancels the superseded run. A push,
# merge_group, schedule or manual run is its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Release watcher unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Test
        working-directory: services/release-watcher
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
