name: Speckify

# Each contract is described once, in its own spec: the broker's signed host API
# in services/broker/openapi.yaml, the provisioning API in
# services/provisioning-controller/openapi.yaml. On a pull request this works
# out the version each spec would publish as and posts it as a comment. On a
# merge to main it publishes the TypeScript client and server package generated
# from each spec to GitHub Packages, from this job and this workflow file, with
# the run's own GITHUB_TOKEN and nothing else.
#
# The check job checks Speckify out at the commit its v0.1.2 tag points at, builds
# it from its lockfile and runs it directly. The publish job uses that same
# commit's composite action, which runs `speckify publish`: it packs, attests and
# publishes the tarballs itself. The composite action at v0.1.2 writes its own
# Node version, so it no longer depends on a caller's `node-version-file`.

on:
  pull_request:
    paths:
      - speckify.yaml
      - services/broker/openapi.yaml
      - services/broker/src/generated/**
      - services/provisioning-controller/openapi.yaml
      - services/provisioning-controller/src/generated/**
      - scripts/assert-contracts-generated.py
      - .github/workflows/speckify.yml
  push:
    branches: [main]
    paths:
      - speckify.yaml
      - services/broker/openapi.yaml
      - services/broker/src/generated/**
      - services/provisioning-controller/openapi.yaml
      - services/provisioning-controller/src/generated/**
      - scripts/assert-contracts-generated.py
      - .github/workflows/speckify.yml
  # Re-runs the publish for the current main, e.g. after a registry outage.
  # Publishing is idempotent: a version the registry already holds is skipped.
  workflow_dispatch:

# One run per pull request: a newer push cancels the superseded run. A push,
# merge_group, schedule or manual run is its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Contract check and generated-code drift
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `packages: read` because the last published spec is read back from GitHub
    # Packages, which answers 401 to an anonymous request even for a public package.
    permissions:
      contents: read
      packages: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Speckify v0.1.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: branchLeft/speckify
          ref: b9be3996ac8684f44bc6ff53dbc4d5cc787816bd
          path: .speckify-tool
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .speckify-tool/.nvmrc

      - name: Build Speckify from its lockfile
        working-directory: .speckify-tool
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Speckify check
        run: node .speckify-tool/dist/cli.js check --config speckify.yaml
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate the packages into .speckify/out
        run: node .speckify-tool/dist/cli.js build --config speckify.yaml
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: The committed generated sources are what Speckify generates
        run: python3 scripts/assert-contracts-generated.py .speckify/out

  publish:
    name: Publish the generated packages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Two runs can never publish the same version at once: a second queues
    # behind the first rather than cancelling it part-way through a publish.
    concurrency:
      group: speckify-publish
      cancel-in-progress: false
    # `packages: write` is the whole of what publishing needs, and `contents`
    # stays read-only: no tag or release is created, the registry is the record.
    # `id-token` and `attestations` are the signing grants, held by this one job,
    # which packs, attests and publishes. Nothing from a pull request runs here:
    # the job is main-only.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # What the broker runs and what gets published must be the same
      # generated code: refuse to publish if the committed copy has drifted.
      # The build is the same Speckify the publish below runs.
      - name: Generate the packages into .speckify/out
        uses: branchLeft/speckify@b9be3996ac8684f44bc6ff53dbc4d5cc787816bd # v0.1.2
        with:
          command: build
          config: speckify.yaml
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: The committed generated sources are what Speckify generates
        run: python3 scripts/assert-contracts-generated.py .speckify/out

      # Every contract in speckify.yaml is published here: `speckify publish` at
      # v0.1.2 has no flag to pick one. That includes the provisioning API, so
      # each push to main publishes @branchleft/ghost-platform-provisioning-api
      # as well as the broker package. Nothing consumes that package yet, and an
      # agent cannot unpublish it. Narrowing this to the broker is a follow-up.
      #
      # `speckify publish` packs each package, attests the tarballs, checks each
      # tarball's sha-256 against the attestation and publishes those same files.
      # It skips a version the registry already holds. The package.json it
      # publishes carries `repository` and `publishConfig` because Speckify
      # writes them itself (speckify v0.1.2), so this job edits nothing.
      - name: speckify publish
        uses: branchLeft/speckify@b9be3996ac8684f44bc6ff53dbc4d5cc787816bd # v0.1.2
        with:
          command: publish
          config: speckify.yaml
          attest: 'true'
          attestation-repo: branchLeft/ghost-platform
          attestation-signer-workflow: branchLeft/ghost-platform/.github/workflows/speckify.yml
          attestation-source-ref: refs/heads/main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
