name: odask CI

# Type-checks and unit-tests the on-demand TLS ask endpoint (services/odask/).
# The real-Caddy-and-Pebble proof of its contract lives in odask-image.yml
# instead, alongside the image build it needs.

on:
  push:
    branches: [main]
  # A pull request starts this only when its diff touches something the job
  # reads: the service (render-core arrives from the registry at the version
  # its package.json pins). Push to main stays unfiltered as the backstop.
  pull_request:
    branches: [main]
    paths:
      - 'services/odask/**'
      - '.github/workflows/odask-ci.yml'

# `packages: read` because this service takes a dev dependency on
# `@branchleft/tsconfig`, which is hosted on GitHub Packages and answers 401
# to an anonymous request even for a public package.
permissions:
  contents: read
  packages: read

# One run per pull request: a newer push cancels the superseded run. A push,
# merge_group, schedule or manual run is its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: odask type check and test
    runs-on: ubuntu-latest
    # Generous bound: install, typecheck and vitest coverage on one small
    # Express service, well inside Actions' minimum billable minute either
    # way.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/odask

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: services/odask/.nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'
          cache: pnpm
          cache-dependency-path: services/odask/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run coverage
