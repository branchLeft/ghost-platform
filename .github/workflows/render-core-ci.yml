name: Render core CI

# Type-checks and tests the tenant-descriptor package (render-core/): the
# schema, its branded validated types, and the three cross-field invariants
# both reconcilers render from.
#
# No deploy job here, deliberately: render-core/ is a published library like
# infra/tenant/, not a stack — there is nothing here for a Pulumi apply to
# select, and who applies a tenant's own resources is that tenant repo's
# pipeline's decision.

on:
  push:
    branches: [main]
  # A pull request starts this only when its diff touches something the job
  # reads: the package, and infra/tenant/naming.ts, which a unit test parses to
  # check the reserved-name lists agree. Push to main stays unfiltered as the
  # backstop.
  pull_request:
    branches: [main]
    paths:
      - 'render-core/**'
      - 'infra/tenant/naming.ts'
      - '.github/workflows/render-core-ci.yml'

# `packages: read` because this package takes a dev dependency on
# `@branchleft/tsconfig`, which is hosted on GitHub Packages and answers 401 to
# an anonymous request even for a public package.
permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Render core type check, test and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: render-core

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: render-core/.nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'
          cache: pnpm
          cache-dependency-path: render-core/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test:unit

      # Fails the build below the thresholds set in vitest.config.ts (90%
      # lines/statements/functions/branches) — CLAUDE.md makes this
      # non-negotiable for an input-validation package.
      - name: Coverage (validate() and the invariant logic, >90%)
        run: pnpm run coverage
