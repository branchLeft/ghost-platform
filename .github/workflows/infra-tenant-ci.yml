name: Tenant infra CI

# Type-checks the reusable per-tenant Pulumi component (infra/tenant/).
# No `pulumi up`, no `pulumi preview`, no cloud credentials of any kind, no
# `id-token: write`.
#
# This used to say it mirrored infra-platform-ci.yml's reasoning. It no
# longer can: that workflow now applies its stack from CI (the platform owner, 2026-08-05).
# The conclusion here is unchanged, but for a reason that was always the
# stronger one and is now the only one -- `infra/tenant/` is a reusable
# *component*, not a stack. There is nothing here to apply. It is
# instantiated from the private `ghost-platform-tenants` repo, so the
# decision about who applies a tenant's resources belongs to that repo's
# pipeline, not this one, and this workflow could not hold the right
# credentials for it even if it wanted to.
#
# So: do not "bring this in line with the platform workflow" by adding a
# deploy job. There is no stack for one to select.
#
# Deliberately excludes infra/tenant/smoke-test/ -- that's a disposable,
# manually-run preview harness (see its own README.md), not part of the
# reusable component this workflow exists to protect.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/tenant

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: infra/tenant/.nvmrc
          cache: npm
          cache-dependency-path: infra/tenant/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
