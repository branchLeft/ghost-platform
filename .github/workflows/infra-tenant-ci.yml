name: Tenant infra CI

# Type-checks the reusable per-tenant Pulumi component (infra/tenant/).
# No `pulumi up`, no `pulumi preview`, no cloud credentials of any kind, no
# `id-token: write`.
#
# Do not add a deploy job here: `infra/tenant/` is a reusable *component*,
# not a stack, so there is no stack for one to select. It is instantiated
# from a tenant's own private repo, and who applies a tenant's resources is
# that repo's pipeline's decision -- this workflow could not hold the right
# credentials for it in any case.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# `packages: read` because this component takes a dev dependency on
# `@branchleft/tsconfig`, which is hosted on GitHub Packages and answers 401 to
# an anonymous request even for a public package.
permissions:
  contents: read
  packages: read

jobs:
  typecheck:
    name: Tenant type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/tenant

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: infra/tenant/.nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'
          cache: npm
          cache-dependency-path: infra/tenant/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npm run typecheck

      # Kept in this job rather than a new one so the required-status context
      # stays `Tenant type check`. The suite is pure string derivation with no
      # Pulumi engine and no credentials, and runs in well under a second.
      - name: Test
        run: npm run test:unit
