name: Demo host mail spool CI

# Runs scripts/test-demo-mail-spool.sh: the render-core spool stack on a real
# dockerd inside a privileged Docker-in-Docker stand-in for demo1, behind the
# real container-egress policy. Its sabotage run must fail.

# The paths filters list every input the job reads, and are the same for both
# events. scripts/test_demo_host_mail_spool_ci_paths.py derives the inputs and
# fails when one is outside the filter, so a new input is added here too.
on:
  push:
    branches: [main]
    paths:
      - render-core/src/**/*.ts
      - render-core/src/payments-origins.json
      - render-core/test/golden/mail-spool-compose.demo1.yml
      - render-core/package.json
      - render-core/pnpm-lock.yaml
      - render-core/tsconfig.json
      - render-core/tsconfig.build.json
      - render-core/.npmrc
      - render-core/.nvmrc
      - package.json
      - demo-host/provision/**
      - scripts/test-demo-mail-spool.sh
      - scripts/render-mail-spool-compose.mjs
      - scripts/render-mail-spool-compose.test.mjs
      - scripts/mail-spool-proof/**
      - .github/workflows/demo-host-mail-spool-ci.yml
  pull_request:
    branches: [main]
    paths:
      - render-core/src/**/*.ts
      - render-core/src/payments-origins.json
      - render-core/test/golden/mail-spool-compose.demo1.yml
      - render-core/package.json
      - render-core/pnpm-lock.yaml
      - render-core/tsconfig.json
      - render-core/tsconfig.build.json
      - render-core/.npmrc
      - render-core/.nvmrc
      - package.json
      - demo-host/provision/**
      - scripts/test-demo-mail-spool.sh
      - scripts/render-mail-spool-compose.mjs
      - scripts/render-mail-spool-compose.test.mjs
      - scripts/mail-spool-proof/**
      - .github/workflows/demo-host-mail-spool-ci.yml

# `packages: read` because render-core's dev dependency @branchleft/tsconfig is
# hosted on GitHub Packages.
permissions:
  contents: read
  packages: read

# One run per pull request: a newer push cancels the superseded run. A push,
# merge_group, schedule or manual run is its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spool-proof:
    name: mail spool proof
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: render-core/.nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'
          cache: pnpm
          cache-dependency-path: render-core/pnpm-lock.yaml

      - name: Build render-core
        working-directory: render-core
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose script renders the outcomes line for a Sweego host only
        run: node --test scripts/render-mail-spool-compose.test.mjs

      - name: Shellcheck
        run: shellcheck scripts/test-demo-mail-spool.sh

      - name: Run the spool proof
        run: ./scripts/test-demo-mail-spool.sh

      - name: Sabotage -- each break must turn the named assertion red
        run: |
          sabotage() {
            mode="$1"
            shift
            log="$(mktemp)"
            if SABOTAGE="$mode" ./scripts/test-demo-mail-spool.sh >"$log" 2>&1; then
              echo "::error::SABOTAGE=$mode stayed green"
              exit 1
            fi
            for line in "$@"; do
              grep -qF "$line" "$log" || {
                echo "::error::SABOTAGE=$mode: expected the line: $line"
                cat "$log"
                exit 1
              }
            done
          }
          sabotage open-route \
            "FAIL: the spool cannot open a connection to a host outside"
          sabotage no-spool \
            "FAIL: Ghost's SMTP path (transactional) is accepted" \
            "FAIL: Ghost's Mailgun-shaped path (bulk) is accepted" \
            "FAIL: the queue holds"
          sabotage wrong-message \
            "PASS: the queue holds both messages" \
            "FAIL: the drained messages are ["
