name: Percona image

# Builds db/percona/Dockerfile, the Percona Server 8.0.46-37 image with fixed
# operating system packages and without the telemetry agent or MySQL Shell, and
# proves it still starts and answers (db/percona/smoke_check.py). On a pull
# request or push touching those paths it builds and proves only. On push to
# `main`, or a manual run on `main`, it also pushes the image to
# ghcr.io/branchleft/percona-server tagged with the git SHA, scans the pushed
# digest, and signs it only if the scan passed. The package is private: the
# only thing a host may pin is the digest this workflow reports, and only once
# both the scan and the attest job are green.
#
# A manual run exists because the operating system packages in the image come
# from UBI, which moves with no change in this repository: a rebuild picks up
# a fix when the scan shows one, and an exemption in
# .image-scan-exemptions.json lapses 30 days after it is granted.
#
# The base image is pulled from the private mirror with the run's own token
# (IMAGE_REGISTRY below); the digest in the Dockerfile is the same either way.
# The push job requests `packages: write` only for itself, on the triggers that
# ever run it, so a pull request build never sits beside a publish credential.

on:
  push:
    branches: [main]
    paths:
      - db/percona/**
      - .image-scan-exemptions.json
      - .github/workflows/percona-image.yml
  pull_request:
    branches: [main]
    paths:
      - db/percona/**
      - .image-scan-exemptions.json
      - .github/workflows/percona-image.yml
  workflow_dispatch:

# `packages: read` pulls the base image from the private mirror. It is
# read-only and separate from the `packages: write` the push job grants itself.
permissions:
  contents: read
  packages: read

# One run per pull request: a newer push cancels the superseded run. A push,
# merge_group, schedule or manual run is its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Smoke check unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Unit tests
        run: python3 -m unittest discover -s db/percona -p 'test_*.py'

  build:
    name: Build and prove the Percona image
    runs-on: ubuntu-latest
    needs: test
    # workflow_dispatch has no path filter to gate on; it means "publish the
    # current main", so it goes straight to the push job below.
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 20
    env:
      IMAGE_REGISTRY: ghcr.io/branchleft/mirror-private2

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 on purpose: the database hosts are amd64, and the scan
      # reads the runner's own platform.
      - name: Build image
        run: |
          docker build --platform linux/amd64 \
            --build-arg IMAGE_REGISTRY \
            --file db/percona/Dockerfile \
            --tag percona-server:ci \
            db/percona

      - name: Prove the image starts and answers
        run: python3 db/percona/smoke_check.py percona-server:ci

  push:
    name: Build, prove and push the Percona image
    runs-on: ubuntu-latest
    needs: test
    # `main` for every trigger: a manual dispatch from another ref must not
    # publish an image. It waits on the unit tests, and proves the image it is
    # about to push itself, so a manual run needs no build job.
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    timeout-minutes: 20

    # Serialises pushes to the one package.
    concurrency:
      group: ghost-platform-percona-image-push
      cancel-in-progress: false

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.digest.outputs.image }}
      digest: ${{ steps.digest.outputs.digest }}

    env:
      IMAGE: ghcr.io/branchleft/percona-server
      IMAGE_TAG: ${{ github.sha }}
      IMAGE_REGISTRY: ghcr.io/branchleft/mirror-private2

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      # One login serves the pull of the base from the private mirror and the
      # push below: `packages: write` includes read.
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # There is deliberately no `latest` tag: a mutable tag is an invitation
      # to pin by it.
      - name: Build image
        run: |
          docker build --platform linux/amd64 \
            --build-arg IMAGE_REGISTRY \
            --file db/percona/Dockerfile \
            --tag "$IMAGE:$IMAGE_TAG" \
            db/percona

      # The proof the build job ran, against the exact image about to be
      # pushed, so a broken image fails before the push and not after.
      - name: Prove the image starts and answers
        run: python3 db/percona/smoke_check.py "$IMAGE:$IMAGE_TAG"

      - name: Push
        run: docker push "$IMAGE:$IMAGE_TAG"

      # The digest is read from the image store after the push, never
      # assembled from the tag or the commit. A missing or malformed digest
      # fails the job, so no run ends green without a reference to pin.
      - name: Read and verify the pushed digest
        id: digest
        run: |
          reference="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:$IMAGE_TAG" | grep "^$IMAGE@" | head -n 1)"
          digest="${reference#*@}"
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::no well-formed sha256 digest for $IMAGE:$IMAGE_TAG (got: '$reference')"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"

      - name: Write outcome to job summary
        if: always()
        env:
          PINNED_IMAGE: ${{ steps.digest.outputs.image }}
        run: |
          {
            echo '## Percona image push'
            echo
            echo "Commit: \`$IMAGE_TAG\`"
            echo "Pin this: \`${PINNED_IMAGE:-NO DIGEST: push did not complete}\`"
            echo "The scan and attest jobs follow: use this digest only once both are green."
          } >> "$GITHUB_STEP_SUMMARY"

  # The pushed digest, scanned by the shared image-scan workflow before anything
  # signs it. It fails the run on any critical or high finding no exemption
  # covers; the threshold is fixed in that workflow and cannot be lowered here.
  # A finding with no available fix is covered only by an entry in
  # .image-scan-exemptions.json, which CODEOWNERS routes to the admin team; a
  # finding with a fix blocks until the image is rebuilt on the fixed package.
  scan:
    name: Scan the pushed Percona image
    needs: push
    permissions:
      contents: read
      packages: read
    uses: branchLeft/github-workflows/.github/workflows/image-scan.yml@77506b6d4603ef432bbdec734139fec91e5bea47 # v1.1.0
    with:
      image: ${{ needs.push.outputs.image }}

  # Signs the digest with a keyless GitHub artifact attestation, then verifies
  # it with the identity below and checks that a wrong identity is rejected. It
  # needs the scan, so an image that fails the scan is never signed. The
  # identity is a literal on purpose: read from this run's own
  # `github.workflow_ref` it would agree with itself and prove nothing. The
  # same value, with the source ref `refs/heads/main`, is what a host passes to
  # scripts/verify-image-attestation.sh. `id-token: write` mints the keyless
  # signing certificate and `attestations: write` stores the attestation; the
  # registry login needs `packages: write` for the stored bundle.
  attest:
    name: Attest and verify the scanned Percona image
    needs: [push, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/branchleft/percona-server
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest and verify the pushed image
        uses: branchLeft/github-workflows/.github/actions/attest-and-verify-image@77506b6d4603ef432bbdec734139fec91e5bea47 # v1.1.0
        with:
          image: ${{ env.IMAGE }}
          digest: ${{ needs.push.outputs.digest }}
          signer-workflow: branchLeft/ghost-platform/.github/workflows/percona-image.yml
          repo: branchLeft/ghost-platform
