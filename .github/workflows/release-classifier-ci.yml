name: Release classifier CI

# Tests the Ghost release reversibility classifier
# (services/release-classifier/). It installs one exact dependency, acorn, from
# the public npm registry with its lockfile, and runs no install scripts.

on:
  push:
    branches: [main]
    paths:
      - services/release-classifier/**
      - .github/workflows/release-classifier-ci.yml
  pull_request:
    branches: [main]
    paths:
      - services/release-classifier/**
      - .github/workflows/release-classifier-ci.yml

permissions:
  contents: read

# One run per pull request: a newer push cancels the superseded run. A push,
# merge_group, schedule or manual run is its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Release classifier test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/release-classifier

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: services/release-classifier/.nvmrc

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test
        run: pnpm test
