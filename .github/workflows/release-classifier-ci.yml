name: Release classifier CI

# Tests the Ghost release reversibility classifier
# (services/release-classifier/). It installs one exact dependency, acorn, from
# the public npm registry with its lockfile, and runs no install scripts.

on:
  push:
    branches: [main]
    paths:
      - services/release-classifier/**
      - .github/workflows/release-classifier-ci.yml
  pull_request:
    branches: [main]
    paths:
      - services/release-classifier/**
      - .github/workflows/release-classifier-ci.yml

permissions:
  contents: read

jobs:
  test:
    name: Release classifier test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/release-classifier

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: services/release-classifier/.nvmrc

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test
        run: pnpm test
