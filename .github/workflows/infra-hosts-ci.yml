name: Hosts stack CI

# Type-checks and unit-tests infra/hosts/, the Pulumi program for the
# estate's application and database hosts. No `pulumi preview` and no cloud
# credentials of any kind run here: the program needs the estate's hcloud
# token and the stack passphrase, both of which are owner-held, so plan and
# apply happen through the stack's own gated path rather than on every push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# `packages: read` because @branchleft/hetzner-host and
# @branchleft/tsconfig are both hosted on GitHub Packages, which answers 401
# to an anonymous request even for a public package.
permissions:
  contents: read
  packages: read

jobs:
  typecheck:
    name: Hosts stack
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/hosts

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: infra/hosts/.nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'
          cache: npm
          cache-dependency-path: infra/hosts/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:unit
