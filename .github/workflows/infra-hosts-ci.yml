name: Hosts stack CI

# The full merge-is-deploy path for infra/hosts/, the Pulumi program for the
# estate's application and database hosts. Pull requests get typecheck and
# unit tests only — no cloud credentials of any kind run against PR code. A
# push to main runs the same checks, then a plan job whose `pulumi preview`
# lands in the job summary, then an apply job paused by the `production`
# environment's gate (a required reviewer, or the branchleft-reviewer App's
# custom deployment protection rule) until a human has read that plan. The
# delete guard catches the destruction class mechanically; the reviewer
# catches the plan that is green and still wrong.

# The apply is routed by the spend gate. A plan whose every change is a free
# resource type runs its apply in `production-free`, which only the reviewer
# App's rule answers; any other plan, and any plan the gate could not read,
# stays in `production` with the owner as reviewer. Only the exact string
# `production-free` selects the free environment, and the apply re-gates the
# plan it is about to apply (infra/scripts/choose-apply-environment.py,
# infra/scripts/test_apply_environment_routing.py).

# The path list is the program's full dependency surface, not a guess at
# likely edits: infra/hosts/index.ts imports only from other files under
# infra/hosts/ and from @branchleft/hetzner-host, an external package whose
# version is pinned in infra/hosts/package.json and package-lock.json — both
# already inside the filter. The delete guard it shells out to is the one
# file this program reads from outside its own directory.
on:
  push:
    branches: [main]
    paths:
      - 'infra/hosts/**'
      - 'infra/scripts/assert-no-hetzner-deletes.py'
      - 'infra/scripts/assert-environment-gated.py'
      - 'infra/scripts/test_assert_environment_gated.py'
      - 'infra/scripts/choose-apply-environment.py'
      - 'infra/scripts/test_choose_apply_environment.py'
      - 'infra/scripts/test_apply_environment_routing.py'
      - 'infra/scripts/fixtures/choose-apply-environment/**'
      - '.github/workflows/infra-hosts-ci.yml'
      - '.github/workflows/infra-demo-host-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/hosts/**'
      - 'infra/scripts/assert-no-hetzner-deletes.py'
      - 'infra/scripts/assert-environment-gated.py'
      - 'infra/scripts/test_assert_environment_gated.py'
      - 'infra/scripts/choose-apply-environment.py'
      - 'infra/scripts/test_choose_apply_environment.py'
      - 'infra/scripts/test_apply_environment_routing.py'
      - 'infra/scripts/fixtures/choose-apply-environment/**'
      - '.github/workflows/infra-hosts-ci.yml'
      - '.github/workflows/infra-demo-host-ci.yml'

# `packages: read` because @branchleft/hetzner-host and
# @branchleft/tsconfig are both hosted on GitHub Packages, which answers 401
# to an anonymous request even for a public package.
permissions:
  contents: read
  packages: read

jobs:
  typecheck:
    name: Hosts stack
    runs-on: ubuntu-latest
    # Observed 0.25-0.37min over the last 20 successful runs (p95 0.35min).
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/hosts

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: infra/hosts/.nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'
          cache: npm
          cache-dependency-path: infra/hosts/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npm run typecheck

      - name: Environment-gate guard tests
        working-directory: .
        run: |
          python3 infra/scripts/assert-environment-gated.py --self-test
          python3 infra/scripts/test_assert_environment_gated.py

      - name: Apply-environment routing tests
        working-directory: .
        run: |
          python3 infra/scripts/test_choose_apply_environment.py
          python3 infra/scripts/test_apply_environment_routing.py

      - name: Test
        run: npm run test:unit

  plan:
    name: Plan (hosts, pulumi preview)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [typecheck]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      has_changes: ${{ steps.noop.outputs.has_changes }}
      # Which environment the paired apply runs in. Unset or anything but
      # `production-free` is read as `production`.
      apply_environment: ${{ steps.route.outputs.environment }}

    defaults:
      run:
        working-directory: infra/hosts

    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PASSPHRASE_PLATFORM_HOSTS }}
      PULUMI_SALT_PLATFORM_HOSTS: ${{ secrets.PULUMI_SALT_PLATFORM_HOSTS }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN_ESTATE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_ACCESS_KEY }}
      AWS_REGION: hel1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: infra/hosts/.nvmrc
          cache: npm
          cache-dependency-path: infra/hosts/package-lock.json
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      - name: Verify the deploy secrets are present
        run: |
          fail=0
          [ -n "$PULUMI_CONFIG_PASSPHRASE" ] || { echo "::error::PULUMI_PASSPHRASE_PLATFORM_HOSTS is empty or unset" ; fail=1; }
          [ -n "$HCLOUD_TOKEN" ] || { echo "::error::HCLOUD_TOKEN_ESTATE is empty or unset" ; fail=1; }
          [ -n "$AWS_ACCESS_KEY_ID" ] || { echo "::error::HETZNER_S3_ACCESS_KEY_ID is empty or unset" ; fail=1; }
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || { echo "::error::HETZNER_S3_SECRET_ACCESS_KEY is empty or unset" ; fail=1; }
          case "$PULUMI_SALT_PLATFORM_HOSTS" in
            v1:*) ;;
            *) echo "::error::PULUMI_SALT_PLATFORM_HOSTS is empty or does not start with 'v1:'" ; fail=1;;
          esac
          exit "$fail"

      - name: Restore the stack's encryption salt
        run: |
          printf '\nencryptionsalt: %s\n' "$PULUMI_SALT_PLATFORM_HOSTS" >> Pulumi.production.yaml

      - name: Preview the plan
        id: preview
        run: pulumi preview --stack production --json > preview.json

      # The update plan is saved by a second preview, apart from the one above,
      # so the preview.json the delete guard reads and the owner reviews is
      # produced exactly as before. Best effort: a failure leaves no plan file,
      # which the `noop` step reads as "changes". The plan file can hold resource
      # inputs and secrets-provider ciphertext, and is never uploaded, printed or
      # summarised.
      - name: Save the update plan for the no-change check
        continue-on-error: true
        run: pulumi preview --stack production --save-plan preview-plan.json > /dev/null

      - name: Refuse a plan that destroys the estate
        id: deletes
        run: |
          python3 ../scripts/assert-no-hetzner-deletes.py --self-test
          python3 ../scripts/assert-no-hetzner-deletes.py --verify-coverage .

          if ! python3 ../scripts/assert-no-hetzner-deletes.py preview.json; then
            echo "--- full plan follows ---"
            python3 -m json.tool preview.json
            exit 1
          fi

      # Routing. These three steps pick the environment the paired apply runs
      # in and never fail the plan: any trouble here leaves the output unset,
      # which the apply reads as `production`, where the owner approves. The
      # gate runs only when every step before it succeeded; a preview that
      # failed gives it nothing to read.
      - name: Decide whether the plan could cost money
        id: spend
        continue-on-error: true
        uses: branchLeft/github-workflows/.github/actions/spend-gate@10b735392df0f32742c0f322b666c2c7249b782c # v1.0.12
        with:
          preview-json: preview.json
          working-directory: infra/hosts

      # Without this, a free plan would be routed to an environment that does
      # not exist yet or has lost its rule. Only the reviewer App's enabled
      # rule counts (integration id 5090756); any failure to read it counts as
      # none. The apply job checks again before it touches a credential.
      - name: Check the free apply environment is gated
        id: free_ready
        if: always()
        continue-on-error: true
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          custom=0
          if out=$(gh api "repos/${GITHUB_REPOSITORY}/environments/production-free/deployment_protection_rules" \
            --jq '[.custom_deployment_protection_rules[]? | select(.enabled == true and .app.id == 5090756)] | length' 2>/dev/null); then
            custom="${out}"
          fi
          case "${custom}" in '' | *[!0-9]*) custom=0 ;; esac
          ready=false
          if [ "${custom}" -gt 0 ]; then ready=true; fi
          echo "ready=${ready}" >> "$GITHUB_OUTPUT"

      - name: Choose the apply environment
        id: route
        if: always()
        continue-on-error: true
        working-directory: .
        env:
          SPEND_VERDICT: ${{ steps.spend.outputs.verdict }}
          PREVIEW_OUTCOME: ${{ steps.preview.outcome }}
          DELETE_GUARD_OUTCOME: ${{ steps.deletes.outcome }}
          FREE_ENVIRONMENT_READY: ${{ steps.free_ready.outputs.ready }}
        run: |
          python3 -I infra/scripts/choose-apply-environment.py --owner-environment production \
            --github-output "$GITHUB_OUTPUT" --github-summary "$GITHUB_STEP_SUMMARY"

      # Fails closed: `has_changes` is `false` only for a plan that parsed and
      # changes nothing, outputs included; the action's README says what else
      # counts. It also puts the verdict on the first line of the job summary.
      - name: Decide whether the plan changes anything
        id: noop
        if: always()
        uses: branchLeft/github-workflows/.github/actions/plan-has-changes@2cfa57c06773bc70172022be12a85ce4ae5bcb6b # v1.0.10
        with:
          preview-json: preview.json
          plan-file: preview-plan.json
          working-directory: infra/hosts

      - name: Write the plan to the job summary
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo '## Hosts stack plan — read before approving the apply'
            echo
            echo "Commit: \`${COMMIT_SHA}\`"
            echo
            echo '```json'
            python3 -m json.tool preview.json 2>/dev/null \
              || echo '(no plan captured — the run failed before preview)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply (hosts, pulumi up)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [plan]
    # A plan that changes nothing skips this job, so its environment is never
    # asked for an approval. Only the string 'false' skips it: an unset output
    # asks, and a plan the decision step could not understand outputs 'true'.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.plan.outputs.has_changes != 'false'

    # `production`, where the owner approves, or `production-free` when the
    # plan job's spend gate said every change is free. Only the exact string
    # `production-free` selects the second; anything else, unset included, is
    # `production`. The same expression is the job's APPLY_ENVIRONMENT below,
    # which the steps read (pinned equal by test_apply_environment_routing.py).
    environment: ${{ needs.plan.outputs.apply_environment == 'production-free' && 'production-free' || 'production' }}

    concurrency:
      group: pulumi-platform-hosts-deploy
      cancel-in-progress: false

    defaults:
      run:
        working-directory: infra/hosts

    env:
      APPLY_ENVIRONMENT: ${{ needs.plan.outputs.apply_environment == 'production-free' && 'production-free' || 'production' }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PASSPHRASE_PLATFORM_HOSTS }}
      PULUMI_SALT_PLATFORM_HOSTS: ${{ secrets.PULUMI_SALT_PLATFORM_HOSTS }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN_ESTATE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_ACCESS_KEY }}
      AWS_REGION: hel1

    steps:
      # Checkout first: the guard script lives in the repo. Checkout reads no
      # environment secret, so the gate still precedes every credentialed step.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checks the environment this job is actually in (APPLY_ENVIRONMENT) and
      # refuses a name that is neither of the two.
      - name: Refuse to apply through an ungated environment
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          case "${APPLY_ENVIRONMENT}" in
            production | production-free) ;;
            *)
              echo "::error::the apply environment is neither production nor production-free." >&2
              exit 1
              ;;
          esac
          env_json=$(mktemp)
          rules_json=$(mktemp)
          # Two reads, both required: a custom deployment protection rule
          # (the branchleft-reviewer App) is NOT listed in protection_rules,
          # only in deployment_protection_rules. Any API error fails closed.
          gh api "repos/${GITHUB_REPOSITORY}/environments/${APPLY_ENVIRONMENT}" > "$env_json" \
            || { echo "::error::could not read the ${APPLY_ENVIRONMENT} environment" >&2; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/environments/${APPLY_ENVIRONMENT}/deployment_protection_rules" > "$rules_json" \
            || { echo "::error::could not read the ${APPLY_ENVIRONMENT} deployment protection rules" >&2; exit 1; }
          python3 infra/scripts/assert-environment-gated.py --self-test > /dev/null
          if ! python3 infra/scripts/assert-environment-gated.py "$env_json" "$rules_json"; then
            echo "::error::the ${APPLY_ENVIRONMENT} environment has neither a required-reviewer rule nor an enabled branchleft-reviewer deployment protection rule -- the plan-approval gate is not real. Configure it in repo settings before any CI apply." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: infra/hosts/.nvmrc
          cache: npm
          cache-dependency-path: infra/hosts/package-lock.json
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      - name: Verify the deploy secrets are present
        run: |
          fail=0
          [ -n "$PULUMI_CONFIG_PASSPHRASE" ] || { echo "::error::PULUMI_PASSPHRASE_PLATFORM_HOSTS is empty or unset" ; fail=1; }
          [ -n "$HCLOUD_TOKEN" ] || { echo "::error::HCLOUD_TOKEN_ESTATE is empty or unset" ; fail=1; }
          [ -n "$AWS_ACCESS_KEY_ID" ] || { echo "::error::HETZNER_S3_ACCESS_KEY_ID is empty or unset" ; fail=1; }
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || { echo "::error::HETZNER_S3_SECRET_ACCESS_KEY is empty or unset" ; fail=1; }
          case "$PULUMI_SALT_PLATFORM_HOSTS" in
            v1:*) ;;
            *) echo "::error::PULUMI_SALT_PLATFORM_HOSTS is empty or does not start with 'v1:'" ; fail=1;;
          esac
          exit "$fail"

      - name: Restore the stack's encryption salt
        run: |
          printf '\nencryptionsalt: %s\n' "$PULUMI_SALT_PLATFORM_HOSTS" >> Pulumi.production.yaml

      - name: Preview the plan
        run: pulumi preview --stack production --json > preview.json

      - name: Refuse to apply a plan that destroys the estate
        run: |
          python3 ../scripts/assert-no-hetzner-deletes.py --self-test
          python3 ../scripts/assert-no-hetzner-deletes.py --verify-coverage .

          if ! python3 ../scripts/assert-no-hetzner-deletes.py preview.json; then
            echo "--- full plan follows ---"
            python3 -m json.tool preview.json
            exit 1
          fi

      # The route was chosen from the plan job's preview; this is the preview
      # this apply acts on. In `production-free` nothing but a FREE verdict on
      # it may reach `pulumi up`, so a plan that turned paid between the two
      # fails here. In `production` the owner has read the plan and the verdict
      # is advisory: a gate that could not run never blocks the owner's path.
      - name: Decide whether the plan could cost money
        id: spend
        continue-on-error: true
        uses: branchLeft/github-workflows/.github/actions/spend-gate@10b735392df0f32742c0f322b666c2c7249b782c # v1.0.12
        with:
          preview-json: preview.json
          working-directory: infra/hosts

      - name: Refuse a plan that could cost money on the free environment
        env:
          SPEND_VERDICT: ${{ steps.spend.outputs.verdict }}
        run: |
          case "${APPLY_ENVIRONMENT}" in
            production) exit 0 ;;
            production-free) ;;
            *)
              echo "::error::the apply environment is neither production nor production-free." >&2
              exit 1
              ;;
          esac
          if [ "${SPEND_VERDICT}" != "FREE" ]; then
            echo "::error::this apply is in production-free, which is for free plans only, and the spend gate did not say FREE for the plan it is about to apply. Nothing was applied. Re-run all jobs of the run, not only the failed one: the plan is read again and a paid plan is routed to production, where the owner approves." >&2
            echo "--- full plan follows ---"
            python3 -m json.tool preview.json
            exit 1
          fi

      - name: Apply
        run: pulumi up --stack production --yes

      - name: Write outcome to job summary
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo '## Hosts stack deploy'
            echo
            echo "Commit: \`${COMMIT_SHA}\`"
            echo
            echo '### Plan this run applied'
            echo
            echo '```json'
            python3 -m json.tool preview.json 2>/dev/null \
              || echo '(no plan captured — the run failed before preview)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
