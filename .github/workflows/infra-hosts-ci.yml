name: Hosts stack CI

# The full merge-is-deploy path for infra/hosts/, the Pulumi program for the
# estate's application and database hosts. Pull requests get typecheck and
# unit tests only — no cloud credentials of any kind run against PR code. A
# push to main runs the same checks, then a plan job whose `pulumi preview`
# lands in the job summary, then an apply job paused by the `production`
# environment's required-reviewer rule until a human has read that plan. The
# delete guard catches the destruction class mechanically; the reviewer
# catches the plan that is green and still wrong.

# The path list is the program's full dependency surface, not a guess at
# likely edits: infra/hosts/index.ts imports only from other files under
# infra/hosts/ and from @branchleft/hetzner-host, an external package whose
# version is pinned in infra/hosts/package.json and package-lock.json — both
# already inside the filter. The delete guard it shells out to is the one
# file this program reads from outside its own directory.
on:
  push:
    branches: [main]
    paths:
      - 'infra/hosts/**'
      - 'infra/scripts/assert-no-hetzner-deletes.py'
      - '.github/workflows/infra-hosts-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/hosts/**'
      - 'infra/scripts/assert-no-hetzner-deletes.py'
      - '.github/workflows/infra-hosts-ci.yml'

# `packages: read` because @branchleft/hetzner-host and
# @branchleft/tsconfig are both hosted on GitHub Packages, which answers 401
# to an anonymous request even for a public package.
permissions:
  contents: read
  packages: read

jobs:
  typecheck:
    name: Hosts stack
    runs-on: ubuntu-latest
    # Observed 0.25-0.37min over the last 20 successful runs (p95 0.35min).
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/hosts

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: infra/hosts/.nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'
          cache: npm
          cache-dependency-path: infra/hosts/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:unit

  plan:
    name: Plan (hosts, pulumi preview)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [typecheck]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: infra/hosts

    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PASSPHRASE_PLATFORM_HOSTS }}
      PULUMI_SALT_PLATFORM_HOSTS: ${{ secrets.PULUMI_SALT_PLATFORM_HOSTS }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN_ESTATE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_ACCESS_KEY }}
      AWS_REGION: hel1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: infra/hosts/.nvmrc
          cache: npm
          cache-dependency-path: infra/hosts/package-lock.json
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      - name: Verify the deploy secrets are present
        run: |
          fail=0
          [ -n "$PULUMI_CONFIG_PASSPHRASE" ] || { echo "::error::PULUMI_PASSPHRASE_PLATFORM_HOSTS is empty or unset" ; fail=1; }
          [ -n "$HCLOUD_TOKEN" ] || { echo "::error::HCLOUD_TOKEN_ESTATE is empty or unset" ; fail=1; }
          [ -n "$AWS_ACCESS_KEY_ID" ] || { echo "::error::HETZNER_S3_ACCESS_KEY_ID is empty or unset" ; fail=1; }
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || { echo "::error::HETZNER_S3_SECRET_ACCESS_KEY is empty or unset" ; fail=1; }
          case "$PULUMI_SALT_PLATFORM_HOSTS" in
            v1:*) ;;
            *) echo "::error::PULUMI_SALT_PLATFORM_HOSTS is empty or does not start with 'v1:'" ; fail=1;;
          esac
          exit "$fail"

      - name: Restore the stack's encryption salt
        run: |
          printf '\nencryptionsalt: %s\n' "$PULUMI_SALT_PLATFORM_HOSTS" >> Pulumi.production.yaml

      - name: Preview the plan
        run: pulumi preview --stack production --json > preview.json

      - name: Refuse a plan that destroys the estate
        run: |
          python3 ../scripts/assert-no-hetzner-deletes.py --self-test
          python3 ../scripts/assert-no-hetzner-deletes.py --verify-coverage .

          if ! python3 ../scripts/assert-no-hetzner-deletes.py preview.json; then
            echo "--- full plan follows ---"
            python3 -m json.tool preview.json
            exit 1
          fi

      - name: Write the plan to the job summary
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo '## Hosts stack plan — read before approving the apply'
            echo
            echo "Commit: \`${COMMIT_SHA}\`"
            echo
            echo '```json'
            python3 -m json.tool preview.json 2>/dev/null \
              || echo '(no plan captured — the run failed before preview)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply (hosts, pulumi up)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [plan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment: production

    concurrency:
      group: pulumi-platform-hosts-deploy
      cancel-in-progress: false

    defaults:
      run:
        working-directory: infra/hosts

    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PASSPHRASE_PLATFORM_HOSTS }}
      PULUMI_SALT_PLATFORM_HOSTS: ${{ secrets.PULUMI_SALT_PLATFORM_HOSTS }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN_ESTATE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_ACCESS_KEY }}
      AWS_REGION: hel1

    steps:
      - name: Refuse to apply through an ungated environment
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewers=$(gh api "repos/${GITHUB_REPOSITORY}/environments/production" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')
          if [ "${reviewers:-0}" -eq 0 ]; then
            echo "::error::the production environment has no required-reviewer rule -- the plan-approval gate is not real. Configure it in repo settings before any CI apply." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: infra/hosts/.nvmrc
          cache: npm
          cache-dependency-path: infra/hosts/package-lock.json
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      - name: Verify the deploy secrets are present
        run: |
          fail=0
          [ -n "$PULUMI_CONFIG_PASSPHRASE" ] || { echo "::error::PULUMI_PASSPHRASE_PLATFORM_HOSTS is empty or unset" ; fail=1; }
          [ -n "$HCLOUD_TOKEN" ] || { echo "::error::HCLOUD_TOKEN_ESTATE is empty or unset" ; fail=1; }
          [ -n "$AWS_ACCESS_KEY_ID" ] || { echo "::error::HETZNER_S3_ACCESS_KEY_ID is empty or unset" ; fail=1; }
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || { echo "::error::HETZNER_S3_SECRET_ACCESS_KEY is empty or unset" ; fail=1; }
          case "$PULUMI_SALT_PLATFORM_HOSTS" in
            v1:*) ;;
            *) echo "::error::PULUMI_SALT_PLATFORM_HOSTS is empty or does not start with 'v1:'" ; fail=1;;
          esac
          exit "$fail"

      - name: Restore the stack's encryption salt
        run: |
          printf '\nencryptionsalt: %s\n' "$PULUMI_SALT_PLATFORM_HOSTS" >> Pulumi.production.yaml

      - name: Preview the plan
        run: pulumi preview --stack production --json > preview.json

      - name: Refuse to apply a plan that destroys the estate
        run: |
          python3 ../scripts/assert-no-hetzner-deletes.py --self-test
          python3 ../scripts/assert-no-hetzner-deletes.py --verify-coverage .

          if ! python3 ../scripts/assert-no-hetzner-deletes.py preview.json; then
            echo "--- full plan follows ---"
            python3 -m json.tool preview.json
            exit 1
          fi

      - name: Apply
        run: pulumi up --stack production --yes

      - name: Write outcome to job summary
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo '## Hosts stack deploy'
            echo
            echo "Commit: \`${COMMIT_SHA}\`"
            echo
            echo '### Plan this run applied'
            echo
            echo '```json'
            python3 -m json.tool preview.json 2>/dev/null \
              || echo '(no plan captured — the run failed before preview)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
