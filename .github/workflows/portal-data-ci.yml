name: Portal data layer CI

# Type-checks and tests the portal's storage layer (portal/data/) against a
# real PostgreSQL, on each server major version the provisioning command
# supports. The isolation guarantee is a property of the database's row-level
# policies together with the code that binds the tenant, so a mock proves
# nothing about it. The provisioning command builds every test database and
# checks it against a closed manifest, including pg_hba, so the server runs
# with a mounted pg_hba.conf that lets each test login reach its own database
# alone. A missing PORTAL_TEST_DATABASE_URL fails the suite rather than
# skipping it. See ghost-platform-docs/19-try-it-now-design/08-portal.html
# sections 01 and 10b.

on:
  push:
    branches: [main]
    paths:
      - 'portal/data/**'
      - '.github/workflows/portal-data-ci.yml'
  pull_request:
    branches: [main]

# `packages: read` because this package takes a dev dependency on
# `@branchleft/tsconfig`, which is hosted on GitHub Packages and answers 401
# to an anonymous request even for a public package.
permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Portal data type check and test (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: '14'
            image: postgres:14@sha256:ceef4a62198b562d6fe3e51be67362f72a0abf0aaa255f54f0c0e55be9768ed2
          - postgres: '17'
            image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    defaults:
      run:
        working-directory: portal/data
    env:
      PORTAL_TEST_DATABASE_URL: postgres://postgres:ci-only-throwaway@127.0.0.1:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Started here rather than as a service container, which cannot mount a
      # file from the checkout. The file is writable by the server's own user
      # because the hba tests rewrite it through COPY and restore it.
      - name: Start PostgreSQL ${{ matrix.postgres }} with the test pg_hba.conf
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          install -m 0666 test/pg_hba.ci.conf "$RUNNER_TEMP/pg_hba.conf"
          sleep 1
          docker run -d --rm --name portal-data-pg -p 5432:5432 \
            -e POSTGRES_PASSWORD=ci-only-throwaway \
            -v "$RUNNER_TEMP/pg_hba.conf:/etc/postgresql/pg_hba.conf" \
            "$IMAGE" -c hba_file=/etc/postgresql/pg_hba.conf
          for attempt in $(seq 1 60); do
            if docker exec portal-data-pg pg_isready -U postgres -h 127.0.0.1 >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs portal-data-pg
          exit 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: portal/data/.nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'
          cache: npm
          cache-dependency-path: portal/data/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npm run typecheck

      # The committed migrations must be what the schema generates: a schema
      # edit with no migration, or a migration edited by hand, leaves a diff.
      - name: Migrations match the schema
        run: |
          npx drizzle-kit generate
          npx drizzle-kit generate --config drizzle.test.config.ts
          git diff --exit-code -- . ':(exclude)package-lock.json'
          test -z "$(git ls-files --others --exclude-standard -- .)"

      - name: Build
        run: npm run build

      # A tenant table with no row-level policy fails here, outside the test
      # suite, as well as when migrations are applied.
      - name: Every tenant table is isolated
        run: npm run check:isolation

      - name: Test
        run: npm run coverage
