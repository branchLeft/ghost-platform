name: Portal data layer CI

# Type-checks and tests the portal's storage layer (portal/data/) against a
# real PostgreSQL service container. The isolation guarantee is a property of
# the database's row-level security together with the code that binds the
# tenant, so a mock proves nothing about it: the suite creates a database per
# test file, applies the migrations as the schema owner, and connects as
# logins that are members of one portal role each. A missing
# PORTAL_TEST_DATABASE_URL fails the suite rather than skipping it.
# See ghost-platform-docs/19-try-it-now-design/08-portal.html sections 01 and
# 10b.

on:
  push:
    branches: [main]
    paths:
      - 'portal/data/**'
      - '.github/workflows/portal-data-ci.yml'
  pull_request:
    branches: [main]

# `packages: read` because this package takes a dev dependency on
# `@branchleft/tsconfig`, which is hosted on GitHub Packages and answers 401
# to an anonymous request even for a public package.
permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Portal data type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portal/data
    services:
      postgres:
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_PASSWORD: ci-only-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PORTAL_TEST_DATABASE_URL: postgres://postgres:ci-only-throwaway@127.0.0.1:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: portal/data/.nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'
          cache: npm
          cache-dependency-path: portal/data/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run coverage
