name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.mts'
      - '**/*.cts'
      - '**/*.vue'
      - '**/*.html'
      - '.github/workflows/codeql.yml'
  # A pull request starts this only when its diff touches a file the
  # javascript-typescript extractor reads, so a documentation-only or YAML-only
  # pull request does not take a runner slot for an analysis whose input did not
  # change. A push to main starts it on the same paths; the weekly schedule is
  # unfiltered and analyses the whole tree.
  pull_request:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.mts'
      - '**/*.cts'
      - '**/*.vue'
      - '**/*.html'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '30 1 * * 0'

# One run per pull request: a newer push cancels the superseded run. A push,
# merge_group, schedule or manual run is its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Observed 0.78-1.55min over the last 20 successful runs (p95 1.42min).
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: '/language:${{ matrix.language }}'
