name: Repo tooling CI

# Prettier, ESLint and the committed-secret guard over the whole tree, from the
# repo root. The guard lives here rather than in a per-project workflow
# because it scans every `Pulumi.<stack>.yaml` in the tree, and this is the
# one job whose scope is the repository.
#
# The four pnpm projects here each type-check and test themselves, but nothing
# ran the root `format:check` or `lint:check` — they existed only as pre-commit
# hooks, which are opt-in per clone and skipped by `--no-verify`. Formatting is
# also the one check whose scope can shrink silently: the ignore set is spread
# across `.gitignore`, `.prettierignore` and the shared set, and a change to any
# of them still exits 0 while checking less.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# `packages: read` because the root tooling install pulls
# `@branchleft/prettier-config` from GitHub Packages, which answers 401 to an
# anonymous request even for a public package.
permissions:
  contents: read
  packages: read

# One run per pull request: a newer push cancels the superseded run. A push,
# merge_group, schedule or manual run is its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format-and-lint:
    name: Format and lint
    runs-on: ubuntu-latest
    # Observed 0.28-5.37min over the last 20 successful runs (p95 0.38min) --
    # one outlier at 5.37min, so timeout is set well above that, not the p95.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Pinned rather than inherited from the runner image. Every Python check
      # below is `python3 -m unittest discover`, which reports success for a
      # module it could not import -- so a syntax feature the runner's default
      # interpreter happens to support, and a host's does not, silently drops
      # whole test classes instead of failing. The version has to be a stated
      # input for that to be caught here rather than in production.
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint:check

      # `format:check` above only proves today's committed bytes happen to
      # match Prettier's output. This is a different property: it proves a
      # committed runbook doesn't carry an unsubstituted placeholder or a
      # stale hardcoded host literal in a copy-pasteable command.
      - name: Root guard tests
        run: pnpm test

      # The pin-drift check for the self-hosted CDN bundles (widgets/pins.json
      # vs widgets/dist/) -- a supply-chain integrity control, so its sabotage
      # case runs on every push rather than only when someone remembers to run
      # it by hand. No package.json of its own: only node:test and node:crypto,
      # already satisfied by the Setup Node step above.
      - name: Widget pin verification tests
        run: node --test --experimental-test-coverage widgets/verify-pins.test.mjs

      # The CSP script-hash derivation tool -- the DETERMINISM case proves a
      # drifted theme script would no longer match a pinned golden hash.
      # Only node:test and node:crypto, like the widget pin check above; the
      # live browser proof (csp/proof/) needs Docker and a Chromium
      # download, so it stays out of CI, like widgets/proof/.
      - name: CSP script-hash derivation tests
        run: node --test --experimental-test-coverage csp/derive/derive-script-hashes.test.mjs

      # The Stripe checkout proof's pieces that need no Docker or browser: the
      # fake Stripe API (it must refuse non-test keys and cards), the paid-site
      # setup's live-key refusal, and the payment-origin derivation. node:test
      # and node built-ins only.
      - name: CSP payments tests
        run: node --test csp/derive/derive-payment-origins.test.mjs csp/proof/*.test.mjs

      # The bundled themes and fonts (themes/README.md): the outside-origin
      # scanner, the licence manifest and the bundle verifier, each with its red
      # cases. The fetch itself needs the network and runs in the image build.
      # Only node:test and node built-ins, no install.
      - name: Bundled themes and fonts tests
        run: node --test themes/*.test.mjs

      # The CSP gates' verdict logic. Needs render-core built, so build it
      # first. Their live-browser run (csp/gate/csp-regression-gate.sh) needs
      # Docker and Chromium and stays out of CI, like csp/proof/.
      - name: CSP gate tests and sabotage proof
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd render-core && pnpm install --frozen-lockfile --ignore-scripts && pnpm run build)
          node --test csp/gate/*.test.mjs
          ./csp/gate/prove-gates.sh

      # The checkout gate's runner (csp/gate/csp-checkout-gate.py) and its real
      # Stripe test-mode rules (csp/gate/real_test_mode.py): every program the
      # runner starts is a recording fake, so no Docker or browser. Both test
      # files also mutate the real source and require red.
      - name: CSP checkout gate runner tests
        run: python3 -m unittest discover -s csp/gate -p 'test_*.py' -v

      # Self-test first: a matcher that has quietly stopped matching passes
      # every file, so prove it still works before trusting a pass. The scan
      # then walks the tree rather than taking a list of changed files --
      # pre-commit's `files:` pattern lives in another file and could drift,
      # and a salt that arrived on a branch nobody ran the hook on has to fail
      # here rather than at publication.
      - name: Committed-secret guard
        run: |
          python3 infra/scripts/assert-no-committed-pulumi-secrets.py --self-test
          python3 infra/scripts/assert-no-committed-pulumi-secrets.py --scan-tree .

      # The delete guard's own gate runs in the hosts plan/apply jobs, where
      # the plan exists; this proves on every push that the guard itself
      # still refuses what it exists to refuse and that its coverage map
      # still matches the program tree.
      - name: Hetzner delete guard self-test
        run: |
          python3 infra/scripts/assert-no-hetzner-deletes.py --self-test
          python3 infra/scripts/assert-no-hetzner-deletes.py --verify-coverage infra/hosts

      # db1's own scripts: tenant provisioning, the encrypted dump and
      # binlog-shipping pipelines. Every external command (mysql, mysqldump,
      # mysqlbinlog, age) and every network call is mocked, so this needs no
      # cloud credential and no live host.
      - name: Database stack script tests
        run: python3 -m unittest discover -s db/provision -p 'test_*.py'

      # The app hosts' own per-tenant step. It owns the one runtime-isolation
      # control that fails open -- without it a tenant container still starts,
      # on a volume the Ghost image leaves world-writable -- so its refusals
      # are covered here rather than by a live host. Every `docker` call is
      # mocked; no daemon, no root.
      - name: Replica tunnel account tests
        run: python3 -m unittest discover -s db/tunnel -p 'test_*.py'

      - name: Replica tunnel shellcheck
        run: shellcheck db/tunnel/*.sh

      # The demo go-live step (demo-host/provision/demo_go_live.py): each refusal of the demo go-live step dropped in a scratch copy: the suite
      # must go red for every one, and green on the real copy.
      - name: Demo go-live sabotage proof
        run: python3 demo-host/provision/sabotage_demo_go_live.py

      - name: App host provisioning script tests
        run: python3 -m unittest discover -s app/provision -p 'test_*.py'

      # The demo host's sudoers boundary generator. Its property is
      # exactness -- every one of the enumerated invocations present, no
      # wildcard anywhere -- so these tests assert the generated text
      # directly rather than trusting the generator's own logic to be
      # self-evidently right.
      - name: Demo host provisioning script tests
        run: python3 -m unittest discover -s demo-host/provision -p 'test_*.py'

      # The demo host mail spool workflow starts only on a path in its filter.
      # This derives the job's real inputs (render-core's build, the scripts it
      # runs, the whole of demo-host/provision) and fails for one outside the
      # filter, for the two events differing, or for an entry matching nothing.
      - name: Demo host mail spool CI path filter tests
        run: python3 -m unittest discover -s scripts -p 'test_demo_host_mail_spool_ci_paths.py'

      # A workflow that filters pull requests by path must filter its push to
      # main the same way, or every merge re-runs it on a diff it never reads.
      # Fails for a path-less push not listed, with a reason, as an exception.
      - name: Workflow push path filter test
        run: python3 -m unittest discover -s scripts -p 'test_workflow_push_paths.py'

      # Each gate of the demo site block broken in a scratch copy: the suite must
      # go red for every one, and green on the real copy.
      - name: Demo site block sabotage proof
        run: python3 demo-host/provision/sabotage_render_demo_site.py

      # The control host's backup-worker installer. Its tests also tie the
      # units and the required environment to the scripts they run, so a
      # change on either side fails here rather than on the host.
      - name: Control host provisioning script tests
        run: python3 -m unittest discover -s control/provision -p 'test_*.py'

      # registers/tenant-names.json is the only list of taken tenant names. The
      # two published TypeScript packages carry generated copies of it, and a
      # register edit that was not regenerated, or a hand edit to a copy, fails
      # here. The self-test first: a check that no longer sees drift passes all.
      - name: Tenant name register is in step with its copies
        run: |
          python3 scripts/sync-tenant-name-register.py --self-test
          python3 scripts/sync-tenant-name-register.py --check

      # The same tenant-slug rule is written four times here, each read on a
      # different host with no shared import (see the script's docstring), so
      # one copy can drift loose without any other test going red. This is
      # the comparison, and it self-tests first because a comparator that has
      # quietly stopped comparing passes every copy.
      - name: Tenant-slug pattern consistency
        run: |
          python3 scripts/assert-slug-pattern-consistency.py --self-test
          python3 scripts/assert-slug-pattern-consistency.py

      # The Mollie test-charge script must refuse any key that is not a test
      # key before a network call, and its workflow must stay dispatch-only,
      # behind the production environment, with the key bound to one step.
      # The HTTP layer is a fake; nothing reaches Mollie.
      - name: Mollie test-charge script and workflow tests
        run: python3 -m unittest discover -s scripts -p 'test_mollie_test_charge.py' -v

      # generate-lockfile.yml trusts this gate to keep its `workflow_dispatch`
      # input from reaching the filesystem or a shell as anything other than
      # `services/<name>` or `adapters/<name>` -- self-tested here, on every
      # push, rather than only when someone remembers to run it by hand.
      - name: Lockfile package_dir allow-list self-test
        run: python3 scripts/assert-lockfile-package-dir.py --self-test

      # Every pnpm workspace that consumes a @branchleft package must exclude
      # that scope from minimumReleaseAge, so our own fresh releases install in
      # CI. Third-party packages keep the default cutoff. The check reads the
      # tree on every push; its self-test proves the matcher still fails a bare
      # consumer.
      - name: Release-age exclude self-test
        run: python3 scripts/assert-release-age-exclude.py --self-test

      - name: Release-age exclude across consuming workspaces
        run: python3 scripts/assert-release-age-exclude.py .

      # The comparison that keeps each contract's committed generated code equal
      # to what Speckify generates runs in speckify.yml, where Speckify has run.
      # Only its matcher is exercised here, on every push, so a guard that has
      # quietly stopped comparing is found before a spec change relies on it.
      - name: Contract drift guard self-test
        run: python3 scripts/assert-contracts-generated.py --self-test

      # The no-op deploy gate's contract, checked on every pull request and on
      # push to main. Each check reads one workflow file, so each infra workflow
      # gets its own step here: the infra workflows are path-filtered, and a
      # check there would not run on a pull request that breaks the gate.
      - name: Check the apply gate (hosts)
        uses: branchLeft/github-workflows/.github/actions/check-apply-gate@ea6de91ba90ed9a3a988ae8ffa0e9d70dd42f691 # v1.0.19
        with:
          workflow: .github/workflows/infra-hosts-ci.yml
          pairs: plan:apply
          verdict-step: noop
          summary-step: Write the plan to the job summary
          plan-file: preview-plan.json

      - name: Check the apply gate (demo host)
        uses: branchLeft/github-workflows/.github/actions/check-apply-gate@ea6de91ba90ed9a3a988ae8ffa0e9d70dd42f691 # v1.0.19
        with:
          workflow: .github/workflows/infra-demo-host-ci.yml
          pairs: plan:apply
          verdict-step: noop
          summary-step: Write the plan to the job summary
          plan-file: preview-plan.json
