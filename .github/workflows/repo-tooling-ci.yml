name: Repo tooling CI

# Prettier, ESLint and the committed-secret guard over the whole tree, from the
# repo root. The guard lives here rather than in infra-platform-ci.yml because
# it scans every `Pulumi.<stack>.yaml` in the tree, across all three Pulumi
# projects, and this is the one job whose scope is the repository.
#
# The four npm projects here each type-check and test themselves, but nothing
# ran the root `format:check` or `lint:check` — they existed only as pre-commit
# hooks, which are opt-in per clone and skipped by `--no-verify`. Formatting is
# also the one check whose scope can shrink silently: the ignore set is spread
# across `.gitignore`, `.prettierignore` and the shared set, and a change to any
# of them still exits 0 while checking less.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# `packages: read` because the root tooling install pulls
# `@branchleft/prettier-config` from GitHub Packages, which answers 401 to an
# anonymous request even for a public package.
permissions:
  contents: read
  packages: read

jobs:
  format-and-lint:
    name: Format and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'
          cache: npm
          cache-dependency-path: package-lock.json

      # Pinned rather than inherited from the runner image. Every Python check
      # below is `python3 -m unittest discover`, which reports success for a
      # module it could not import -- so a syntax feature the runner's default
      # interpreter happens to support, and a host's does not, silently drops
      # whole test classes instead of failing. The version has to be a stated
      # input for that to be caught here rather than in production.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint:check

      # Self-test first: a matcher that has quietly stopped matching passes
      # every file, so prove it still works before trusting a pass. The scan
      # then walks the tree rather than taking a list of changed files --
      # pre-commit's `files:` pattern lives in another file and could drift,
      # and a salt that arrived on a branch nobody ran the hook on has to fail
      # here rather than at publication.
      - name: Committed-secret guard
        run: |
          python3 infra/scripts/assert-no-committed-pulumi-secrets.py --self-test
          python3 infra/scripts/assert-no-committed-pulumi-secrets.py --scan-tree .

      # The delete guard's own gate runs in the hosts plan/apply jobs, where
      # the plan exists; this proves on every push that the guard itself
      # still refuses what it exists to refuse and that its coverage map
      # still matches the program tree.
      - name: Hetzner delete guard self-test
        run: |
          python3 infra/scripts/assert-no-hetzner-deletes.py --self-test
          python3 infra/scripts/assert-no-hetzner-deletes.py --verify-coverage infra/hosts

      # db1's own scripts: tenant provisioning, the encrypted dump and
      # binlog-shipping pipelines. Every external command (mysql, mysqldump,
      # mysqlbinlog, age) and every network call is mocked, so this needs no
      # cloud credential and no live host.
      - name: Database stack script tests
        run: python3 -m unittest discover -s db/provision -p 'test_*.py'

      # The app hosts' own per-tenant step. It owns the one runtime-isolation
      # control that fails open -- without it a tenant container still starts,
      # on a volume the Ghost image leaves world-writable -- so its refusals
      # are covered here rather than by a live host. Every `docker` call is
      # mocked; no daemon, no root.
      - name: App host provisioning script tests
        run: python3 -m unittest discover -s app/provision -p 'test_*.py'
