name: Scanning storage adapter CI

# Unit tests and the coverage floor for the scanning storage decorator
# (adapters/scanning-storage/). The proof against a real Ghost runs in
# build.yml, next to the image it needs.

on:
  push:
    branches: [main]
    paths:
      - 'adapters/scanning-storage/**'
      - 'Dockerfile'
      - 'render-core/test/golden/**'
      # The held-media backup proof runs the real media backup and restore.
      - 'infra/provisioning/scripts/media_backup_restore.py'
      - 'infra/provisioning/scripts/media_backup_held_proof.py'
      - 'infra/provisioning/scripts/shared_objectstorage.py'
      - 'db/provision/objectstorage.py'
      - '.python-version'
      - '.github/workflows/scanning-storage-ci.yml'
  # A pull request starts this only when its diff touches something the job
  # reads: the adapter, the root Dockerfile (a unit test reads it) and
  # render-core's golden files (a unit test compares against them). A push to
  # main starts it on the same paths.
  pull_request:
    branches: [main]
    paths:
      - 'adapters/scanning-storage/**'
      - 'Dockerfile'
      - 'render-core/test/golden/**'
      # The held-media backup proof runs the real media backup and restore.
      - 'infra/provisioning/scripts/media_backup_restore.py'
      - 'infra/provisioning/scripts/media_backup_held_proof.py'
      - 'infra/provisioning/scripts/shared_objectstorage.py'
      - 'db/provision/objectstorage.py'
      - '.python-version'
      - '.github/workflows/scanning-storage-ci.yml'

permissions:
  contents: read

# One run per pull request: a newer push cancels the superseded run. A push,
# merge_group, schedule or manual run is its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: scanning storage adapter unit tests
    runs-on: ubuntu-latest
    # Install plus a two-second vitest run; the bound is generous.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: adapters/scanning-storage

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # The version Ghost runs the adapter on inside the pinned image.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: adapters/scanning-storage/.nvmrc
          cache: pnpm
          cache-dependency-path: adapters/scanning-storage/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The held-media backup proof drives the real media backup and restore
      # (Python, with `age`) over fixture directories. A missing tool fails
      # that test in CI rather than skipping it.
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      # The same pinned, checksummed release infra-provisioning-scripts-ci.yml installs.
      - name: Install age (pinned)
        working-directory: /tmp
        run: |
          set -e
          AGE_VERSION=v1.3.1
          AGE_TARBALL=age-${AGE_VERSION}-linux-amd64.tar.gz
          AGE_SHA256=bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377
          curl -sL -o "$AGE_TARBALL" \
            "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/${AGE_TARBALL}"
          echo "${AGE_SHA256}  ${AGE_TARBALL}" | sha256sum -c -
          tar -xzf "$AGE_TARBALL"
          sudo install -m 0755 age/age age/age-keygen /usr/local/bin/
          age --version

      - name: Test with coverage
        run: pnpm run coverage
