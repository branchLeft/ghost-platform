# Installed at /etc/systemd/system/branchleft-compose@db.service.d/override.conf
# -- an instance override, not a change to the shared
# branchleft-compose@.service template, which lives in branchLeft/shared-infra
# and is installed on every host role.
#
# Installed by db/RUNBOOK-db.md. shared-infra's
# hetzner/provision/install-systemd-drop-ins.sh would match this file if
# pointed here -- its glob is */systemd/*.override.conf and it takes
# HETZNER_ROOT as an override -- but nothing points it here, and no host
# provisioning run does. So this file reaches db1 by hand and by nothing else,
# which is why db/systemd/** is registered as a hand-delivered path.
#
# It is committed beside the stack it overrides rather than in shared-infra: a
# db-shaped file there would put half this stack in a repository that owns
# none of the rest of it.
#
# The ExecStartPre below is additive. systemd appends a drop-in's ExecStartPre
# after the template's own `docker compose pull`; it does not replace it.
#
# There is deliberately no `EnvironmentFile=` reset here. This stack resolves
# `image: ${IMAGE}`, so /etc/branchleft/db.image.env is written by
# branchleft-deploy and the template's mandatory pin is correct for it. A
# reset would silently drop that pin -- it belongs only to stacks that pin
# inline, which this one does not.
[Service]
# The exporter's .my.cnf does not exist until this has run at least once, and
# Docker creates a *directory* at a bind-mount source it cannot find, which
# fails the container in a way that names neither this file nor the password
# it is missing. Running it before every start also means a rotation in
# /etc/branchleft/db.env takes effect on `systemctl restart
# branchleft-compose@db` with no second step to remember.
#
# The template already loads /etc/branchleft/db.env, so EXPORTER_MYSQL_PWD is
# in this process's environment without the script reading the file itself.
ExecStartPre=/usr/bin/python3 /opt/branchleft/db/provision/render_exporter_my_cnf.py
