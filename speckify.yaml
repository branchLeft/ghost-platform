# Two contracts. Each spec stays beside the code that serves it; this file only
# names the packages generated from it and where they publish.
#   broker-api        the broker's signed host API (services/broker/openapi.yaml)
#   provisioning-api  what the portal and the owner console ask of tenant
#                     provisioning (services/provisioning-controller/openapi.yaml)
contracts:
  - name: broker-api
    spec: ./services/broker/openapi.yaml
    typescript:
      package: '@branchleft/ghost-platform-broker-api'
      client: true
      server: true
  - name: provisioning-api
    spec: ./services/provisioning-controller/openapi.yaml
    typescript:
      package: '@branchleft/ghost-platform-provisioning-api'
      client: true
      server: true

publish:
  githubPackages:
    owner: branchleft
