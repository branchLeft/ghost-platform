exclude: ^graphify-out/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        # A unified diff carries a lone space for each blank context line;
        # stripping it breaks the patch (adapters/sso/ghost-core-overlay/,
        # adapters/stripe-connect-limit/ghost-core-overlay/).
        # themes/licences/ holds upstream licence texts, pinned by sha256 in
        # themes/manifest.json; stripping their trailing blanks changes the bytes.
        exclude: ^(widgets/dist/|themes/licences/|adapters/(sso|stripe-connect-limit)/ghost-core-overlay/.*\.patch$)
      - id: end-of-file-fixer
        # widgets/dist/ is vendored third-party bundles, content-addressed by
        # sha384 in widgets/pins.json -- adding a trailing newline changes
        # the bytes and breaks the pin. The Kalotyp bundle has the same
        # problem: its sha256 pin in vendor/kalotyp/kalotyp.sha256 would break.
        # The licence texts under themes/licences/ are pinned the same way.
        # Applied drizzle migrations are pinned by the sha256 of their bytes,
        # stored in each database's migration history and compared by
        # portal/data/provision/provisionPortal.ts; a trailing newline would
        # make every applied database read as drifted.
        exclude: ^(widgets/dist/|themes/licences/|vendor/kalotyp/kalotyp\.(js|css)$|(portal/data|services/[^/]+)/drizzle/.*\.sql$)
      - id: check-yaml
      # Stated rather than inherited: the hook's own default has moved before,
      # and this threshold is meant to be the same number in every repo.
      - id: check-added-large-files
        args: ['--maxkb=500']
        # Same vendored, pinned bundles as above -- Portal's UMD build alone
        # is ~2.3MB. Size is not a risk signal for a file whose exact byte
        # count is already recorded and checked against widgets/pins.json.
        exclude: ^widgets/dist/
      - id: check-merge-conflict

  - repo: local
    hooks:
      # Runs prettier straight from node_modules, not through `pnpm run format`.
      # pnpm 11 (packageManager in package.json) needs node >=22.13, and on a
      # workstation whose node is 20.x the `pnpm` on PATH is a corepack shim that
      # dies with ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING (branchLeft/workspace#3996).
      # The command is the `format` script's command with the same ignore paths.
      # This hook does not install: a tree with no node_modules stops and says so.
      # A node_modules that is a symlink (a worktree sharing another clone's install)
      # stops the hook as well.
      - id: prettier
        name: prettier
        entry: sh -c 'if [ -L node_modules ]; then echo "pre-commit stopped, node_modules is a symlink to another clone install. Fix, in this worktree run pnpm install --frozen-lockfile --ignore-scripts, then commit again." >&2; exit 1; fi; if [ ! -f node_modules/prettier/bin/prettier.cjs ]; then echo "pre-commit stopped, node_modules has no prettier. In this worktree run pnpm install --frozen-lockfile --ignore-scripts, then commit again." >&2; exit 1; fi; node node_modules/prettier/bin/prettier.cjs --write . --ignore-path .gitignore --ignore-path .prettierignore --ignore-path node_modules/@branchleft/prettier-config/prettierignore'
        language: system
        files: '\.(js|mjs|ts|json|yml|yaml|md)$'
        pass_filenames: false

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: sh -c 'if [ -L node_modules ]; then echo "pre-commit stopped, node_modules is a symlink to another clone install. Fix, in this worktree run pnpm install --frozen-lockfile --ignore-scripts, then commit again." >&2; exit 1; fi; pnpm_config_ignore_scripts=true pnpm run lint'
        language: system
        files: '\.(js|ts)$'
        pass_filenames: false

  - repo: local
    hooks:
      # Split in two, deliberately. The self-test is hermetic — fixtures in the
      # script and a temp directory — so it must pass in every state of the
      # tree and can run on every edit to the checker. The real check has a
      # verdict about this checkout's files and runs when one of them changes.
      # The matcher is the whole guard here: an over-broad pattern flags a key
      # that merely contains the word, an over-anchored one stops flagging
      # anything, and either failure is silent without a test asserting both
      # directions.
      - id: pulumi-secrets-guard-selftest
        name: committed-secret guard self-test
        entry: python3 infra/scripts/assert-no-committed-pulumi-secrets.py --self-test
        language: system
        files: '^infra/scripts/assert-no-committed-pulumi-secrets\.py$'
        pass_filenames: false

      - id: no-committed-pulumi-secrets
        name: 'no encryptionsalt in a committed stack config'
        entry: python3 infra/scripts/assert-no-committed-pulumi-secrets.py
        language: system
        files: '^(.*/)?Pulumi\.[^/]+\.yaml$'
